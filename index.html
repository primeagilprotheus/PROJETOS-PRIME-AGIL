  const mesesDisponiveis = [...new Map(
    [...AGENDA_VIGENTE, ...CANCELAMENTOS].map(r => [`${r.mes}|${r.ano}`, { mes:r.mes, ano:r.ano }])
  ).values()].sort((a,b)=> a.ano-b.ano || MESES_PT.indexOf(a.mes)-MESES_PT.indexOf(b.mes));
  if (!mesesDisponiveis.some(m=>m.mes===CONFIG.mesReferencia && m.ano===CONFIG.anoReferencia)){
    mesesDisponiveis.push({ mes: CONFIG.mesReferencia, ano: CONFIG.anoReferencia });
  }
  const mesSelecionado = state.vigenteMesSelecionado || `${CONFIG.mesReferencia}|${CONFIG.anoReferencia}`;
  const [mesSel, anoSelStr] = mesSelecionado.split('|');
  const anoSel = parseInt(anoSelStr, 10);

  const fonteBase = tab==='agenda' ? AGENDA_VIGENTE : CANCELAMENTOS;
  const fonte = fonteBase.filter(r => r.mes===mesSel && r.ano===anoSel);

  const fCliente = state.vigenteFiltroCliente || '';
  const fAnalista = state.vigenteFiltroAnalista || '';
  const fGdr = state.vigenteFiltroGdr || '';
  const fPeriodo = state.vigenteFiltroPeriodo || '';
  const fTipo = state.vigenteFiltroTipo || '';
  const ordem = state.vigenteOrdem || 'data';

  const nomeCliente = r => r.clienteId ? (clientById(r.clienteId)?.nome || r.clienteNomePlanilha) : r.clienteNomePlanilha;
  const nomeAnalista = r => {
    if (!r.analistaId) return r.analistaNomePlanilha;
    const a = userById(r.analistaId);
    if (!a) return r.analistaNomePlanilha;
    return a.ativo===false ? `${a.name} (indisponível)` : a.name;
  };
  // GDR: a coluna da planilha quase sempre vem vazia — casamos pelo GDR já
  // cadastrado no cliente, que é confiável.
  const gdrDe = r => (r.clienteId && clientById(r.clienteId)?.gdrNome) || '';

  let list = fonte;
  if(fCliente) list = list.filter(r => String(r.clienteId||'') === fCliente);
  if(fAnalista) list = list.filter(r => String(r.analistaId||'') === fAnalista);
  if(fGdr) list = list.filter(r => gdrDe(r) === fGdr);
  if(fPeriodo) list = list.filter(r => r.periodo === fPeriodo);
  if(fTipo) list = list.filter(r => r.tipoAgenda === fTipo);

  const comparadores = {
    data: (a,b) => (a.data||'').localeCompare(b.data||'') || nomeAnalista(a).localeCompare(nomeAnalista(b)),
    analista: (a,b) => nomeAnalista(a).localeCompare(nomeAnalista(b)) || (a.data||'').localeCompare(b.data||''),
    cliente: (a,b) => nomeCliente(a).localeCompare(nomeCliente(b)) || (a.data||'').localeCompare(b.data||''),
    gdr: (a,b) => gdrDe(a).localeCompare(gdrDe(b)) || (a.data||'').localeCompare(b.data||''),
  };
  list = [...list].sort(comparadores[ordem] || comparadores.data);

  // Opções dos filtros vêm sempre da fonte COMPLETA da aba (não da lista já
  // filtrada), senão os dropdowns iam encolhendo conforme a pessoa filtra.
  const clientesNaFonte = [...new Map(fonte.filter(r=>r.clienteId).map(r=>[r.clienteId, clientById(r.clienteId)?.nome || r.clienteNomePlanilha])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));
  const analistasNaFonte = [...new Map(fonte.filter(r=>r.analistaId).map(r=>[r.analistaId, userById(r.analistaId)?.name || r.analistaNomePlanilha])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));
  const gdrsNaFonte = [...new Set(fonte.map(gdrDe).filter(Boolean))].sort();
  const periodosNaFonte = [...new Set(fonte.map(r=>r.periodo).filter(Boolean))].sort();
  const tiposNaFonte = [...new Set(fonte.map(r=>r.tipoAgenda).filter(Boolean))].sort();
  const totalHoras = list.reduce((s,r)=>s+(r.horas||0), 0);
  const temFiltroAtivo = fCliente || fAnalista || fGdr || fPeriodo || fTipo;

  return `
  <div class="topbar">
    <div><h1>Cronograma Vigente</h1><div class="sub">Mês de referência do sistema: <b style="color:var(--text-0);">${CONFIG.mesReferencia}/${CONFIG.anoReferencia}</b>. Filtre igual na planilha.${podeEditar? '' : ' Você está em modo visualização.'}</div></div>
    ${podeEditar && tab==='agenda' ? `<button class="btn btn-primary" data-action="openVigenteViewModal" data-args='[]'>+ Nova agenda</button>` : ''}
  </div>

  ${podeEditar ? `
  <div class="panel" style="margin-bottom:18px;">
    <div class="panel-body" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
      <div class="cell-sub" style="flex:1;min-width:260px;">
        Quando o Cronograma Futuro do próximo mês já estiver ajustado (geralmente por volta do dia 16), promova ele pro Vigente — o sistema desloca o mês de referência e passa a olhar mais à frente no Setup/Futuro.
      </div>
      <button class="btn btn-ghost btn-sm" data-action="promoverMesParaVigente" data-args='[]' ${state.promovendoMes?'disabled':''}>${state.promovendoMes?'Promovendo…':'⏭️ Promover próximo mês pro Vigente'}</button>
      ${(() => {
        const ultima = PROMOCOES_MES.find(p=>!p.desfeita);
        if(!ultima) return '';
        const label = `${ultima.mesPromovido[0].toUpperCase()}${ultima.mesPromovido.slice(1)}/${ultima.anoPromovido}`;
        return `<button class="btn btn-ghost btn-sm" data-action="desfazerPromocaoMes" data-args='[]' ${state.desfazendoPromocao?'disabled':''}>${state.desfazendoPromocao?'Desfazendo…':`↩️ Desfazer promoção de ${label}`}</button>`;
      })()}
    </div>
  </div>` : ''}

  <div class="field" style="max-width:260px;margin-bottom:18px;">
    <label>Mês</label>
    <select data-input="setVigenteMesSelecionado">
      ${mesesDisponiveis.map(m=>{
        const val = `${m.mes}|${m.ano}`;
        const ehRef = m.mes===CONFIG.mesReferencia && m.ano===CONFIG.anoReferencia;
        return `<option value="${val}" ${mesSelecionado===val?'selected':''}>${m.mes[0].toUpperCase()}${m.mes.slice(1)}/${m.ano}${ehRef?' (atual)':''}</option>`;
      }).join('')}
    </select>
  </div>

  <div class="pill-tabs" style="margin-bottom:18px;">
    <button class="pill-tab ${tab==='agenda'?'active':''}" data-action="setVigenteViewTab" data-args='["agenda"]'>Agenda (${AGENDA_VIGENTE.filter(r=>r.mes===mesSel&&r.ano===anoSel).length})</button>
    <button class="pill-tab ${tab==='cancelamentos'?'active':''}" data-action="setVigenteViewTab" data-args='["cancelamentos"]'>Cancelamentos (${CANCELAMENTOS.filter(r=>r.mes===mesSel&&r.ano===anoSel).length})</button>
  </div>

  <div class="panel" style="margin-bottom:18px;">
    <div class="panel-body">
      <div class="vg-filtros">
        <div class="field" style="margin-bottom:0;">
          <label>Cliente</label>
          <select data-input="setVigenteFiltroCliente">
            <option value="">Todos</option>
            ${clientesNaFonte.map(([id,nome])=>`<option value="${id}" ${fCliente===String(id)?'selected':''}>${nome}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Analista</label>
          <select data-input="setVigenteFiltroAnalista">
            <option value="">Todos</option>
            ${analistasNaFonte.map(([id,nome])=>`<option value="${id}" ${fAnalista===String(id)?'selected':''}>${nome}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>GDR</label>
          <select data-input="setVigenteFiltroGdr">
            <option value="">Todos</option>
            ${gdrsNaFonte.map(g=>`<option ${fGdr===g?'selected':''}>${g}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Período</label>
          <select data-input="setVigenteFiltroPeriodo">
            <option value="">Todos</option>
            ${periodosNaFonte.map(p=>`<option ${fPeriodo===p?'selected':''}>${p}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Tipo de agenda</label>
          <select data-input="setVigenteFiltroTipo">
            <option value="">Todos</option>
            ${tiposNaFonte.map(t=>`<option ${fTipo===t?'selected':''}>${t}</option>`).join('')}
          </select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label>Ordenar por</label>
          <select data-input="setVigenteOrdem">
            <option value="data" ${ordem==='data'?'selected':''}>Data</option>
            <option value="analista" ${ordem==='analista'?'selected':''}>Analista</option>
            <option value="cliente" ${ordem==='cliente'?'selected':''}>Cliente</option>
            <option value="gdr" ${ordem==='gdr'?'selected':''}>GDR</option>
          </select>
        </div>
        ${temFiltroAtivo? `<button class="btn btn-ghost btn-sm" data-action="limparFiltrosVigente" data-args='[]' style="align-self:flex-end;">✕ Limpar filtros</button>` : ''}
      </div>
    </div>
  </div>

  <div class="toolbar" style="margin-bottom:14px;">
    <span class="badge badge-info">${list.length} registro(s)</span>
    ${tab==='agenda'? `<span class="badge badge-ok">${fmtH(totalHoras)}h no total</span>` : ''}
  </div>

  ${list.length===0 ? `<div class="panel">${emptyState('📅', fonte.length===0 ? 'Nenhum registro encontrado — importe o Cronograma Vigente na página Disponibilidade.' : 'Nenhum registro bate com esses filtros.')}</div>` : `
  <div class="panel"><div class="panel-body" style="padding:0;max-height:640px;overflow:auto;">
    ${tab==='agenda' ? (() => {
      const mostrarColunaAcoes = podeEditar || list.some(r=>podeEditarRdaDaAgenda(r, state.authUser));
      return `
    <table>
      <thead><tr><th>Data</th><th>Dia da semana</th><th>Analista</th><th>Cliente</th><th>GDR</th><th>Tipo</th><th>Período</th><th>Horas</th><th>RDA</th>${mostrarColunaAcoes?'<th></th>':''}</tr></thead>
      <tbody>
        ${list.map(r=>{
          const podeEditarRda = podeEditarRdaDaAgenda(r, state.authUser);
          return `
          <tr class="tr-hover">
            <td class="mono">${fmtDate(r.data)}</td>
            <td class="cell-sub">${diaSemanaDe(r.data)}</td>
            <td>${r.analistaId ? (userById(r.analistaId) ? (userById(r.analistaId).ativo===false ? `${userById(r.analistaId).name} (indisponível)` : userById(r.analistaId).name) : r.analistaNomePlanilha) : `<span class="cell-sub">${r.analistaNomePlanilha} (não casado)</span>`}</td>
            <td>${r.clienteId ? (clientById(r.clienteId)?.nome || r.clienteNomePlanilha) : `<span class="cell-sub">${r.clienteNomePlanilha} (não casado)</span>`}</td>
            <td class="cell-sub">${gdrDe(r)||'—'}</td>
            <td class="cell-sub">${r.tipoAgenda||'—'}</td>
            <td>${r.periodo||'—'}</td>
            <td class="mono">${fmtH(r.horas)}h</td>
            <td style="white-space:nowrap;">${r.rdaUrl
              ? `<a href="${r.rdaUrl}" target="_blank" rel="noopener" class="badge badge-ok" style="text-decoration:none;">🔗 Ver RDA</a>${podeEditarRda?` <button class="btn btn-ghost btn-sm" data-action="abrirModalRdaUrl" data-args='["${r.id}"]'>✎</button>`:''}`
              : (podeEditarRda ? `<button class="btn btn-ghost btn-sm" data-action="abrirModalRdaUrl" data-args='["${r.id}"]'>+ RDA</button>` : `<span class="badge badge-warn">Pendente</span>`)}
            </td>
            ${mostrarColunaAcoes ? `
            <td style="text-align:right;white-space:nowrap;">
              ${podeEditar? `<button class="btn btn-ghost btn-sm" data-action="openVigenteViewModal" data-args='["${r.id}"]'>✎ Editar</button>` : ''}
              ${podeEditarRda? `<button class="btn btn-ghost btn-sm" data-action="enviarConviteVigente" data-args='["${r.id}"]'>📤 Enviar</button>` : ''}
              ${podeEditar? `<button class="btn btn-ghost btn-sm" data-action="abrirModalCancelarAgenda" data-args='["vigente","${r.id}"]'>🚫 Cancelar</button>` : ''}
            </td>` : ''}
          </tr>`;}).join('')}
      </tbody>
    </table>`;
    })() : `
    <table>
      <thead><tr><th>Data original</th><th>Dia da semana</th><th>Analista</th><th>Cliente</th><th>GDR</th><th>Cancelado em</th><th>Antecedência</th><th>Causador</th><th>Justificativa</th>${podeEditar?'<th></th>':''}</tr></thead>
      <tbody>
        ${list.map(r=>`
          <tr class="tr-hover">
            <td class="mono">${fmtDate(r.data)}</td>
            <td class="cell-sub">${diaSemanaDe(r.data)}</td>
            <td>${r.analistaId ? (userById(r.analistaId) ? (userById(r.analistaId).ativo===false ? `${userById(r.analistaId).name} (indisponível)` : userById(r.analistaId).name) : r.analistaNomePlanilha) : `<span class="cell-sub">${r.analistaNomePlanilha} (não casado)</span>`}</td>
            <td>${r.clienteId ? (clientById(r.clienteId)?.nome || r.clienteNomePlanilha) : `<span class="cell-sub">${r.clienteNomePlanilha} (não casado)</span>`}</td>
            <td class="cell-sub">${gdrDe(r)||'—'}</td>
            <td class="cell-sub">${r.dataCancelamento? fmtDate(r.dataCancelamento) : '—'}</td>
            <td>${r.comAntecedencia||'—'}</td>
            <td class="cell-sub">${r.causador||'—'}</td>
            <td class="cell-sub">${r.justificativa||'—'}</td>
            ${podeEditar? `
            <td style="text-align:right;white-space:nowrap;">
              <button class="btn btn-ghost btn-sm" data-action="excluirVigenteViewRow" data-args='["${r.id}","cancelamentos"]'>🗑</button>
            </td>` : ''}
          </tr>`).join('')}
      </tbody>
    </table>`}
  </div></div>`}
  `;
}

// Move tudo que o Cronograma Futuro tem pro PRÓXIMO mês de referência (o
// primeiro dos 3 meses futuros) pro Cronograma Vigente, tira essas linhas
// do Futuro, e avança o mês de referência do sistema — Setup e Futuro
// passam a olhar só pra frente disso.
async function promoverMesParaVigente(){
  if(!podeEditarVigente(state.authUser.role)){ toast('Só o RMO pode promover o mês.', 'err'); return; }
  const proximo = proximosMesesFuturo(1)[0];
  const rows = AGENDA_FUTURA.filter(a => a.mes===proximo.mes && a.ano===proximo.ano);

  // Antes de promover, confere se tem conflito de horário (mesma lógica já
  // usada na tela do Cronograma Futuro) — promover pro Vigente com
  // conflito significaria levar o problema pra agenda "100% confirmada",
  // que é justamente o que não pode acontecer.
  const idsConflitantes = computeConflitosFuturo(rows);
  if (idsConflitantes.size > 0){
    const linhasConflitantes = rows.filter(r => idsConflitantes.has(r.id));
    const porAnalistaData = {};
    for (const r of linhasConflitantes){
      const nome = r.analistaId ? (userById(r.analistaId)?.name || r.analistaNomePlanilha) : r.analistaNomePlanilha;
      const chave = `${nome} — ${fmtDate(r.data)}`;
      (porAnalistaData[chave] = porAnalistaData[chave] || []).push(`${r.periodo} (${r.clienteId?clientById(r.clienteId)?.nome:r.clienteNomePlanilha})`);
    }
    const detalhes = Object.entries(porAnalistaData).map(([chave, periodos]) => `• ${chave}: ${periodos.join(' + ')}`).join('\n');
    toast(`Não dá pra promover ${proximo.label} — tem ${Object.keys(porAnalistaData).length} conflito(s) de horário no Cronograma Futuro. Corrija antes de promover.`, 'err');
    alert(`⚠️ Conflito de horário encontrado em ${proximo.label} — corrija no Cronograma Futuro antes de promover:\n\n${detalhes}`);
    return;
  }

  if(!confirm(`Promover ${proximo.label} pro Cronograma Vigente?\n\n${rows.length} registro(s) do Futuro serão movidos pro Vigente. O mês de referência do sistema vai virar ${proximo.label} — Setup e Futuro passam a considerar só os meses seguintes.\n\nSe promover errado, dá pra desfazer depois (o botão "Desfazer última promoção" aparece aqui mesmo).`)) return;

  const mesReferenciaAnterior = CONFIG.mesReferencia, anoReferenciaAnterior = CONFIG.anoReferencia;
  state.promovendoMes = true; render();
  try{
    // Guarda uma cópia completa das linhas do Futuro do jeito que estavam,
    // ANTES de mexer em qualquer coisa — é isso que permite desfazer depois.
    const linhasOriginais = rows.map(r => ({
      analista_id: r.analistaId, analista_nome_planilha: r.analistaNomePlanilha,
      cliente_id: r.clienteId, cliente_nome_planilha: r.clienteNomePlanilha,
      data: r.data, periodo: r.periodo, tipo_agenda: r.tipoAgenda, horas: r.horas,
      origem: r.origem, ticket_id: r.ticketId, mes: r.mes, ano: r.ano, criado_por: state.authUser.id,
    }));

    const vigenteRows = rows.map(r => ({
      analista_id: r.analistaId, analista_nome_planilha: r.analistaNomePlanilha,
      cliente_id: r.clienteId, cliente_nome_planilha: r.clienteNomePlanilha,
      data: r.data, periodo: r.periodo, tipo_agenda: r.tipoAgenda, horas: r.horas,
      ticket_id: r.ticketId, mes: r.mes, ano: r.ano, importado_por: state.authUser.id,
    }));
    const CHUNK = 300;
    const idsVigenteCriados = [];
    for (let i=0; i<vigenteRows.length; i+=CHUNK){
      const { data, error } = await sb.from('crm_agenda_vigente').insert(vigenteRows.slice(i, i+CHUNK)).select('id');
      if (error) throw new Error('Erro ao copiar pro Vigente: ' + error.message);
      idsVigenteCriados.push(...data.map(d=>d.id));
    }

    const { error: delErr } = await sb.from('crm_agenda_futura').delete().eq('mes', proximo.mes).eq('ano', proximo.ano);
    if (delErr) throw new Error('Erro ao limpar do Futuro: ' + delErr.message);

    const { error: cfgErr } = await sb.from('crm_config')
      .update({ mes_referencia: proximo.mes, ano_referencia: proximo.ano, atualizado_por: state.authUser.id })
      .eq('id', 1);
    if (cfgErr) throw new Error('Erro ao avançar o mês de referência: ' + cfgErr.message);
    CONFIG.mesReferencia = proximo.mes; CONFIG.anoReferencia = proximo.ano;

    // Registra o histórico dessa promoção — é isso que o "Desfazer" usa.
    const { error: logErr } = await sb.from('crm_promocoes_mes').insert({
      mes_promovido: proximo.mes, ano_promovido: proximo.ano,
      mes_referencia_anterior: mesReferenciaAnterior, ano_referencia_anterior: anoReferenciaAnterior,
      linhas_originais: linhasOriginais, ids_vigente_criados: idsVigenteCriados,
      executado_por: state.authUser.id,
    });
    if (logErr) toast('Promoção concluída, mas houve erro ao salvar o histórico pra desfazer depois: ' + logErr.message, 'err');

    await Promise.all([loadAgendaVigente(), loadAgendaFutura(), loadPromocoesMes()]);
    state.vigenteMesSelecionado = `${proximo.mes}|${proximo.ano}`;
    toast(`${proximo.label} promovido pro Vigente (${vigenteRows.length} registro${vigenteRows.length===1?'':'s'}). Mês de referência agora é ${proximo.label}.`);
  } catch(err){
    toast('Erro ao promover o mês: ' + (err && err.message ? err.message : err), 'err');
  } finally {
    state.promovendoMes = false; render();
  }
}

function mapPromocaoMesRow(row){
  return {
    id: row.id, mesPromovido: row.mes_promovido, anoPromovido: row.ano_promovido,
    mesReferenciaAnterior: row.mes_referencia_anterior, anoReferenciaAnterior: row.ano_referencia_anterior,
    linhasOriginais: row.linhas_originais, idsVigenteCriados: row.ids_vigente_criados,
    desfeita: row.desfeita, executadoEm: row.executado_em, executadoPor: row.executado_por,
  };
}
async function loadPromocoesMes(){
  const { data, error } = await sb.from('crm_promocoes_mes').select('*').order('executado_em', { ascending:false }).limit(20);
  if(error) throw error;
  PROMOCOES_MES = data.map(mapPromocaoMesRow);
}

// Desfaz a promoção mais recente (a que ainda não foi desfeita): tira as
// linhas que foram criadas no Vigente, devolve elas pro Futuro do jeito que
// estavam antes, e volta o mês de referência pro que era antes da promoção.
async function desfazerPromocaoMes(){
  if(!podeEditarVigente(state.authUser.role)){ toast('Só o RMO pode desfazer uma promoção.', 'err'); return; }
  const promocao = PROMOCOES_MES.find(p=>!p.desfeita);
  if(!promocao){ toast('Não há nenhuma promoção pra desfazer.', 'err'); return; }
  const labelPromovido = `${promocao.mesPromovido[0].toUpperCase()}${promocao.mesPromovido.slice(1)}/${promocao.anoPromovido}`;
  const labelAnterior = `${promocao.mesReferenciaAnterior[0].toUpperCase()}${promocao.mesReferenciaAnterior.slice(1)}/${promocao.anoReferenciaAnterior}`;
  if(!confirm(`Desfazer a promoção de ${labelPromovido}?\n\n${promocao.linhasOriginais.length} registro(s) voltam pro Cronograma Futuro. O mês de referência do sistema volta pra ${labelAnterior}.\n\nAtenção: se você editou, cancelou ou criou novas agendas em ${labelPromovido} DEPOIS da promoção, essas mudanças serão perdidas — a data volta pro estado exato de antes da promoção.`)) return;

  state.desfazendoPromocao = true; render();
  try{
    // Exclui em lotes pequenos — DELETE com .in() bota a lista de ids na
    // própria URL da requisição, e uma promoção grande (centenas de
    // registros) gera uma URL longa demais e o servidor recusa com 400.
    const CHUNK_DEL = 100;
    for (let i=0; i<promocao.idsVigenteCriados.length; i+=CHUNK_DEL){
      const lote = promocao.idsVigenteCriados.slice(i, i+CHUNK_DEL);
      const { error: delErr } = await sb.from('crm_agenda_vigente').delete().in('id', lote);
      if (delErr) throw new Error('Erro ao remover do Vigente: ' + delErr.message);
    }

    const CHUNK = 300;
    for (let i=0; i<promocao.linhasOriginais.length; i+=CHUNK){
      const { error } = await sb.from('crm_agenda_futura').insert(promocao.linhasOriginais.slice(i, i+CHUNK));
      if (error) throw new Error('Erro ao devolver pro Futuro: ' + error.message);
    }

    // Cancelamento só existe como conceito pra agenda VIGENTE — se o mês
    // deixou de ser Vigente (foi despromovido), os cancelamentos daquele
    // mês não representam mais nada válido. Sem essa limpeza, eles ficavam
    // presos no banco e faziam o mês continuar aparecendo no seletor do
    // Cronograma Vigente mesmo depois de desfazer.
    const { error: cancDelErr } = await sb.from('crm_cancelamentos').delete().eq('mes', promocao.mesPromovido).eq('ano', promocao.anoPromovido);
    if (cancDelErr) toast('Revertido, mas houve erro ao limpar os cancelamentos desse mês: ' + cancDelErr.message, 'err');

    const { error: cfgErr } = await sb.from('crm_config')
      .update({ mes_referencia: promocao.mesReferenciaAnterior, ano_referencia: promocao.anoReferenciaAnterior, atualizado_por: state.authUser.id })
      .eq('id', 1);
    if (cfgErr) throw new Error('Erro ao voltar o mês de referência: ' + cfgErr.message);
    CONFIG.mesReferencia = promocao.mesReferenciaAnterior; CONFIG.anoReferencia = promocao.anoReferenciaAnterior;

    const { error: markErr } = await sb.from('crm_promocoes_mes')
      .update({ desfeita: true, desfeita_em: new Date().toISOString(), desfeita_por: state.authUser.id })
      .eq('id', promocao.id);
    if (markErr) toast('Revertido, mas houve erro ao marcar o histórico: ' + markErr.message, 'err');

    await Promise.all([loadAgendaVigente(), loadAgendaFutura(), loadCancelamentos(), loadPromocoesMes()]);
    state.vigenteMesSelecionado = null;
    toast(`Promoção de ${labelPromovido} desfeita — ${promocao.linhasOriginais.length} registro(s) de volta pro Futuro. Mês de referência voltou pra ${labelAnterior}.`);
  } catch(err){
    toast('Erro ao desfazer: ' + (err && err.message ? err.message : err), 'err');
  } finally {
    state.desfazendoPromocao = false; render();
  }
}

// Abre o convite do Google Agenda pra uma agenda que já está confirmada no
// Vigente — substitui o antigo botão de "enviar" que ficava no Setup
// Mensal, agora só disponível aqui em cima de agenda de verdade (não mais
// de uma projeção).
function enviarConviteVigente(id){
  const r = AGENDA_VIGENTE.find(x=>x.id===id);
  if(!r) return;
  if(!podeEditarRdaDaAgenda(r, state.authUser)){ toast('Só o analista da agenda, o GDR da carteira ou quem edita o Vigente pode enviar o convite.', 'err'); return; }
  const cliente = clientById(r.clienteId);
  const analistaUser = userById(r.analistaId);
  const u = state.authUser;
  const horario = TICKET_PERIODO_HORAS[r.periodo] || TICKET_PERIODO_HORAS['Integral'];

  const emails = new Set();
  splitEmails(cliente && cliente.contato).forEach(e=>emails.add(e));
  if (u.email) emails.add(u.email);
  if (analistaUser && analistaUser.email) emails.add(analistaUser.email);
  const dataCompacta = r.data.replace(/-/g,'');
  const gcalDates = `${dataCompacta}T${horario.inicio.replace(':','')}00/${dataCompacta}T${horario.fim.replace(':','')}00`;
  const nomeCliente = cliente ? cliente.nome : r.clienteNomePlanilha;
  const nomeAnalista = analistaUser ? analistaUser.name : r.analistaNomePlanilha;
  const titulo = `Atendimento — ${nomeCliente} (${nomeAnalista})`;
  const detalhes = `Agenda do Cronograma Vigente.\nPeríodo: ${r.periodo||'Integral'}\nAnalista: ${nomeAnalista}${r.tipoAgenda?`\nTipo: ${r.tipoAgenda}`:''}`;
  const gcalUrl = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(titulo)
    + '&dates=' + gcalDates
    + '&details=' + encodeURIComponent(detalhes)
    + (emails.size ? '&add=' + encodeURIComponent([...emails].join(',')) : '');
  window.open(gcalUrl, '_blank');
  toast(`Convite do Google Agenda aberto para ${fmtDate(r.data)} — ${nomeAnalista}.`);
}

async function salvarRdaUrl(){
  if(state.salvandoRdaUrl) return;
  const p = state.modal.payload;
  const url = document.getElementById('rda-url').value.trim();
  if(url && !/^https?:\/\//i.test(url)){ state.rdaUrlErr = 'A URL precisa começar com http:// ou https://'; render(); return; }

  state.salvandoRdaUrl = true; state.rdaUrlErr = null; render();
  try{
    // Importante: o Supabase NÃO retorna erro quando a permissão (RLS)
    // bloqueia silenciosamente um update — ele só afeta 0 linhas. Sem
    // .select() aqui, isso passava despercebido e mostrava "salvo" mesmo
    // sem ter salvo nada.
    const { data, error } = await sb.from('crm_agenda_vigente').update({ rda_url: url || null }).eq('id', p.agendaId).select();
    if(error){ state.rdaUrlErr = 'Erro ao salvar: ' + error.message; return; }
    if(!data || data.length===0){
      state.rdaUrlErr = 'Não foi possível salvar — você não tem permissão pra editar a RDA dessa agenda (só o analista responsável, o GDR da carteira ou quem edita o Vigente).';
      return;
    }
    const r = AGENDA_VIGENTE.find(x=>x.id===p.agendaId);
    if(r) r.rdaUrl = url || null;
    toast(url ? 'RDA salva.' : 'RDA removida.');
    state.modal = null;
  } finally {
    state.salvandoRdaUrl = false; render();
  }
}

  p.clienteNome = clienteNome; p.analistaId = analistaId; p.data = data; p.periodo = periodo; p.horas = horas; p.tipoAgenda = tipoAgenda;

  if(!analistaId){ state.vigenteViewErr = 'Selecione o analista.'; render(); return; }
  if(!data){ state.vigenteViewErr = 'Informe a data.'; render(); return; }

  const mesAtual = CONFIG.mesReferencia;

      if(idx>=0){

          analistaId, analistaNomePlanilha: row.analista_nome_planilha,
          data, periodo, horas, tipoAgenda,

        .insert({ ...row, mes: mesAtual, ano: anoAtual, importado_por: state.authUser.id })

    state.salvandoVigenteView = false; render();

/* ============================================================
   CRONOGRAMA FUTURO — próximos 3 meses (mês atual fica de fora,
   esse já é coberto pelo Cronograma Vigente). Agora é uma tabela
   persistida (crm_agenda_futura), igual ao Vigente — não mais
   calculada na hora a cada render. Populada por:
   1) Botão "Importar Setup" — materializa a projeção do Setup
      Mensal em datas de calendário pros 3 meses futuros.
   2) Agendas criadas via ticket/formulário/manual que caírem
      dentro desses 3 meses (roteadas automaticamente por mês).
   ============================================================ */
function proximosMesesFuturo(qtd){
  const mesIndex0Ref = MESES_PT.indexOf(CONFIG.mesReferencia);
  const anoRef = CONFIG.anoReferencia;
  const out = [];
  for (let i=1; i<=qtd; i++){
    const soma = mesIndex0Ref + i;
    const ano = anoRef + Math.floor(soma/12);
    const mesIndex0 = ((soma % 12) + 12) % 12;
    out.push({ ano, mesIndex0, mes: MESES_PT[mesIndex0], label: `${MESES_PT[mesIndex0][0].toUpperCase()}${MESES_PT[mesIndex0].slice(1)}/${ano}` });
  }
  return out;
}

const FUTURO_IMPORT_ETAPAS = ['Calculando as datas do Setup…', 'Limpando a projeção anterior…', 'Gravando as novas datas…'];
async function materializarSetupParaFuturo(){
  if(!podeEditarFuturo(state.authUser.role)){ toast('Analistas não podem importar o Setup pro Futuro.', 'err'); return; }
  state.futuroImportCarregando = true; state.futuroImportErro = null;
  setImportStatus('futuro', FUTURO_IMPORT_ETAPAS[0]);
  try{
    const meses = proximosMesesFuturo(3);
    const rows = [];
    for (const m of meses){
      for (const r of RECORRENCIA){
        if (!r.ativo || !r.analistaId || !r.clienteId) continue;
        const dt = primeiraDataNoBloco(m.ano, m.mesIndex0, r.semana, r.dia);
        if (!dt) continue;
        const analista = userById(r.analistaId);
        const cliente = clientById(r.clienteId);
        rows.push({
          analista_id: r.analistaId, analista_nome_planilha: analista ? analista.name : r.analistaNomePlanilha,
          cliente_id: r.clienteId, cliente_nome_planilha: cliente ? cliente.nome : r.clienteNomePlanilha,
          data: isoDate(dt), periodo: r.periodo, tipo_agenda: null,
          horas: (TICKET_PERIODO_HORAS[r.periodo]||TICKET_PERIODO_HORAS['Integral']).horas,
          origem: 'setup', mes: m.mes, ano: m.ano, criado_por: state.authUser.id,
        });
      }
    }
    if (rows.length === 0) throw new Error('O Setup Mensal está vazio — não há nada pra projetar.');

    // Não recria datas que alguém já excluiu deliberadamente antes.
    const chaveExclusao = e => `${e.analistaId}|${e.clienteId}|${e.data}|${e.periodo||''}`;
    const excluidas = new Set(AGENDA_FUTURA_EXCLUIDAS.map(chaveExclusao));
    const rowsFiltradas = rows.filter(r => !excluidas.has(chaveExclusao({ analistaId: r.analista_id, clienteId: r.cliente_id, data: r.data, periodo: r.periodo })));
    const qtdRespeitadas = rows.length - rowsFiltradas.length;

    // Só substitui as linhas de origem "setup" desses 3 meses — não mexe em
    // agendas que já vieram de ticket ou foram criadas manualmente aqui.
    setImportStatus('futuro', FUTURO_IMPORT_ETAPAS[1]);
    for (const m of meses){
      const { error } = await sb.from('crm_agenda_futura').delete().eq('mes', m.mes).eq('ano', m.ano).eq('origem', 'setup');
      if (error) throw new Error('Erro ao limpar a projeção anterior: ' + error.message);
    }

    const CHUNK = 300;
    for (let i=0; i<rowsFiltradas.length; i+=CHUNK){
      setImportStatus('futuro', FUTURO_IMPORT_ETAPAS[2], Math.min(i+CHUNK, rowsFiltradas.length), rowsFiltradas.length);
      const { error } = await sb.from('crm_agenda_futura').insert(rowsFiltradas.slice(i, i+CHUNK));
      if (error) throw new Error('Erro ao gravar: ' + error.message);
    }

    await loadAgendaFutura();
    toast(`Setup importado pro Cronograma Futuro: ${rowsFiltradas.length} data(s) preenchida(s) em ${meses.map(m=>m.label).join(', ')}.` + (qtdRespeitadas>0 ? ` (${qtdRespeitadas} não recriada(s) por já terem sido excluídas antes.)` : ''));
  } catch(err){
    state.futuroImportErro = 'Erro ao importar o Setup: ' + (err && err.message ? err.message : err);
  } finally {
    clearImportStatus('futuro');
    state.futuroImportCarregando = false; render();
  }
}

async function salvarFuturoViewRow(){
  if(state.salvandoFuturoView) return;
  if(!podeEditarFuturo(state.authUser.role)){ toast('Analistas não podem editar o Cronograma Futuro.', 'err'); return; }
  const p = state.modal.payload;
  const clienteId = document.getElementById('fv-cliente').value;
  const analistaId = document.getElementById('fv-analista').value;
  const data = document.getElementById('fv-data').value;
  const periodo = document.getElementById('fv-periodo').value;
  const horas = parseFloat(document.getElementById('fv-horas').value) || 0;
  const tipoAgenda = document.getElementById('fv-tipo').value.trim();
  p.clienteId = clienteId; p.analistaId = analistaId; p.data = data; p.periodo = periodo; p.horas = horas; p.tipoAgenda = tipoAgenda;

  // Escolhendo da lista (em vez de digitar o nome), não existe mais como
  // dar "cliente não casado" — o valor do select já É o id do cliente.
  if(!clienteId){ state.futuroViewErr = 'Selecione o cliente.'; render(); return; }
  const cliente = clientById(clienteId);
  if(!cliente){ state.futuroViewErr = 'Cliente inválido — selecione novamente da lista.'; render(); return; }
  if(!analistaId){ state.futuroViewErr = 'Selecione o analista.'; render(); return; }
  if(!data){ state.futuroViewErr = 'Informe a data.'; render(); return; }

  const meses = proximosMesesFuturo(3);
  const dt = new Date(data + 'T00:00:00');
  const alvo = meses.find(m => m.ano===dt.getFullYear() && m.mesIndex0===dt.getMonth());
  if(!alvo){ state.futuroViewErr = `Essa data não cai em nenhum dos próximos 3 meses (${meses.map(m=>m.label).join(', ')}).`; render(); return; }

  state.salvandoFuturoView = true; state.futuroViewErr = null; render();
  try{
    const analista = userById(analistaId);
    const row = {
      cliente_id: cliente.id, cliente_nome_planilha: cliente.nome,
      analista_id: analistaId, analista_nome_planilha: analista ? analista.name : '',
      data, periodo, horas, tipo_agenda: tipoAgenda || null,
    };
    if(p.id){
      // Uma edição manual "promove" a linha pra origem='manual' — mesmo que
      // ela tenha vindo originalmente do Setup, a partir do momento que
      // alguém mexeu nela de propósito, ela vira uma decisão manual e
      // precisa ficar protegida de ser apagada numa reimportação futura do
      // Setup (que só mexe em linhas ainda marcadas como 'setup').
      const { error } = await sb.from('crm_agenda_futura').update({ ...row, origem: 'manual' }).eq('id', p.id);
      if(error){ state.futuroViewErr = 'Erro ao salvar: ' + error.message; return; }
      const idx = AGENDA_FUTURA.findIndex(r=>r.id===p.id);
      if(idx>=0){
        AGENDA_FUTURA[idx] = { ...AGENDA_FUTURA[idx],
          clienteId: cliente.id, clienteNomePlanilha: cliente.nome,
          analistaId, analistaNomePlanilha: row.analista_nome_planilha,
          data, periodo, horas, tipoAgenda, origem: 'manual',
        };
      }
      toast('Agenda futura atualizada.');
    } else {
      const { data: novaRow, error } = await sb.from('crm_agenda_futura')
        .insert({ ...row, origem: 'manual', mes: alvo.mes, ano: alvo.ano, criado_por: state.authUser.id })
        .select().single();
      if(error){ state.futuroViewErr = 'Erro ao criar: ' + error.message; return; }
      AGENDA_FUTURA.push(mapAgendaFuturaRow(novaRow));
      toast('Agenda criada no Cronograma Futuro.');
    }
    state.modal = null;
  } finally {
    state.salvandoFuturoView = false; render();
  }
}

async function excluirFuturoViewRow(id){
  if(!podeEditarFuturo(state.authUser.role)){ toast('Analistas não podem excluir do Cronograma Futuro.', 'err'); return; }
  const r = AGENDA_FUTURA.find(x=>x.id===id);
  if(!r) return;
  if(!confirm(`Remover essa agenda (${r.clienteNomePlanilha}, ${fmtDate(r.data)})?`)) return;

  // Se essa linha veio do Setup, grava uma "lembrança" da exclusão antes de
  // apagar — senão, na próxima vez que o Setup for reimportado pro Futuro,
  // essa mesma data reapareceria sozinha, como se ninguém tivesse mexido.
  if (r.origem === 'setup'){
    const { error: tombError } = await sb.from('crm_agenda_futura_excluidas').insert({
      analista_id: r.analistaId, cliente_id: r.clienteId, data: r.data, periodo: r.periodo,
      excluido_por: state.authUser.id,
    });
    if (tombError){ toast('Erro ao registrar a exclusão: ' + tombError.message, 'err'); return; }
    AGENDA_FUTURA_EXCLUIDAS.push({ analistaId: r.analistaId, clienteId: r.clienteId, data: r.data, periodo: r.periodo });
  }

  const { error } = await sb.from('crm_agenda_futura').delete().eq('id', id);
  if(error){ toast('Erro ao excluir: ' + error.message, 'err'); return; }
  AGENDA_FUTURA = AGENDA_FUTURA.filter(x=>x.id!==id);
  toast('Registro removido.' + (r.origem==='setup' ? ' Não vai reaparecer numa próxima reimportação do Setup.' : ''));
  render();
}

              <span class="mv mono">${fmtH(a.horas)}h</span>
            </div>`;

  `;
}
async function consumeClientHours(clientId, horas){
  const c = clientById(clientId);
  if(!c) throw new Error('Cliente não encontrado localmente para atualizar o saldo.');
  const novasRealizadas = Math.round((c.horasConsumidas + horas) * 100) / 100;
  // O saldo já gravado (vindo da planilha) é a fonte de verdade — inclui
  // Acordo de Gestão e qualquer outro ajuste que não está só nas colunas de
  // horas contratadas/realizadas. Por isso o jeito certo de atualizar é
  // DESCONTAR as horas recém-consumidas do saldo atual, não reconstruir o
  // saldo do zero com uma fórmula própria (isso herda qualquer pequena
  // diferença entre a fórmula e o valor real da planilha).
  const saldoAtual = (c.saldoPlanilha === '' || c.saldoPlanilha === null || c.saldoPlanilha === undefined) ? (c.horasContratadas - c.horasConsumidas) : c.saldoPlanilha;
  const novoSaldo = Math.round((saldoAtual - horas) * 100) / 100;
  const { error } = await sb.from('planilha_centralizadora')
    .update({ realizadas: novasRealizadas, saldo: novoSaldo })
    .eq('id', c.id);
  if(error) throw error;
}

async function submitManual(){
  if(state.salvandoLancamentoManual) return; // já está salvando — ignora clique duplicado
  const clienteId = document.getElementById('mn-cliente').value;
  const analistaId = document.getElementById('mn-analista').value;
  const data = document.getElementById('mn-data').value;
  const horas = parseFloat(document.getElementById('mn-horas').value);
  const desc = document.getElementById('mn-desc').value;
  if(!clienteId){ toast('Selecione o cliente.', 'err'); return; }
  if(!analistaId){ toast('Selecione o analista executante.', 'err'); return; }
  if(!horas || horas<=0){ toast('Informe a duração em horas (maior que zero).', 'err'); return; }
  const u = state.authUser;
  const c = clientById(clienteId);

  const payload = {
    cliente_id: Number(clienteId), analista_id: analistaId, origem: 'manual',
    inicio: data+'T09:00:00', fim: data+'T'+(9+horas<=23? String(Math.floor(9+horas)).padStart(2,'0'):'23')+':00:00',
    horas, status: 'aprovada', criado_por: u.id, aprovado_por: u.id,
    descricao: desc || 'Lançamento manual de agenda.'
  };
  state.salvandoLancamentoManual = true;
  render();
  try{
    const { data: inserted, error } = await sb.from('crm_agendas').insert(payload).select().single();
    if(error){ toast('Erro ao salvar lançamento no Supabase: ' + error.message, 'err'); return; }

    try{
      await consumeClientHours(clienteId, horas);
    } catch(err){
      toast('Agenda salva, mas houve erro ao atualizar o saldo do cliente: ' + err.message, 'err');
    }
    AGENDAS.unshift(mapAgendaRow(inserted));
    await loadClients();
    toast(`Lançamento registrado: ${fmtH(horas)}h aprovadas para ${c?.nome||'cliente'}.`);
    document.getElementById('mn-horas').value='';
    document.getElementById('mn-desc').value='';
  } finally {
    state.salvandoLancamentoManual = false;
    render();
  }
}

function modalEditarLancamento(){
  const p = state.modal.payload;
  return `

        <div class="field-row">

          <div class="field"><label>Duração (horas)</label><input id="edl-horas" type="number" min="0.25" step="0.25" value="${p.horas}"></div>
        </div>
        <div class="field">
          <label>Analista executante</label>
          <select id="edl-analista">
            ${USERS.filter(u=>u.role==='analista' && (u.ativo!==false || u.id===p.analistaId)).sort((a,b)=>a.name.localeCompare(b.name)).map(u=>`<option value="${u.id}" ${p.analistaId===u.id?'selected':''}>${u.name}${u.ativo===false?' (inativo)':''}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Descrição</label><input id="edl-desc" type="text" value="${p.descricao}"></div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-action="closeModal" data-args='[]'>Cancelar</button>
        <button type="button" class="btn btn-primary" data-action="salvarEdicaoLancamento" data-args='[]' ${state.salvandoLancamento?'disabled':''}>${state.salvandoLancamento?'Salvando…':'Salvar alterações'}</button>
      </div>
    </div>
  </div>`;
}
async function salvarEdicaoLancamento(){
  if(state.salvandoLancamento) return;
  const p = state.modal.payload;
  const data = document.getElementById('edl-data').value;
  const horas = parseFloat(document.getElementById('edl-horas').value);
  const analistaId = document.getElementById('edl-analista').value;
  const descricao = document.getElementById('edl-desc').value.trim();
  if(!data){ state.lancamentoErr = 'Informe a data.'; render(); return; }
  if(!horas || horas<=0){ state.lancamentoErr = 'A duração precisa ser maior que zero.'; render(); return; }
  if(!analistaId){ state.lancamentoErr = 'Selecione o analista.'; render(); return; }

  state.salvandoLancamento = true; state.lancamentoErr = null; render();
  try{
    const payload = {
      analista_id: analistaId,
      inicio: data+'T09:00:00', fim: data+'T'+(9+horas<=23? String(Math.floor(9+horas)).padStart(2,'0'):'23')+':00:00',
      horas, descricao: descricao || 'Lançamento manual de agenda.',
    };
    const { error } = await sb.from('crm_agendas').update(payload).eq('id', p.agendaId);
    if(error){ state.lancamentoErr = 'Erro ao salvar: ' + error.message; return; }

    // Se a duração mudou, ajusta o saldo do cliente só pela diferença — se
    // reaplicássemos o valor novo inteiro, contaria a hora duas vezes.
    const delta = horas - p.horasOriginais;
    if (Math.abs(delta) > 0.001){
      try{ await consumeClientHours(p.clienteId, delta); }
      catch(err){ toast('Lançamento salvo, mas houve erro ao ajustar o saldo do cliente: ' + err.message, 'err'); }
      await loadClients();
    }

    const a = AGENDAS.find(x=>x.id===p.agendaId);
    if(a) Object.assign(a, { analistaId, inicio: payload.inicio, fim: payload.fim, horas, descricao: payload.descricao });
    toast('Lançamento atualizado.');
    state.modal = null;
  } finally {
    state.salvandoLancamento = false; render();
  }
}

function setAcordoFilter(f){ state.acordoFilter=f; render(); }
async function decideAcordo(id, decision){
  const a = ACORDOS.find(x=>x.id===id);
  if(!a) return;
  if(a.status !== 'pendente'){ toast('Esta solicitação já foi decidida.', 'err'); return; }

  const { error } = await sb.from('crm_solicitacoes_acordo')
    .update({ status: decision, aprovado_por: state.authUser.id, decidido_em: new Date().toISOString() })
    .eq('id', id);
  if(error){ toast('Erro ao salvar a decisão no Supabase: ' + error.message, 'err'); return; }

  a.status = decision;
  a.aprovadoPor = state.authUser.id;
  a.decididoEm = new Date().toISOString();

  if(decision==='aprovada'){
    const { error: cErr } = await sb.from('planilha_centralizadora').update({
      horas_acordo_gestao: a.horasAcordoNovo,
      observacao_acordo: a.obsAcordoNovo,
      saldo: a.saldoNovo,
    }).eq('id', a.clienteId);
    if(cErr){ toast('Aprovado, mas houve erro ao gravar os valores no cliente: ' + cErr.message, 'err'); render(); return; }
    await loadClients();
    toast('Ajuste de acordo aprovado e gravado no cliente.');
  } else {
    toast('Solicitação de ajuste rejeitada. Nenhum valor foi alterado.', 'err');
  }
  render();
}
async function decideAgenda(id, decision){
  const a = AGENDAS.find(x=>x.id===id);
  if(!a) return;
  if(a.status !== 'pendente'){ toast('Esta agenda já foi decidida.', 'err'); return; }

  const { error } = await sb.from('crm_agendas')
    .update({ status: decision, aprovado_por: state.authUser.id })
    .eq('id', id);
  if(error){ toast('Erro ao salvar a decisão no Supabase: ' + error.message, 'err'); return; }

  a.status = decision;
  a.aprovadoPor = state.authUser.id;

  if(decision==='aprovada'){
    const c = clientById(a.clienteId);
    try{
      await consumeClientHours(a.clienteId, a.horas);
      await loadClients();
      toast(`Aprovado: ${fmtH(a.horas)}h debitadas do saldo de ${c?.nome||'cliente'}.`);
    } catch(err){
      toast('Aprovado, mas houve erro ao atualizar o saldo do cliente: ' + err.message, 'err');
    }
  } else {
    toast('Agenda rejeitada. Nenhuma hora foi debitada.', 'err');
  }
  render();
}

// Ao escolher (ou digitar exatamente) o nome de um cliente já cadastrado,
// preenche sozinho as horas contratadas MENSAIS dele (h_mes_total na
// planilha centralizadora — não o total do projeto). Mexe só no DOM (sem
// render()) pra não interromper a digitação da pessoa no campo.
function onTicketClienteInput(value){
  const alvo = value.trim().toLowerCase();
  const match = CLIENTS.find(c => c.nome.toLowerCase() === alvo);
  if (match){
    const horasEl = document.getElementById('tk-horas-contratadas');
    if (horasEl) horasEl.value = (match.hMesTotal !== '' && match.hMesTotal != null) ? match.hMesTotal : '';
  }
}

async function submitTicket(){
  if(state.ticketEnviando) return;
  const u = state.authUser;
  const cliente = document.getElementById('tk-cliente').value.trim();
  const horasContratadas = document.getElementById('tk-horas-contratadas').value;
  const tipo = document.getElementById('tk-tipo').value;
  const modulos = [...document.querySelectorAll('.tk-modulo-chk:checked')].map(el=>el.value);
  const perfil = document.getElementById('tk-perfil').value;
  const qtdAgendas = document.getElementById('tk-qtd-agendas').value;
  const periodos = [...document.querySelectorAll('.tk-periodo-chk:checked')].map(el=>el.value);
  const horasOutro = document.getElementById('tk-horas-outro').value.trim();
  const justificativa = document.getElementById('tk-justificativa').value.trim();
  const sla = document.getElementById('tk-sla').checked;
  const foraCronograma = document.getElementById('tk-fora-cronograma').checked;

  // Guarda tudo já digitado ANTES de validar — se faltar algo, o próximo
  // render() reconstrói o formulário usando esses valores, em vez de
  // apagar tudo que a pessoa já tinha preenchido.
  state.ticketForm = { cliente, horasContratadas, tipo, modulos, perfil, qtdAgendas, periodos, horasOutro, justificativa, sla, foraCronograma };

  if(!cliente){ state.ticketErr='Informe o cliente.'; render(); return; }
  if(!horasContratadas){ state.ticketErr='Informe as horas contratadas mensais.'; render(); return; }
  if(!tipo){ state.ticketErr='Selecione o tipo de solicitação.'; render(); return; }
  if(modulos.length===0){ state.ticketErr='Selecione ao menos um módulo utilizado.'; render(); return; }
  if(!perfil){ state.ticketErr='Selecione o perfil necessário.'; render(); return; }
  if(!qtdAgendas){ state.ticketErr='Informe a quantidade de agendas.'; render(); return; }
  if(periodos.length===0){ state.ticketErr='Selecione ao menos um período de agenda.'; render(); return; }
  if(!justificativa){ state.ticketErr='Descreva a justificativa da solicitação.'; render(); return; }
  if(!sla){ state.ticketErr='É preciso declarar ciência do SLA de 24 horas úteis.'; render(); return; }
  if(!foraCronograma){ state.ticketErr='É preciso declarar que a solicitação está fora do cronograma oficial.'; render(); return; }

  state.ticketEnviando = true; state.ticketErr = null; render();
  try{
    const payload = {
      solicitante_id: u.id,
      solicitante_tipo: u.role==='gdr' ? 'gdr' : 'lider',
      cliente_nome: cliente,
      horas_contratadas_mensais: parseFloat(horasContratadas),
      tipo_solicitacao: tipo,
      modulos, perfil_necessario: perfil,
      quantidade_agendas: parseInt(qtdAgendas,10),
      periodo_agenda: periodos,
      horas_outro: horasOutro || null,
      justificativa, sla_ciente: sla, fora_cronograma: foraCronograma,
    };
    const { data, error } = await sb.from('crm_tickets').insert(payload).select().single();
    if(error){ state.ticketErr = 'Erro ao enviar solicitação: ' + error.message; return; }
    TICKETS.unshift(mapTicketRow(data));
    state.ticketForm = null;
    toast('Solicitação enviada! O time de RMO vai atender em até 24h úteis.');
    goPage('tickets');
  } finally {
    state.ticketEnviando = false; render();
  }
}

function ticketStatusBadge(status){
  const map = { 'Aberto':'badge-warn', 'Pendente GDR':'badge-danger', 'Em Atendimento':'badge-info', 'Concluído':'badge-ok', 'Cancelado':'badge-danger' };
  return `<span class="badge ${map[status]||'badge-muted'}">${status}</span>`;
}

function setTicketsFiltroStatus(s){ state.ticketsFiltroStatus=s; render(); }
function setTicketsBusca(v){ state.ticketsBusca=v; render(); }
async function moverTicket(id, novoStatus){
  const t = TICKETS.find(x=>x.id===id);
  if(!t || t.status===novoStatus) return;
  const u = state.authUser;
  const { error } = await sb.from('crm_tickets')
    .update({ status: novoStatus, movido_por: u.id, atualizado_em: new Date().toISOString() })
    .eq('id', id);
  if(error){ toast('Erro ao mover ticket: ' + error.message, 'err'); return; }
  t.status = novoStatus; t.movidoPor = u.id;
  toast(`Ticket movido para "${novoStatus}".`);
  render();
}

/* ============================================================
   PENDENTE GDR — RMO devolve o ticket pedindo mais informação antes de
   conseguir concluir/atribuir; GDR responde e o ticket volta pro RMO.
   ============================================================ */
function abrirModalDevolverGdr(ticketId){
  state.modal = { type:'devolverGdr', payload: { ticketId, pergunta:'' } };
  state.devolverGdrErr = null;
  render();
}
function modalDevolverGdr(){
  const p = state.modal.payload;
  const t = TICKETS.find(x=>x.id===p.ticketId);
  return `
  <div class="modal-bg" data-action="closeModalBg">
    <div class="modal" style="max-width:480px;">
      <div class="modal-head">
        <h3>Devolver ticket #${t?.numero} pro GDR</h3>
        <button class="modal-close" data-action="closeModal" data-args='[]'>✕</button>
      </div>
      <div class="modal-body">
        ${state.devolverGdrErr? `<div class="err-box">${state.devolverGdrErr}</div>`:''}
        <div class="cell-sub" style="margin-bottom:10px;">O ticket fica em "Pendente GDR" até ${userById(t?.solicitanteId)?.name||'o solicitante'} responder — só depois disso dá pra concluir ou atribuir analista.</div>
        <div class="field">
          <label>O que você precisa que o GDR esclareça? *</label>
          <textarea id="devolver-gdr-pergunta" rows="4" placeholder="Ex: precisa confirmar o horário exato com o cliente antes de eu alocar o analista."></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" data-action="closeModal" data-args='[]'>Cancelar</button>
        <button type="button" class="btn btn-primary" data-action="confirmarDevolverGdr" data-args='[]' ${state.salvandoDevolverGdr?'disabled':''}>${state.salvandoDevolverGdr?'Enviando…':'Devolver pro GDR'}</button>
      </div>
    </div>
  </div>`;
}
async function confirmarDevolverGdr(){
  if(state.salvandoDevolverGdr) return;
  const p = state.modal.payload;
  const pergunta = document.getElementById('devolver-gdr-pergunta').value.trim();
  if(!pergunta){ state.devolverGdrErr = 'Escreva o que precisa perguntar pro GDR.'; render(); return; }

  state.salvandoDevolverGdr = true; state.devolverGdrErr = null; render();
  try{
    const u = state.authUser;
    const { error } = await sb.from('crm_tickets').update({
      status: 'Pendente GDR', movido_por: u.id, atualizado_em: new Date().toISOString(),
      pendencia_gdr_pergunta: pergunta, pendencia_gdr_solicitada_por: u.id, pendencia_gdr_solicitada_em: new Date().toISOString(),
      pendencia_gdr_resposta: null, pendencia_gdr_respondida_em: null,
    }).eq('id', p.ticketId);
    if(error){ state.devolverGdrErr = 'Erro ao devolver: ' + error.message; return; }
    const t = TICKETS.find(x=>x.id===p.ticketId);
    if(t){
      t.status = 'Pendente GDR'; t.movidoPor = u.id;
      t.pendenciaGdrPergunta = pergunta; t.pendenciaGdrSolicitadaPor = u.id; t.pendenciaGdrSolicitadaEm = new Date().toISOString();
      t.pendenciaGdrResposta = null; t.pendenciaGdrRespondidaEm = null;
    }
    toast('Ticket devolvido pro GDR.');
    state.modal = null;
  } finally {
    state.salvandoDevolverGdr = false; render();
  }
}
async function responderPendenciaGdr(ticketId){
  const t = TICKETS.find(x=>x.id===ticketId);
  if(!t) return;
  const textarea = document.getElementById('ticket-resposta-'+ticketId);
  const resposta = textarea.value.trim();
  if(!resposta){ toast('Escreva a resposta antes de enviar.', 'err'); return; }

  const { error } = await sb.from('crm_tickets').update({
    status: 'Aberto', atualizado_em: new Date().toISOString(),
    pendencia_gdr_resposta: resposta, pendencia_gdr_respondida_em: new Date().toISOString(),
  }).eq('id', ticketId);
  if(error){ toast('Erro ao enviar resposta: ' + error.message, 'err'); return; }
  t.status = 'Aberto';
  t.pendenciaGdrResposta = resposta; t.pendenciaGdrRespondidaEm = new Date().toISOString();
  toast('Resposta enviada — ticket voltou pro RMO.');
  render();
}

/* ============================================================
   ATRIBUIÇÃO DE ANALISTA AO TICKET (só RMO)
   RMO busca disponibilidade (mesma lógica da página Disponibilidade),
   escolhe analista + data(s), e o sistema já cria as agendas de verdade
   — isso é o que substitui o preenchimento manual da planilha vigente.
   ============================================================ */
const TICKET_PERIODO_HORAS = {
  'Integral': {inicio:'08:30', fim:'18:00', horas:8},    // desconta 1h30 de almoço (12:00–13:30)
  'Manhã':    {inicio:'08:30', fim:'12:00', horas:3.5},
  'Tarde':    {inicio:'13:30', fim:'18:00', horas:4.5},  // começa depois do almoço, não às 13:00
};
function matchClienteByNome(nome){
  const alvo = normalizeName(nome);
  // Quando o mesmo nome bate com mais de um cadastro (ex: contrato antigo
  // "Concluído" + contrato novo "Em andamento" — comum quando um cliente
  // renova), prefere o ATIVO. Sem isso, o casamento pegava sempre o de id
  // mais baixo (o mais antigo/já encerrado), e toda agenda nova ficava
  // presa no cadastro errado, fazendo o contrato ativo parecer "sem uso".
  const exatos = CLIENTS.filter(c=>normalizeName(c.nome)===alvo);
  if (exatos.length > 0) return exatos.find(clienteAtivo) || exatos[0];
  return CLIENTS.find(c=>normalizeName(c.nome).includes(alvo) || alvo.includes(normalizeName(c.nome))) || null;
}

async function confirmarAtribuicao(){
  if(state.atribuindoTicket) return;
  const p = state.modal.payload;
  const t = TICKETS.find(x=>x.id===p.ticketId);
  if(!t) return;
  if(!p.analistaId){ toast('Selecione um analista.', 'err'); return; }
  const datas = [...document.querySelectorAll('.atrib-data-chk:checked')].map(el=>el.value);
  if(datas.length===0){ toast('Selecione ao menos uma data.', 'err'); return; }

  state.atribuindoTicket = true; render();
  try{
    const u = state.authUser;
    const cliente = matchClienteByNome(t.clienteNome);
    const analistaUser = userById(p.analistaId);
    const periodoNome = (t.periodoAgenda && t.periodoAgenda[0]) || 'Integral';
    const horario = TICKET_PERIODO_HORAS[periodoNome] || TICKET_PERIODO_HORAS['Integral'];

    // Cada data cai no Vigente (mês atual) ou no Futuro (meses seguintes),
    // dependendo de qual foi escolhida — nunca mais direto em crm_agendas.
    for (const dataStr of datas){
      await registrarAgendaPorData({
        clienteId: cliente ? cliente.id : null, analistaId: p.analistaId,
        clienteNome: cliente ? cliente.nome : t.clienteNome,
        analistaNome: analistaUser ? analistaUser.name : '',
        dataStr, periodo: periodoNome, horas: horario.horas,
        tipoAgenda: `Ticket #${t.numero} (${t.tipoSolicitacao})`, origem: 'ticket', ticketId: t.id,
      });
      if(cliente){
        try{ await consumeClientHours(cliente.id, horario.horas); }
        catch(e){ /* segue mesmo se o saldo não puder ser atualizado agora */ }
      }
    }
    if(cliente) await loadClients();

    const { error: upErr } = await sb.from('crm_tickets').update({
      analista_atribuido_id: p.analistaId, atribuido_por: u.id, atribuido_em: new Date().toISOString(),
      status: 'Concluído',
    }).eq('id', t.id);
    if(upErr) throw new Error(upErr.message);
    t.analistaAtribuidoId = p.analistaId; t.atribuidoPor = u.id; t.status = 'Concluído';

    toast(`Ticket #${t.numero} atribuído a ${userById(p.analistaId)?.name.split(' ')[0]} — ${datas.length} agenda(s) criada(s).`);
    state.modal = null;
  } catch(err){
    toast('Erro ao atribuir: ' + (err && err.message ? err.message : err), 'err');
  } finally {
    state.atribuindoTicket = false; render();
  }
}

async function salvarEditarPerfil(){

  if(!CARGOS_GESTAO_USUARIOS.includes(state.authUser.role)){ toast('Você não tem permissão pra alterar o perfil de usuários.', 'err'); return; }

  state.salvandoPerfil = true; state.editarPerfilErr = null; render();

    const { error } = await sb.from('crm_usuarios').update({ perfil: p.perfilNovo }).eq('id', p.userId);

async function salvarFerias(){
  if(state.salvandoFerias) return;
  if(!podeEditarSetupVigente(state.authUser.role)){ toast('Só RMO, Coordenação e Gerência podem editar férias.', 'err'); return; }
  const p = state.modal.payload;
  const periodos = [];
  for (let i=0;i<3;i++){
    const inicio = document.getElementById(`ferias-inicio-${i}`).value;
    const fim = document.getElementById(`ferias-fim-${i}`).value;
    if (!inicio && !fim) continue;
    if (!inicio || !fim){ state.feriasErr = `Período ${i+1}: preencha De e Até, ou deixe os dois em branco.`; render(); return; }
    if (fim < inicio){ state.feriasErr = `Período ${i+1}: a data final não pode ser antes da inicial.`; render(); return; }
    periodos.push({ inicio, fim });
  }

  state.salvandoFerias = true; state.feriasErr = null; render();
  try{
    // Substitui todos os períodos desse analista pelos que vieram do form.
    const { error: delErr } = await sb.from('crm_ferias').delete().eq('analista_id', p.analistaId);
    if (delErr){ state.feriasErr = 'Erro ao salvar: ' + delErr.message; return; }
    FERIAS = FERIAS.filter(f=>f.analistaId!==p.analistaId);

    if (periodos.length > 0){
      const rows = periodos.map(per => ({ analista_id: p.analistaId, data_inicio: per.inicio, data_fim: per.fim, criado_por: state.authUser.id }));
      const { data, error } = await sb.from('crm_ferias').insert(rows).select();
      if (error){ state.feriasErr = 'Erro ao salvar: ' + error.message; return; }
      FERIAS.push(...data.map(mapFeriasRow));
    }
    toast(`Férias de ${p.analistaNome} atualizadas.`);
    state.modal = null;
  } finally {
    state.salvandoFerias = false; render();
  }
}

async function criarUsuario(){
  const p = state.modal.payload;
  const nome = (document.getElementById('nu-nome').value||'').trim();
  const email = (document.getElementById('nu-email').value||'').trim();
  const senha = document.getElementById('nu-senha').value||'';
  // Sincroniza no state ANTES de qualquer render() de validação, senão o
  // próximo render() reconstrói os inputs com os valores antigos do payload.
  p.nome = nome; p.email = email; p.senha = senha;
  const perfil = p.perfil;

  if(!nome){ state.novoUsuarioErr='Informe o nome completo.'; render(); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ state.novoUsuarioErr=`"${email}" não é um e-mail válido.`; render(); return; }
  if(senha.length<6){ state.novoUsuarioErr='A senha deve ter ao menos 6 caracteres.'; render(); return; }

  state.novoUsuarioCarregando = true; state.novoUsuarioErr = null; render();
  try{
    const { data, error } = await sb.functions.invoke('admin-create-user', {
      body: { nome, email, senha, perfil }
    });
    if(error){
      // supabase-js encapsula o corpo de erro em error.context quando a function retorna status != 2xx
      let msg = error.message;
      try{ const body = await error.context.json(); if(body && body.error) msg = body.error; }catch(e){}
      state.novoUsuarioErr = msg;
      render(); return;
    }
    if(data && data.error){ state.novoUsuarioErr = data.error; render(); return; }

    USERS.push({ id:data.id, name:data.nome, email:data.email, role:data.perfil, ativo:true });
    state.modal = null; state.novoUsuarioErr = null;
    toast(`Usuário "${data.nome}" criado com sucesso.`);
    render();
  } catch(err){
    state.novoUsuarioErr = 'Erro inesperado: ' + (err && err.message ? err.message : err);
    render();
  } finally {
    state.novoUsuarioCarregando = false;
  }
}

/* ============================================================
   EVENT DELEGATION ENGINE
   Todos os elementos interativos usam data-action / data-input
   (nunca <form>/submit) e são conectados aqui via addEventListener.
   Isso é intencional por dois motivos observados neste ambiente:
   1) Atributos inline (onclick="…") podem ser bloqueados pelo
      preview mesmo com o <script> principal rodando normalmente.
   2) O preview roda em iframe sandboxed SEM a permissão
      'allow-forms' — qualquer <form> tem sua submissão bloqueada
      pelo navegador ("Blocked form submission ... sandboxed and
      'allow-forms' is not set"), então usamos <div> + botões
      comuns em vez de <form>/type="submit".
   ============================================================ */

let modalBgMouseDownTarget = null;
document.addEventListener('mousedown', function(e){
  const el = e.target.closest('[data-action="closeModalBg"]');
  modalBgMouseDownTarget = el && e.target === el ? el : null;
});
function closeModalBg(el, evt){
  // Só fecha se o clique COMEÇOU e TERMINOU exatamente no fundo do modal —
  // não apenas o clique (que dispara no soltar do mouse). Isso evita fechar
  // sem querer quando alguém arrasta pra selecionar um texto dentro do
  // modal e o mouse solta passando da borda.
  if(evt.target === el && modalBgMouseDownTarget === el) closeModal();
  modalBgMouseDownTarget = null;
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');
  const fn = ACTIONS[action];
  if(!fn){ console.warn('Ação desconhecida:', action); return; }
  if(action === 'closeModalBg'){ fn(el, e); return; }
  let args = [];
  const raw = el.getAttribute('data-args');
  if(raw){
    try{ args = JSON.parse(raw); } catch(err){ console.warn('data-args inválido em', action, raw); }
  }
  try{
    fn.apply(null, args);
  } catch(err){
    console.error('Erro executando ação "'+action+'":', err);
    toast('Ocorreu um erro ao executar "'+action+'": ' + (err && err.message ? err.message : err), 'err');
  }
});

document.addEventListener('input', function(e){
  const el = e.target.closest('[data-input]');
  if(!el) return;
  const action = el.getAttribute('data-input');
  const fn = ACTIONS[action];
  if(!fn){ console.warn('Input handler desconhecido:', action); return; }
  fn(el.value);
});

// Separado do 'input' acima porque file inputs precisam do elemento (para
// ler .files), não de .value — e 'change' é o evento correto para eles.
document.addEventListener('change', function(e){
  const el = e.target.closest('[data-change]');
  if(!el) return;
  const action = el.getAttribute('data-change');
  const fn = ACTIONS[action];
  if(!fn){ console.warn('Change handler desconhecido:', action); return; }
  try{ fn(el); }
  catch(err){
    console.error('Erro no handler de change "'+action+'":', err);
    toast('Erro: ' + (err && err.message ? err.message : err), 'err');
  }
});

/* Enter aciona o mesmo botão de ação principal do bloco.
   Não usamos <form>/submit porque o preview roda em iframe
   sandboxed sem a permissão 'allow-forms' — qualquer <form>
   tem sua submissão bloqueada silenciosamente pelo navegador,
   mesmo com JS funcionando perfeitamente (visto no console:
   "Blocked form submission ... sandboxed and 'allow-forms' is
   not set"). Por isso todo envio de dado é feito via clique
   normal em botão (data-action), e o Enter é simulado aqui. */
document.addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  if(!/^(INPUT|SELECT)$/.test(e.target.tagName)) return;
  const container = e.target.closest('[data-enter-action]');
  if(!container) return;
  e.preventDefault();
  const action = container.getAttribute('data-enter-action');
  const fn = ACTIONS[action];
  if(fn) fn();
});

/* ---------- boot ---------- */
async function bootApp(){
  state.view = 'loading';
  state.loadError = null;
  render();
  try{
    const { data, error } = await sb.auth.getSession();
    if(error) throw error;
    if(data.session && data.session.user){
      await afterAuthSuccess(data.session.user);
      return;
    }
    state.view = 'login';
  } catch(err){
    state.loadError = (err && err.message) ? err.message : String(err);
  }
  render();
}

// Mantém a sessão sincronizada: se o token expirar/for revogado em outra
// aba, ou o usuário deslogar por lá, reflete aqui também.
sb.auth.onAuthStateChange((event) => {
  if(event === 'SIGNED_OUT' && state.authUser){
    state.authUser = null; state.view = 'login'; state.page = 'dashboard';
    render();
  }
});

bootApp();
</script>
