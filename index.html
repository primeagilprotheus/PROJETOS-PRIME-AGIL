const CLIENTE_WORKER_SRC = `
importScripts('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
function isoDateW(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }

function parseClientesViaWorker(buf){
  return new Promise((resolve, reject) => {
    if (typeof Worker === 'undefined'){ reject(new Error('Worker indisponível neste navegador.')); return; }
    let worker;
    try{
      const blob = new Blob([CLIENTE_WORKER_SRC], { type:'application/javascript' });
      worker = new Worker(URL.createObjectURL(blob));
    } catch(err){ reject(err); return; }
    const timeout = setTimeout(()=>{ worker.terminate(); reject(new Error('Tempo esgotado processando no worker.')); }, 60000);
    worker.onmessage = (e) => {
      clearTimeout(timeout); worker.terminate();
      if (e.data && e.data.error) reject(new Error(e.data.error));
      else resolve(e.data.clientes);
    };
    worker.onerror = (e) => {
      clearTimeout(timeout); worker.terminate();
      reject(new Error(e.message || 'Erro desconhecido no worker.'));
    };
    try{ worker.postMessage({ buf }, [buf]); }
    catch(err){ worker.postMessage({ buf }); }
  });
}

function computeSetupBusyMap(grid){
  const clientes = extractAgendaClients(grid);
  const hoje = new Date();
  const ano = hoje.getFullYear(), mesIndex0 = hoje.getMonth();
  const busyMap = {};
  for (const c of clientes){
    for (const entry of c.entries){
      const dt = primeiraDataNoBloco(ano, mesIndex0, entry.semana, entry.dia);
      if (!dt) continue;
      const dateStr = isoDate(dt);
      const nomeNorm = normalizeName(entry.pessoa);
      const fracao = entry.categoria==='integral' ? 1 : 0.5;
      busyMap[nomeNorm] = busyMap[nomeNorm] || {};
      busyMap[nomeNorm][dateStr] = (busyMap[nomeNorm][dateStr]||0) + fracao;
    }
  }
  return busyMap;
}
function matchBusyByPrefix(map, nomeNorm){
  if (map[nomeNorm]) return map[nomeNorm];
  const chave = Object.keys(map).find(k => k.startsWith(nomeNorm) || nomeNorm.startsWith(k));
  return chave ? map[chave] : null;
}

const VIGENTE_IMPORT_ETAPAS = ['Lendo a planilha…', 'Identificando os meses…', 'Casando clientes e analistas…', 'Limpando os meses da planilha…', 'Gravando Agenda…', 'Gravando Cancelamentos…'];
async function onVigenteFileChangeDispWrap(el){
  if(!podeEditarVigente(state.authUser.role)){ toast('Só o RMO pode importar o Cronograma Vigente.', 'err'); return; }
  const file = el.files && el.files[0];
  if (!file) return;
  state.dispCarregandoVigente = true; state.dispErro = null;
  setImportStatus('vigente', VIGENTE_IMPORT_ETAPAS[0]);
  try{
    const { agenda, cancelamentos } = await parseVigenteParaImportar(file);
    if (agenda.length===0 && cancelamentos.length===0){
      throw new Error('Não encontrei nenhum registro nas abas "Agenda"/"Cancelamentos" desse arquivo.');
    }

    // A planilha pode trazer vários meses juntos, mas só aceitamos o mês
    // ATUAL DE VERDADE (data real de hoje) em diante — qualquer coisa
    // anterior a hoje (ex: julho, quando já estamos em agosto) é
    // descartada. Usa a data real do calendário como piso — não o mês de
    // referência do banco, que pode estar adiantado ou desatualizado por
    // causa de testes/promoções manuais — e não tem limite de "só mais um
    // mês": se a planilha trouxer 2, 3 ou mais meses futuros, todos entram.
    setImportStatus('vigente', VIGENTE_IMPORT_ETAPAS[1]);
    const todosOsMeses = [...new Map(
      [...agenda, ...cancelamentos].map(r => [`${r.mes}|${r.ano}`, { mes: r.mes, ano: r.ano }])
    ).values()].sort((a,b) => a.ano - b.ano || MESES_PT.indexOf(a.mes) - MESES_PT.indexOf(b.mes));
    if (todosOsMeses.length === 0) throw new Error('Não consegui identificar o mês/ano de nenhuma linha da planilha.');

    const hojeReal = new Date();
    const mesAtualReal = { mes: MESES_PT[hojeReal.getMonth()], ano: hojeReal.getFullYear() };
    const chaveAtualReal = mesAtualReal.ano*12 + MESES_PT.indexOf(mesAtualReal.mes);

    const mesesEncontrados = todosOsMeses.filter(m => (m.ano*12 + MESES_PT.indexOf(m.mes)) >= chaveAtualReal);
    const mesesDescartados = todosOsMeses.filter(m => !mesesEncontrados.includes(m));
    if (mesesEncontrados.length === 0){
      throw new Error(`Essa planilha só tem dados de ${todosOsMeses.map(m=>`${m.mes}/${m.ano}`).join(', ')} — tudo anterior ao mês atual (${mesAtualReal.mes}/${mesAtualReal.ano}). Meses passados não são reimportados; o sistema avança sozinho via promoção.`);
    }

    setImportStatus('vigente', VIGENTE_IMPORT_ETAPAS[2]);
    const u = state.authUser;
    const agendaRows = agenda.filter(a => mesesEncontrados.some(m=>m.mes===a.mes && m.ano===a.ano)).map(a => {
      const cliente = matchClienteByNome(a.cliente);
      const analista = matchAnalistaUsuario(a.analista);
      return {
        analista_id: analista ? analista.id : null, analista_nome_planilha: a.analista,
        cliente_id: cliente ? cliente.id : null, cliente_nome_planilha: a.cliente,
        gdr_nome_planilha: a.gdr || null,
        data: a.data, periodo: a.periodo, tipo_agenda: a.tipoAgenda, horas: a.horas,
        mes: a.mes, ano: a.ano, importado_por: u.id,
      };
    });
    const cancelRows = cancelamentos.filter(c => mesesEncontrados.some(m=>m.mes===c.mes && m.ano===c.ano)).map(c => {
      const cliente = matchClienteByNome(c.cliente);
      const analista = matchAnalistaUsuario(c.analista);
      return {
        analista_id: analista ? analista.id : null, analista_nome_planilha: c.analista,
        cliente_id: cliente ? cliente.id : null, cliente_nome_planilha: c.cliente,
        gdr_nome_planilha: c.gdr || null,
        data: c.data, data_cancelamento: c.dataCancelamento, tipo_agenda: c.tipoAgenda,
        periodo: c.periodo, horas: c.horas, com_antecedencia: c.comAntecedencia,
        causador: c.causador, status_justificativa: c.statusJustificativa, justificativa: c.justificativa,
        mes: c.mes, ano: c.ano, importado_por: u.id,
      };
    });

    // Substitui por completo os dados de CADA mês aceito — a planilha é a
    // fonte de verdade quando reenviada, então o import antigo daqueles
    // meses some. Meses que não aparecem na planilha ficam intocados.
    setImportStatus('vigente', VIGENTE_IMPORT_ETAPAS[3]);
    for (const m of mesesEncontrados){
      const { error: delA } = await sb.from('crm_agenda_vigente').delete().eq('mes', m.mes).eq('ano', m.ano);
      if (delA) throw new Error(`Erro ao limpar dados antigos de Agenda (${m.mes}/${m.ano}): ` + delA.message);
      const { error: delC } = await sb.from('crm_cancelamentos').delete().eq('mes', m.mes).eq('ano', m.ano);
      if (delC) throw new Error(`Erro ao limpar dados antigos de Cancelamentos (${m.mes}/${m.ano}): ` + delC.message);
    }

    const CHUNK = 300;
    for (let i=0; i<agendaRows.length; i+=CHUNK){
      setImportStatus('vigente', VIGENTE_IMPORT_ETAPAS[4], Math.min(i+CHUNK, agendaRows.length), agendaRows.length);
      const { error } = await sb.from('crm_agenda_vigente').insert(agendaRows.slice(i, i+CHUNK));
      if (error) throw new Error('Erro ao gravar Agenda: ' + error.message);
    }
    for (let i=0; i<cancelRows.length; i+=CHUNK){
      setImportStatus('vigente', VIGENTE_IMPORT_ETAPAS[5], Math.min(i+CHUNK, cancelRows.length), cancelRows.length);
      const { error } = await sb.from('crm_cancelamentos').insert(cancelRows.slice(i, i+CHUNK));
      if (error) throw new Error('Erro ao gravar Cancelamentos: ' + error.message);
    }

    // A referência sempre vai pro mês MAIS RECENTE que entrou nessa
    // importação — o piso já é a data real de hoje, então nunca corre o
    // risco de regredir pra algo velho; se vieram vários meses futuros
    // junto, a referência acompanha até onde a planilha realmente chegou.
    const novaReferencia = mesesEncontrados[mesesEncontrados.length - 1];
    if (novaReferencia.mes !== CONFIG.mesReferencia || novaReferencia.ano !== CONFIG.anoReferencia){
      const { error: cfgErr } = await sb.from('crm_config')
        .update({ mes_referencia: novaReferencia.mes, ano_referencia: novaReferencia.ano, atualizado_por: u.id })
        .eq('id', 1);
      if (cfgErr) toast('Importado, mas houve erro ao ajustar o mês de referência: ' + cfgErr.message, 'err');
      else { CONFIG.mesReferencia = novaReferencia.mes; CONFIG.anoReferencia = novaReferencia.ano; }
    }

    await Promise.all([loadAgendaVigente(), loadCancelamentos()]);
    const semCliente = agendaRows.filter(r=>!r.cliente_id).length;
    const semAnalista = agendaRows.filter(r=>!r.analista_id).length;
    const rotuloMeses = mesesEncontrados.map(m=>`${m.mes}/${m.ano}`).join(', ');
    const rotuloDescartados = mesesDescartados.length>0 ? ` (${mesesDescartados.map(m=>`${m.mes}/${m.ano}`).join(', ')} foi(ram) ignorado(s) por estar fora da janela aceita)` : '';
    toast(`Cronograma Vigente importado: ${agendaRows.length} agenda(s) + ${cancelRows.length} cancelamento(s) — ${rotuloMeses}.${rotuloDescartados}` +
      (semCliente||semAnalista ? ` (${semCliente} sem cliente casado, ${semAnalista} sem analista casado)` : ''));
  } catch(err){
    state.dispErro = 'Erro ao importar o Cronograma Vigente: ' + (err && err.message ? err.message : err);
  } finally {
    clearImportStatus('vigente');
    state.dispCarregandoVigente = false; render();
  }
}

// Núcleo reutilizável: analistas com uma skill, ordenados pela data livre
// mais próxima (cruzando Setup + Vigente). Usado pela página de
// Disponibilidade e pelo fluxo de atribuição de ticket (mesma lógica).
// Ocupação que o PRÓPRIO CRM já sabe (agendas criadas por atribuição de
// ticket, lançamento manual, importação etc.) — essencial pra não sugerir
// de novo uma data que acabou de ser alocada. Diferente do Setup/Vigente
// (vêm de planilha enviada), essa fonte é sempre atual, direto do banco.
function computeCrmAgendasBusyMap(){
  const map = {};
  for (const a of AGENDAS){
    if (a.status === 'rejeitada') continue; // só isso não conta como compromisso real
    if (!a.analistaId || !a.inicio) continue;
    const dstr = String(a.inicio).slice(0,10); // "YYYY-MM-DD"
    map[a.analistaId] = map[a.analistaId] || {};
    map[a.analistaId][dstr] = 1; // qualquer agenda naquele dia já bloqueia o dia inteiro no nosso modelo simplificado
  }
  return map;
}

// Ocupação "Setup" — agora vem AO VIVO da tabela crm_agenda_recorrente
// (mantida na tela "Setup Mensal"), não mais de reenviar a planilha
// Excel a cada sessão. O upload de planilha Setup na página Disponibilidade
// continua funcionando como camada extra opcional, mas deixou de ser
// obrigatório.
function computeRecorrenciaBusyMapParaMes(ano, mesIndex0){
  const map = {};
  for (const r of RECORRENCIA){
    if (!r.ativo || !r.analistaId) continue;
    const dt = primeiraDataNoBloco(ano, mesIndex0, r.semana, r.dia);
    if (!dt) continue;
    const dstr = isoDate(dt);
    const fracao = r.periodo === 'Integral' ? 1 : 0.5;
    map[r.analistaId] = map[r.analistaId] || {};
    map[r.analistaId][dstr] = (map[r.analistaId][dstr]||0) + fracao;
  }
  return map;
}
function computeRecorrenciaBusyMap(){
  const hoje = new Date();
  return computeRecorrenciaBusyMapParaMes(hoje.getFullYear(), hoje.getMonth());
}

// Ocupação "Vigente" — agora vem AO VIVO de crm_agenda_vigente (persistido
// no banco na importação), cruzando com crm_cancelamentos: uma agenda
// cancelada continua existindo como linha na planilha original, mas aqui
// ela conta como LIVRE de novo, não ocupada.
function computeVigenteDbBusyMap(){
  // Chave inclui PERÍODO e CLIENTE, não só analista+data — um cancelamento
  // é de uma agenda específica (cliente X, período Y), não do dia inteiro.
  // Isso cobre inclusive o caso de cancelar uma agenda e realocar outra no
  // mesmo período, mas pra um cliente diferente: como o cliente não bate,
  // o cancelamento antigo não "some" com a agenda nova que foi alocada
  // depois.
  const canceladas = new Set(); // "analistaId|data|periodo|clienteChave"
  for (const c of CANCELAMENTOS){
    if (!c.analistaId) continue;
    const clienteChave = c.clienteId ? String(c.clienteId) : (c.clienteNomePlanilha||'');
    canceladas.add(c.analistaId + '|' + c.data + '|' + (c.periodo||'') + '|' + clienteChave);
  }
  const map = {};
  for (const a of AGENDA_VIGENTE){
    if (!a.analistaId) continue;
    const clienteChave = a.clienteId ? String(a.clienteId) : (a.clienteNomePlanilha||'');
    if (canceladas.has(a.analistaId + '|' + a.data + '|' + (a.periodo||'') + '|' + clienteChave)) continue; // cancelada = livre
    map[a.analistaId] = map[a.analistaId] || {};
    map[a.analistaId][a.data] = 1; // qualquer linha real (não cancelada) ocupa o dia inteiro no nosso modelo simplificado
  }
  return map;
}
// Ocupação "Futuro" — mesma lógica, mas pros próximos meses.
function computeFuturoDbBusyMap(){
  const map = {};
  for (const a of AGENDA_FUTURA){
    if (!a.analistaId) continue;
    map[a.analistaId] = map[a.analistaId] || {};
    map[a.analistaId][a.data] = 1;
  }
  return map;
}

// A busca cruza Vigente (mês atual) + Futuro (meses seguintes já
// importados) + a projeção AO VIVO do Setup (cobre qualquer data que ainda
// não foi materializada em nenhuma das duas tabelas). Se não achar 3 datas
// livres dentro do mês atual, ela mesma estende a busca pros meses
// seguintes — não trava só porque o mês tá quase acabando.
// Núcleo reutilizável: recebe a LISTA de analistas já filtrada (por skill,
// por pessoa específica, etc.) e calcula as próximas datas livres de cada
// um. Usado tanto pela busca por skill quanto pela busca por analista.
function buscarProximasLivresPara(analistas, maxDatas){
  maxDatas = maxDatas || 3;
  // Começa sempre no dia real de hoje — nunca pula pro mês de referência.
  // O Vigente pode ter mais de um mês confirmado ao mesmo tempo (ex: agosto
  // e setembro, se setembro já foi "lançado" antes do calendário chegar
  // lá), e datas livres em qualquer um deles precisam aparecer. A função
  // ehMesAtual (mês <= referência) já garante que cada data seja checada
  // contra a tabela certa (Vigente ou Futuro), então não precisa mais
  // travar o início da busca aqui.
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const limiteBusca = new Date(hoje); limiteBusca.setDate(limiteBusca.getDate() + 120); // ~4 meses de margem

  const crmBusy = computeCrmAgendasBusyMap();
  const vigenteDbBusy = computeVigenteDbBusyMap();
  const futuroDbBusy = computeFuturoDbBusyMap();
  const recorrenciaBusyPorMes = {}; // cache "ano-mes" -> mapa, calculado só quando a busca realmente chega lá
  function recorrenciaBusyDoMes(ano, mesIndex0){
    const chave = `${ano}-${mesIndex0}`;
    if (!recorrenciaBusyPorMes[chave]) recorrenciaBusyPorMes[chave] = computeRecorrenciaBusyMapParaMes(ano, mesIndex0);
    return recorrenciaBusyPorMes[chave];
  }

  const resultado = analistas.map(a=>{
    const nomeNorm = normalizeName(a.name);
    const setupPessoa = (state.dispSetupBusy && matchBusyByPrefix(state.dispSetupBusy, nomeNorm)) || {}; // camada extra opcional (upload manual, legado)
    const crmPessoa = crmBusy[a.id] || {};
    const vigentePessoa = vigenteDbBusy[a.id] || {};
    const futuroPessoa = futuroDbBusy[a.id] || {};

    const proximasLivres = [];
    const cursor = new Date(hoje);
    while (cursor <= limiteBusca && proximasLivres.length < maxDatas){
      const dow = cursor.getDay();
      if (dow!==0 && dow!==6 && !feriadoNoDia(isoDate(cursor))){
        const dstr = isoDate(cursor);
        // O Setup ao vivo só entra pros meses SEGUINTES ao de referência —
        // o mês de referência já devia estar 100% refletido no Vigente (foi
        // importado/promovido), então usar o Setup ali só geraria
        // falso-ocupado com coisa que pode ter sido cancelada/alterada e
        // nunca chegou a acontecer.
        const recorrenciaPessoa = ehMesAtual(dstr) ? {} : (recorrenciaBusyDoMes(cursor.getFullYear(), cursor.getMonth())[a.id] || {});
        const ocupado = (setupPessoa[dstr]||0) + (vigentePessoa[dstr]||0) + (futuroPessoa[dstr]||0) + (crmPessoa[dstr]||0) + (recorrenciaPessoa[dstr]||0);
        if (ocupado <= 0){ proximasLivres.push(new Date(cursor)); }
      }
      cursor.setDate(cursor.getDate()+1);
    }
    return { usuario:a, skills:[...(USER_SKILLS[a.id]||[])].sort(), proximasLivres };
  });

  resultado.sort((x,y)=>{
    const xd = x.proximasLivres[0], yd = y.proximasLivres[0];
    if (!xd && !yd) return 0;
    if (!xd) return 1;
    if (!yd) return -1;
    return xd - yd;
  });
  return resultado;
}
function buscarAnalistasComSkill(skillNome, maxDatas){
  const analistasComSkill = USERS.filter(u=>u.role==='analista' && u.ativo!==false && (USER_SKILLS[u.id]||new Set()).has(skillNome));
  return buscarProximasLivresPara(analistasComSkill, maxDatas);
}
// Busca a disponibilidade de UM analista específico direto (sem passar
// por skill) — ex: "quero saber as próximas agendas vagas da Andreza".
function buscarDisponibilidadePorAnalista(analistaId, maxDatas){
  const analista = USERS.find(u=>u.id===analistaId && u.role==='analista' && u.ativo!==false);
  if (!analista) return [];
  return buscarProximasLivresPara([analista], maxDatas);
}

// "Vagas no Setup" = buracos na grade FIXA (Semana 1-4 × Segunda-Sexta),
// não datas de calendário específicas — é sobre onde ainda cabe um cliente
// recorrente novo na agenda semanal do analista, olhando só o Setup Mensal
// (não Vigente/Futuro/feriados, que são sobre datas reais).
function calcularVagasSetup(analistaIdFiltro){
  const porAnalista = {}; // analistaId -> "semana|dia" -> Set(períodos ocupados)
  for (const r of RECORRENCIA){
    if (!r.analistaId) continue;
    if (analistaIdFiltro && r.analistaId !== analistaIdFiltro) continue;
    porAnalista[r.analistaId] = porAnalista[r.analistaId] || {};
    const chave = `${r.semana}|${r.dia}`;
    (porAnalista[r.analistaId][chave] = porAnalista[r.analistaId][chave] || new Set()).add(r.periodo);
  }
  let analistas = USERS.filter(u=>u.role==='analista' && u.ativo!==false);
  if (analistaIdFiltro) analistas = analistas.filter(u=>u.id===analistaIdFiltro);

  const resultado = analistas.map(a=>{
    const ocupados = porAnalista[a.id] || {};
    const vagas = [];
    for (let semana=1; semana<=4; semana++){
      for (const dia of DIAS_SEMANA_UTEIS){
        const periodos = ocupados[`${semana}|${dia}`];
        if (!periodos || periodos.size===0){
          vagas.push({ semana, dia, periodo: 'Dia inteiro' });
        } else if (!periodos.has('Integral') && !periodos.has('Horas')){
          if (!periodos.has('Manhã')) vagas.push({ semana, dia, periodo: 'Manhã' });
          if (!periodos.has('Tarde')) vagas.push({ semana, dia, periodo: 'Tarde' });
        }
      }
    }
    return { usuario: a, skills: [...(USER_SKILLS[a.id]||[])].sort(), vagas };
  }).filter(r => r.vagas.length > 0);

  resultado.sort((x,y) => y.vagas.length - x.vagas.length || x.usuario.name.localeCompare(y.usuario.name));
  return resultado;
}

function buscarDisponibilidade(){
  const modo = state.dispModoBusca || 'skill';
  if (modo === 'setup'){
    const resultado = calcularVagasSetup(state.dispAnalistaId || null);
    if (resultado.length===0){ toast('Nenhuma vaga encontrada na grade do Setup Mensal.', 'err'); }
    state.dispResultadoSetup = resultado;
    state.dispResultado = null;
    render();
    return;
  }
  state.dispResultadoSetup = null;
  if (modo === 'analista'){
    if (!state.dispAnalistaId){ toast('Selecione um analista.', 'err'); return; }
    const analista = userById(state.dispAnalistaId);
    const resultado = buscarDisponibilidadePorAnalista(state.dispAnalistaId, 3);
    if (resultado.length===0){ toast('Analista não encontrado ou inativo.', 'err'); return; }
    state.dispResultado = resultado;
    render();
    return;
  }
  if (!state.dispSkillId){ toast('Selecione uma skill.', 'err'); return; }
  const skill = SKILLS.find(s=>s.id===state.dispSkillId);
  const resultado = buscarAnalistasComSkill(skill.nome, 3);
  if (resultado.length===0){
    toast(`Nenhum analista com a skill "${skill.nome}".`, 'err');
  }
  state.dispResultado = resultado;
  render();
}

/* ============================================================
   RDA — rotina de acompanhamento: quais agendas do Vigente já têm
   o Registro de Atividade preenchido e quais ainda estão pendentes.
   Filtra por Analista, GDR e Cliente.
   ============================================================ */
function setRdaFiltroAnalista(v){ state.rdaFiltroAnalista=v; render(); }
function setRdaFiltroGdr(v){ state.rdaFiltroGdr=v; render(); }

function limparFiltrosRda(){
  state.rdaFiltroAnalista=''; state.rdaFiltroGdr=''; state.rdaFiltroCliente=''; state.rdaFiltroStatus='todos';
  render();
}

// Janela de RDA: dia 01 do mês atual até dia 10 do mês seguinte — vira o
// ciclo assim que passa do dia 10. Ex: de 01/ago até 10/set é um ciclo; a
// partir de 11/set já é outro ciclo (01/set até 10/out). Baseado na data
// real de hoje, não no mês de referência do sistema (que é só pra
// Vigente/Futuro) — RDA tem prazo próprio de entrega.
// Agendas de "H. Interno", "H. Ausência" e códigos parecidos (prefixo
// "H.") são horas internas — nunca ligadas a um cliente de verdade
// (cliente_id sempre vazio pra elas). Usado pra tirar essas linhas da
// exigência de RDA em qualquer lugar do sistema que precise disso.
function ehAgendaInterna(r){
  if (r.clienteId) return false;
  const nome = (r.clienteNomePlanilha||'').trim().toUpperCase();
  return nome.startsWith('H.');
}

function janelaRda(offsetCiclos){
  offsetCiclos = offsetCiclos || 0;
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const ano = hoje.getFullYear(), mes = hoje.getMonth(); // mes: 0-11
  let inicioAno, inicioMes;
  if (hoje.getDate() <= 10){
    // ainda no ciclo que começou no mês passado
    inicioMes = mes - 1; inicioAno = ano;
    if (inicioMes < 0){ inicioMes = 11; inicioAno -= 1; }
  } else {
    // já entrou no ciclo que começa neste mês
    inicioMes = mes; inicioAno = ano;
  }
  // Desloca pra ciclos anteriores/seguintes — cada ciclo = 1 mês de
  // diferença no início (offsetCiclos negativo = passado, positivo = futuro).
  inicioMes += offsetCiclos;
  while (inicioMes < 0){ inicioMes += 12; inicioAno -= 1; }
  while (inicioMes > 11){ inicioMes -= 12; inicioAno += 1; }
  let fimMes = inicioMes + 1, fimAno = inicioAno;
  if (fimMes > 11){ fimMes = 0; fimAno += 1; }

  const inicio = isoDate(new Date(inicioAno, inicioMes, 1));
  const fim = isoDate(new Date(fimAno, fimMes, 10));
  return { inicio, fim };
}

  const gdrDe = r => (r.clienteId && clientById(r.clienteId)?.gdrNome) || '';

  // Base: só a janela do ciclo selecionado (dia 01 do mês até dia 10 do
  // seguinte — por padrão o ciclo atual, mas dá pra navegar pra ciclos

  // horas internas — banco de horas, treinamento, ausência — nunca ligadas
  // a um cliente de verdade. Não gera RDA porque não teve atividade com
  // cliente nenhum.
  listaBase = listaBase.filter(r => !ehAgendaInterna(r));

  else if(u.role==='gdr') listaBase = listaBase.filter(r=>clientById(r.clienteId)?.gdrId===u.id);

  const nomeAnalista = r => r.analistaId ? (userById(r.analistaId)?.name||r.analistaNomePlanilha) : r.analistaNomePlanilha;
  const nomeCliente = r => r.clienteId ? (clientById(r.clienteId)?.nome||r.clienteNomePlanilha) : r.clienteNomePlanilha;

  const analistasNaFonte = [...new Map(listaBase.filter(r=>r.analistaId).map(r=>[r.analistaId, nomeAnalista(r)])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));
  const gdrsNaFonte = [...new Set(listaBase.map(r=>gdrDe(r)).filter(Boolean))].sort();
  const clientesNaFonte = [...new Map(listaBase.filter(r=>r.clienteId).map(r=>[r.clienteId, nomeCliente(r)])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));

  let list = listaBase;
  if(fAnalista) list = list.filter(r => String(r.analistaId||'')===fAnalista);
  if(fGdr) list = list.filter(r => gdrDe(r)===fGdr);
  if(fCliente) list = list.filter(r => String(r.clienteId||'')===fCliente);

  const totalPendente = listaBase.filter(r=>!r.rdaUrl).length;
  const totalCriada = listaBase.filter(r=>!!r.rdaUrl).length;
  const temFiltroAtivo = fAnalista || fGdr || fCliente || (fStatus && fStatus!=='todos');

  return `
  <div class="topbar">
    <div><h1>RDA — Registro de Atividade</h1><div class="sub">Acompanha quais agendas do ciclo ${fmtDate(rdaInicio)} a ${fmtDate(rdaFim)} já têm o documento de RDA salvo no Drive.${offsetCiclo!==0 ? ' <b style="color:var(--warn);">Você está vendo um ciclo passado.</b>' : ''}</div></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn btn-ghost btn-sm" data-action="setRdaOffsetCiclo" data-args='[${offsetCiclo-1}]'>◂ Ciclo anterior</button>
      ${offsetCiclo!==0 ? `<button class="btn btn-ghost btn-sm" data-action="setRdaOffsetCiclo" data-args='[0]'>Voltar pro atual</button>` : ''}
      <button class="btn btn-ghost btn-sm" ${offsetCiclo>=0?'disabled':''} data-action="setRdaOffsetCiclo" data-args='[${offsetCiclo+1}]'>Próximo ciclo ▸</button>
    </div>
  </div>

  <div class="toolbar" style="margin-bottom:18px;">
    <span class="badge badge-warn">${totalPendente} pendente(s)</span>
    <span class="badge badge-ok">${totalCriada} criada(s)</span>

  <div class="panel" style="margin-bottom:18px;">

            <option value="criada" ${fStatus==='criada'?'selected':''}>Criada</option>

          </select>

        <div class="field" style="margin-bottom:0;">

      <tbody>
        ${list.map(r=>{

/* ============================================================

   até dia 10 do mês seguinte), mas UM REGISTRO POR CLIENTE (não por
   agenda) — responsabilidade do GDR da carteira, não do analista. "Precisa
   de EBR" = cliente teve pelo menos uma agenda real (não interna) no

  if (CARGOS_LIDERANCA.includes(user.role)) return true;
  const c = clientById(clienteId);
  return user.role==='gdr' && c?.gdrId===user.id;
}

  const { inicio: cicloInicio, fim: cicloFim } = janelaRda(offsetCiclo);

async function salvarEbrUrl(){
  if(state.salvandoEbrUrl) return;
  const p = state.modal.payload;
  const url = document.getElementById('ebr-url').value.trim();
  if(url && !/^https?:\/\//i.test(url)){ state.ebrUrlErr = 'A URL precisa começar com http:// ou https://'; render(); return; }

  state.salvandoEbrUrl = true; state.ebrUrlErr = null; render();
  try{
    // Um registro por (cliente, ciclo) — upsert em vez de sempre inserir,
    // senão editar um EBR que já existe criaria um segundo registro em vez
    // de atualizar o mesmo.
    const { data, error } = await sb.from('crm_ebr')
      .upsert({
        cliente_id: p.clienteId, ciclo_inicio: p.cicloInicio, ebr_url: url || null,
        criado_por: state.authUser.id, atualizado_em: new Date().toISOString(),
      }, { onConflict: 'cliente_id,ciclo_inicio' })
      .select();
    if(error){ state.ebrUrlErr = 'Erro ao salvar: ' + error.message; return; }
    if(!data || data.length===0){
      state.ebrUrlErr = 'Não foi possível salvar — você não tem permissão pra preencher o EBR desse cliente.';
      return;
    }
    const row = data[0];
    const mapped = { id: row.id, clienteId: row.cliente_id, cicloInicio: row.ciclo_inicio, ebrUrl: row.ebr_url, criadoPor: row.criado_por, atualizadoEm: row.atualizado_em };
    const idx = EBR.findIndex(e => String(e.clienteId)===String(p.clienteId) && e.cicloInicio===p.cicloInicio);
    if(idx>=0) EBR[idx] = mapped; else EBR.push(mapped);
    toast(url ? 'EBR salvo.' : 'EBR removido.');
    state.modal = null;
  } finally {
    state.salvandoEbrUrl = false; render();
  }
}

function setEbrFiltroGdr(v){ state.ebrFiltroGdr=v; render(); }
function setEbrFiltroCliente(v){ state.ebrFiltroCliente=v; render(); }
function setEbrFiltroStatus(v){ state.ebrFiltroStatus=v; render(); }

async function criarFeriado(){
  if(state.salvandoFeriado) return;
  if(!podeEditarSetupVigente(state.authUser.role)){ toast('Só RMO, Coordenação e Gerência podem cadastrar feriados.', 'err'); return; }
  const data = document.getElementById('feriado-data').value;
  const nome = document.getElementById('feriado-nome').value.trim();
  if(!data){ state.feriadoErr = 'Informe a data.'; render(); return; }
  if(!nome){ state.feriadoErr = 'Informe o nome do feriado.'; render(); return; }

  state.salvandoFeriado = true; state.feriadoErr = null; render();
  try{
    const { data: row, error } = await sb.from('crm_feriados').insert({ data, nome, criado_por: state.authUser.id }).select().single();
    if(error){
      state.feriadoErr = error.code==='23505' ? 'Já existe um feriado cadastrado nessa data.' : 'Erro ao salvar: ' + error.message;
      return;
    }
    FERIADOS.push(mapFeriadoRow(row));
    toast(`Feriado "${nome}" cadastrado em ${fmtDate(data)}.`);
  } finally {
    state.salvandoFeriado = false; render();
  }
}

async function excluirFeriado(id){
  if(!podeEditarSetupVigente(state.authUser.role)){ toast('Só RMO, Coordenação e Gerência podem excluir feriados.', 'err'); return; }
  const f = FERIADOS.find(x=>x.id===id);
  if(!f) return;
  if(!confirm(`Remover o feriado "${f.nome}" (${fmtDate(f.data)})?`)) return;
  const { error } = await sb.from('crm_feriados').delete().eq('id', id);
  if(error){ toast('Erro ao excluir: ' + error.message, 'err'); return; }
  FERIADOS = FERIADOS.filter(x=>x.id!==id);
  toast('Feriado removido.');
  render();
}

async function salvarKanbanCard(){
  if(state.salvandoKanbanCard) return;
  const p = state.modal.payload;
  const titulo = document.getElementById('kb-titulo').value.trim();
  const descricao = document.getElementById('kb-descricao').value.trim();
  const coluna = document.getElementById('kb-coluna').value;
  const prioridade = document.getElementById('kb-prioridade').value;
  const clienteIdRaw = document.getElementById('kb-cliente').value;
  const dataPrevista = document.getElementById('kb-prazo').value;
  if(!titulo){ state.kanbanCardErr = 'Informe o título do card.'; render(); return; }

  state.salvandoKanbanCard = true; state.kanbanCardErr = null; render();
  try{
    const row = {
      titulo, descricao: descricao||null, coluna, prioridade,
      cliente_id: clienteIdRaw ? parseInt(clienteIdRaw,10) : null,
      data_prevista: dataPrevista || null,
    };
    let cardId = p.id;
    if(p.id){
      const { error } = await sb.from('crm_kanban_cards').update({ ...row, atualizado_em: new Date().toISOString() }).eq('id', p.id);
      if(error){ state.kanbanCardErr = 'Erro ao salvar: ' + error.message; return; }
    } else {
      const maxOrdem = Math.max(0, ...KANBAN_CARDS.filter(c=>c.coluna===coluna).map(c=>c.ordem));
      const { data, error } = await sb.from('crm_kanban_cards').insert({ ...row, ordem: maxOrdem+1, criado_por: state.authUser.id }).select().single();
      if(error){ state.kanbanCardErr = 'Erro ao criar: ' + error.message; return; }
      cardId = data.id;
    }

    // Sincroniza responsáveis: apaga tudo e recria (mais simples e
    // confiável do que calcular o diff pra uma lista pequena).
    const { error: delRespErr } = await sb.from('crm_kanban_card_responsaveis').delete().eq('card_id', cardId);
    if(delRespErr){ state.kanbanCardErr = 'Erro ao salvar responsáveis: ' + delRespErr.message; return; }
    if(p.responsaveisIds.length>0){
      const { error: insRespErr } = await sb.from('crm_kanban_card_responsaveis').insert(p.responsaveisIds.map(uid=>({ card_id: cardId, usuario_id: uid })));
      if(insRespErr){ state.kanbanCardErr = 'Erro ao salvar responsáveis: ' + insRespErr.message; return; }
    }

    // Atualiza a tela com os dados que a gente MESMO acabou de gravar, em
    // vez de buscar tudo de novo no banco — um SELECT logo depois de um
    // INSERT pode não ver a escrita ainda (dependendo de como o Supabase
    // distribui as conexões), o que fazia o card só aparecer depois de
    // apertar F5.
    if(p.id){
      const idx = KANBAN_CARDS.findIndex(c=>c.id===p.id);
      if(idx>=0){
        KANBAN_CARDS[idx] = { ...KANBAN_CARDS[idx],
          titulo, descricao: descricao||null, coluna, prioridade,
          clienteId: row.cliente_id, dataPrevista: row.data_prevista,
          responsaveisIds: [...p.responsaveisIds],
        };
      }
    } else {
      const maxOrdem = Math.max(0, ...KANBAN_CARDS.filter(c=>c.coluna===coluna).map(c=>c.ordem));
      KANBAN_CARDS.push({
        id: cardId, titulo, descricao: descricao||null, coluna, prioridade,
        clienteId: row.cliente_id, dataPrevista: row.data_prevista, ordem: maxOrdem+1,
        criadoPor: state.authUser.id, criadoEm: new Date().toISOString(), atualizadoEm: new Date().toISOString(),
        responsaveisIds: [...p.responsaveisIds],
      });
    }

    toast(p.id ? 'Card atualizado.' : 'Card criado.');
    state.modal = null;
  } finally {
    state.salvandoKanbanCard = false; render();
  }
}

async function excluirKanbanCard(id){
  if(!confirm('Excluir esse card? Não dá pra desfazer.')) return;
  const { error } = await sb.from('crm_kanban_cards').delete().eq('id', id);
  if(error){ toast('Erro ao excluir: ' + error.message, 'err'); return; }
  KANBAN_CARDS = KANBAN_CARDS.filter(c=>c.id!==id);
  KANBAN_COMENTARIOS = KANBAN_COMENTARIOS.filter(k=>k.cardId!==id);
  toast('Card excluído.');
  state.modal = null;
  render();
}

async function adicionarComentarioKanban(cardId){
  const input = document.getElementById('kb-novo-comentario');
  const texto = input.value.trim();
  if(!texto) return;
  capturarCamposKanbanCard();
  const { data, error } = await sb.from('crm_kanban_comentarios').insert({ card_id: cardId, texto, criado_por: state.authUser.id }).select().single();
  if(error){ toast('Erro ao adicionar atualização: ' + error.message, 'err'); return; }
  KANBAN_COMENTARIOS.push({ id: data.id, cardId, texto, criadoPor: state.authUser.id, criadoEm: data.criado_em });
  toast('Atualização adicionada.');
  render();
}

// Move um card pra outra coluna (usado tanto no soltar do arrastar-e-soltar
// quanto como fallback futuro por botão/toque em telas pequenas).
async function moverCardKanban(cardId, novaColuna){
  const c = KANBAN_CARDS.find(x=>x.id===cardId);
  if(!c || c.coluna===novaColuna) return;
  const colunaAntiga = c.coluna;
  c.coluna = novaColuna; render(); // otimista — atualiza a tela na hora
  const maxOrdem = Math.max(0, ...KANBAN_CARDS.filter(x=>x.coluna===novaColuna && x.id!==cardId).map(x=>x.ordem));
  const { error } = await sb.from('crm_kanban_cards').update({ coluna: novaColuna, ordem: maxOrdem+1, atualizado_em: new Date().toISOString() }).eq('id', cardId);
  if(error){
    c.coluna = colunaAntiga; render(); // desfaz se der erro
    toast('Erro ao mover o card: ' + error.message, 'err');
    return;
  }
  c.ordem = maxOrdem+1;
}

let kanbanDragCardId = null;
document.addEventListener('dragstart', function(e){
  const el = e.target.closest('[data-kanban-card]');
  if(!el) return;
  kanbanDragCardId = el.getAttribute('data-card-id');
  e.dataTransfer.effectAllowed = 'move';
  try{ e.dataTransfer.setData('text/plain', kanbanDragCardId); }catch(err){}
  el.classList.add('kanban-dragging');
});
document.addEventListener('dragend', function(e){
  const el = e.target.closest('[data-kanban-card]');
  if(el) el.classList.remove('kanban-dragging');
  kanbanDragCardId = null;
});
document.addEventListener('dragover', function(e){
  const col = e.target.closest('[data-kanban-column]');
  if(!col) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  col.classList.add('kanban-col-over');
});
document.addEventListener('dragleave', function(e){
  const col = e.target.closest('[data-kanban-column]');
  if(col && !col.contains(e.relatedTarget)) col.classList.remove('kanban-col-over');
});
document.addEventListener('drop', function(e){
  const col = e.target.closest('[data-kanban-column]');
  if(!col) return;
  e.preventDefault();
  col.classList.remove('kanban-col-over');
  const cardId = kanbanDragCardId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
  if(!cardId) return;
  moverCardKanban(cardId, col.getAttribute('data-coluna'));
});

function setRecorrenciaBusca(v){ state.recorrenciaBusca=v; render(); }

// RMO, Coordenação e Gerência mantêm/editam a agenda recorrente e o
// Cronograma Vigente; GDR e Analista só visualizam. A segurança de verdade
// está no banco (RLS) — isso aqui só evita mostrar controles que a pessoa
// não vai conseguir usar mesmo.
function podeEditarSetupVigente(role){ return CARGOS_LIDERANCA.includes(role); }
// Cronograma Vigente = agenda 100% confirmada — só o RMO edita (criar,
// editar, cancelar, importar planilha, promover/desfazer mês).
function podeEditarVigente(role){ return role === 'rmo'; }
// Cronograma Futuro = agenda que GDR/RMO ainda estão montando, pode mudar
// ou ser removida sem virar um cancelamento formal — todo mundo edita,
// menos analista.
function podeEditarFuturo(role){ return role !== 'analista'; }
// Importar a base de clientes (Planilha Centralizadora) é restrito só ao
// Coordenador de Projetos — diferente do Setup/Vigente, que são de toda a
// liderança.
function podeImportarClientes(role){ return role === 'coordenador_projetos'; }
// Quem pode preencher/editar a RDA de uma agenda do Vigente: liderança, o
// próprio analista responsável, ou o GDR dono da carteira daquele cliente.
function podeEditarRdaDaAgenda(r, u){
  if (podeEditarSetupVigente(u.role)) return true;
  if (r.analistaId === u.id) return true;
  if (u.role === 'gdr' && r.clienteId && clientById(r.clienteId)?.gdrId === u.id) return true;
  return false;
}

function pageRecorrencia(){

  const busca = (state.recorrenciaBusca||'').trim().toLowerCase();
  let list = RECORRENCIA;
  if(busca) list = list.filter(r =>
    r.clienteNomePlanilha.toLowerCase().includes(busca) ||
    (r.analistaNomePlanilha||'').toLowerCase().includes(busca)
  );

  const view = state.recorrenciaView || 'cliente';

  // Agrupa por uma CHAVE ESTÁVEL (cliente_id quando existe), nunca pelo
  // texto bruto — duas linhas do mesmo cliente podem ter grafias diferentes
  // (ex: uma editada recentemente sincroniza com o nome oficial do cadastro,
  // outra ainda tem a grafia antiga da migração), e agrupar por texto fazia
  // isso virar dois grupos separados na tela pro mesmo cliente.
  const porCliente = {};
  const nomeExibicao = {};
  for(const r of list){
    const chave = r.clienteId ? `id:${r.clienteId}` : `nome:${normalizeName(r.clienteNomePlanilha)}`;
    (porCliente[chave] = porCliente[chave]||[]).push(r);

    }
  }
  const chavesOrdenadas = Object.keys(porCliente).sort((a,b)=>nomeExibicao[a].localeCompare(nomeExibicao[b]));
  const qtdAmbiguos = RECORRENCIA.filter(r=>r.periodoAmbiguo).length;
  const qtdSemAnalista = RECORRENCIA.filter(r=>!r.analistaId).length;
  const expandTudo = state.recorrenciaExpandirTudo;

  return `
  <div class="topbar">
    <div><h1>Setup Mensal</h1><div class="sub">Grade semanal fixa (cliente × analista × semana × dia) — datas mostradas são dos 3 meses seguintes a ${CONFIG.mesReferencia}/${CONFIG.anoReferencia} (mês de referência, já coberto pelo Cronograma Vigente).${podeEditar? ' Toda manutenção é feita aqui, sem precisar reenviar planilha.' : ' Apenas RMO, Coordenação e Gerência podem editar — você está em modo visualização.'}</div></div>
    ${podeEditar? `<button class="btn btn-primary" data-action="openRecorrenciaModal" data-args='[]'>+ Nova recorrência</button>` : ''}
  </div>

  ${podeEditar ? `
  <div class="panel" style="margin-bottom:18px;">
    <div class="panel-body" style="display:flex;align-items:center;gap:10px;">
      <span class="cell-sub">${RECORRENCIA.length} registro(s) no Setup atual.</span>
      <button class="btn btn-ghost btn-sm" data-action="goPage" data-args='["importador"]'>📥 Importar planilha</button>
    </div>
  </div>` : ''}

  ${(qtdAmbiguos>0 || qtdSemAnalista>0) ? `
  <div class="panel" style="margin-bottom:18px;">
    <div class="panel-body" style="display:flex;gap:22px;flex-wrap:wrap;">
      ${qtdAmbiguos>0? `<div class="cell-sub">⚠️ <b style="color:var(--warn);">${qtdAmbiguos}</b> registro(s) migrados da planilha antiga sem anotação clara de manhã/tarde — vale revisar.</div>`:''}
      ${qtdSemAnalista>0? `<div class="cell-sub">👤 <b style="color:var(--warn);">${qtdSemAnalista}</b> registro(s) sem analista casado com o cadastro (nome não encontrado).</div>`:''}
    </div>
  </div>` : ''}

  <div class="pill-tabs" style="margin-bottom:18px;">
    <button class="pill-tab ${view==='cliente'?'active':''}" data-action="setRecorrenciaView" data-args='["cliente"]'>🏢 Por Cliente</button>
    <button class="pill-tab ${view==='analista'?'active':''}" data-action="setRecorrenciaView" data-args='["analista"]'>👤 Por Analista</button>
  </div>

  <div class="toolbar" style="margin-bottom:18px;">
    <div class="search-box">
      <input id="rec-search" list="dl-busca-rec" placeholder="Buscar por cliente ou analista…" value="${state.recorrenciaBusca||''}" data-input="setRecorrenciaBusca">
      <datalist id="dl-busca-rec">
        ${[...CLIENTS].filter(clienteAtivo).sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>`<option value="${c.nome}">`).join('')}
        ${USERS.filter(u=>u.role==='analista').sort((a,b)=>a.name.localeCompare(b.name)).map(u=>`<option value="${u.name}">`).join('')}

    </div>

const DIAS_SEMANA_UTEIS = ['Segunda','Terça','Quarta','Quinta','Sexta'];
// Nome curto pra caber na célula da grade — nome completo fica no title (tooltip).
// Horas padrão por período — usado como sugestão automática quando alguém
// muda o período num formulário (Futuro, Vigente, Lançamento Manual,
// Setup). Período "Horas" (customizado) não tem padrão, a pessoa digita.
function horasPadraoPorPeriodo(periodo){
  if (periodo === 'Integral') return 8;
  if (periodo === 'Manhã') return 3.5;
  if (periodo === 'Tarde') return 4.5;
  return null;
}
function aplicarHorasPadrao(periodo, horasInputId){
  const h = horasPadraoPorPeriodo(periodo);
  if (h !== null) document.getElementById(horasInputId).value = h;
}
function nomeClienteCurto(r){
  const nome = r.clienteId ? (clientById(r.clienteId)?.nome || r.clienteNomePlanilha) : r.clienteNomePlanilha;
  return nome || '—';
}
function blocoRecorrenciaPorAnalista(list, expandTudo){
  // Agrupa por analista com a mesma lógica de chave estável usada pra
  // cliente (id quando casado, senão nome normalizado).
  const porAnalista = {};
  const nomeExibicaoAn = {};
  const naoCasado = {};
  for (const r of list){
    if (!r.analistaNomePlanilha) continue;
    const chave = r.analistaId ? `id:${r.analistaId}` : `nome:${normalizeName(r.analistaNomePlanilha)}`;
    (porAnalista[chave] = porAnalista[chave]||[]).push(r);
    naoCasado[chave] = !r.analistaId;
    if(!nomeExibicaoAn[chave]) nomeExibicaoAn[chave] = r.analistaId ? (userById(r.analistaId)?.name || r.analistaNomePlanilha) : `${r.analistaNomePlanilha} (não casado)`;
  }
  // Analistas casados primeiro (ordem alfabética); os "não casado" ficam
  // agrupados no final — senão nomes tipo "1.0", "10.0" (números crus da
  // planilha) intercalam por ordem alfanumérica no meio da lista real.
  const chaves = Object.keys(porAnalista).sort((a,b)=>{
    if (naoCasado[a] !== naoCasado[b]) return naoCasado[a] ? 1 : -1;
    return nomeExibicaoAn[a].localeCompare(nomeExibicaoAn[b]);
  });
  if (chaves.length===0) return `<div class="panel">${emptyState('👤','Nenhuma recorrência encontrada.')}</div>`;
  const qtdNaoCasados = chaves.filter(c=>naoCasado[c]).length;

  const celula = (entries) => entries.length===0 ? '' :
    entries.map(e => {
      const meioPeriodo = e.periodo === 'Manhã' || e.periodo === 'Tarde';
      const sufixo = meioPeriodo ? ` (${e.periodo.toLowerCase()})` : '';
      const estilo = meioPeriodo ? ' style="color:var(--warn);"' : '';
      return `<span class="rec-grade-cel"${estilo} title="${nomeClienteCurto(e)} · ${e.periodo}${e.periodoAmbiguo?' (revisar período)':''}">${nomeClienteCurto(e)}${sufixo}</span>`;
    }).join('');

  return `
  ${qtdNaoCasados>0 ? `
  <div class="panel" style="margin-bottom:12px;">
    <div class="panel-body">
      <div class="cell-sub">👤 <b style="color:var(--warn);">${qtdNaoCasados}</b> analista(s) "não casado" (nome da planilha não bateu com nenhum usuário cadastrado — em alguns casos o próprio texto da planilha nem é um nome, tipo um número solto). Aparecem no final da lista.</div>
    </div>
  </div>` : ''}
  <div class="panel"><div class="panel-body" style="padding:0;">
    ${chaves.map(chave => {
      const entries = porAnalista[chave];
      const nome = nomeExibicaoAn[chave];
      const aberto = expandTudo || !!state.recorrenciaExpandidosAnalista[chave];
      const semanas = [...new Set(entries.map(e=>e.semana))].sort((a,b)=>a-b);
      return `
      <div class="rec-cliente-row" data-action="toggleRecorrenciaAnalista" data-args='["${chave.replace(/"/g,'&quot;')}"]'>
        <span class="rec-caret">${aberto?'▾':'▸'}</span>
        <span class="cell-strong" style="flex:1;">${nome}</span>
        <span class="badge badge-muted">${entries.length}</span>
      </div>
      ${aberto ? `
      <table class="rec-grade-analista" style="margin-bottom:6px;">
        <thead><tr><th style="min-width:100px;"></th>${DIAS_SEMANA_UTEIS.map(d=>`<th>${d}</th>`).join('')}</tr></thead>
        <tbody>
          ${semanas.map(s=>`
          <tr>
            <td class="cell-sub" style="font-style:italic;">Semana ${s}</td>
            ${DIAS_SEMANA_UTEIS.map(d=>`<td>${celula(entries.filter(e=>e.semana===s && e.dia===d))}</td>`).join('')}
          </tr>`).join('')}
        </tbody>
      </table>` : ''}`;
    }).join('')}
  </div></div>`;
}

function blocoRecorrenciaPorCliente(list, chavesOrdenadas, porCliente, nomeExibicao, expandTudo, podeEditar){
  return `
  ${chavesOrdenadas.length===0 ? `<div class="panel">${emptyState('🔁','Nenhuma recorrência encontrada.')}</div>` : `
  <div class="panel"><div class="panel-body" style="padding:0;">
    ${chavesOrdenadas.map(chave=>{
      const nome = nomeExibicao[chave];
      const entries = [...porCliente[chave]].sort((a,b)=> a.semana-b.semana || a.dia.localeCompare(b.dia));
      const aberto = expandTudo || !!state.recorrenciaExpandidos[chave];
      return `
      <div class="rec-cliente-row" data-action="toggleRecorrenciaCliente" data-args='["${chave.replace(/"/g,'&quot;')}"]'>
        <span class="rec-caret">${aberto?'▾':'▸'}</span>
        <span class="cell-strong" style="flex:1;">${nome}</span>
        <span class="badge badge-muted">${entries.length}</span>
      </div>
      ${aberto ? `
      <table style="margin-bottom:6px;">
        <thead><tr><th>Semana</th><th>Dia</th><th>Analista</th><th>Período</th><th>Próximas datas (3 meses)</th>${podeEditar?'<th></th>':''}</tr></thead>
        <tbody>
          ${entries.map(r=>{
            const datasFuturas = proximosMesesFuturo(3).map(m=>{
              const dt = primeiraDataNoBloco(m.ano, m.mesIndex0, r.semana, r.dia);
              if(!dt) return null;
              const dataStr = isoDate(dt);
              const jaCriada = r.analistaId && r.clienteId && (
                AGENDA_VIGENTE.some(a => a.analistaId===r.analistaId && a.clienteId===r.clienteId && a.data===dataStr) ||
                AGENDA_FUTURA.some(a => a.analistaId===r.analistaId && a.clienteId===r.clienteId && a.data===dataStr)
              );
              return { dataStr, jaCriada };
            }).filter(Boolean);
            return `
            <tr class="tr-hover">
              <td>Semana ${r.semana}</td>
              <td>${r.dia}</td>
              <td>${r.analistaId ? (userById(r.analistaId) ? (userById(r.analistaId).ativo===false ? `${userById(r.analistaId).name} (indisponível)` : userById(r.analistaId).name) : r.analistaNomePlanilha) : `<span class="cell-sub">${r.analistaNomePlanilha} (não casado)</span>`}</td>
              <td>${r.periodo}${r.periodoAmbiguo?' <span class="badge badge-warn">revisar</span>':''}</td>
              <td>
                ${r.analistaId && r.clienteId ? datasFuturas.map(d => {
                  const aviso = avisoFeriasFeriadoHtml(r.analistaId, d.dataStr);
                  if (aviso) return `<span style="margin-right:4px;">${aviso}</span>`;
                  return d.jaCriada
                    ? `<span class="badge badge-ok" style="margin-right:4px;">✓ ${fmtDate(d.dataStr)}</span>`

async function salvarRecorrencia(){
  if(state.salvandoRecorrencia) return;
  if(!podeEditarSetupVigente(state.authUser.role)){ toast('Só RMO, Coordenação e Gerência podem editar a agenda recorrente.', 'err'); return; }
  const p = state.modal.payload;
  const clienteNome = document.getElementById('rec-cliente').value.trim();
  const analistaId = document.getElementById('rec-analista').value;
  const semana = parseInt(document.getElementById('rec-semana').value, 10);
  const dia = document.getElementById('rec-dia').value;
  const periodo = document.getElementById('rec-periodo').value;
  // Guarda o que já foi digitado antes de validar, pro modal não se
  // reconstruir com valores antigos caso falte algo (mesmo padrão de bug
  // já corrigido em outros formulários deste app).
  p.clienteNome = clienteNome; p.analistaId = analistaId; p.semana = semana; p.dia = dia; p.periodo = periodo;

  const cliente = CLIENTS.find(c => c.nome.toLowerCase() === clienteNome.toLowerCase());
  if(!cliente){ state.recorrenciaErr = `"${clienteNome}" não é um cliente cadastrado. Escolha um da lista de sugestões.`; render(); return; }
  if(!analistaId){ state.recorrenciaErr = 'Selecione o analista.'; render(); return; }

  state.salvandoRecorrencia = true; state.recorrenciaErr = null; render();
  try{
    const analista = userById(analistaId);
    const row = {
      cliente_id: cliente.id, cliente_nome_planilha: cliente.nome,
      analista_id: analistaId, analista_nome_planilha: analista ? analista.name : '',
      semana, dia_semana: dia, periodo, periodo_ambiguo: false,
    };
    if(p.id){
      const { error } = await sb.from('crm_agenda_recorrente')
        .update({ ...row, atualizado_em: new Date().toISOString() }).eq('id', p.id);
      if(error){ state.recorrenciaErr = 'Erro ao salvar: ' + error.message; return; }
      const idx = RECORRENCIA.findIndex(r=>r.id===p.id);
      if(idx>=0){
        RECORRENCIA[idx] = { ...RECORRENCIA[idx],
          clienteId: cliente.id, clienteNomePlanilha: cliente.nome,
          analistaId, analistaNomePlanilha: row.analista_nome_planilha,
          semana, dia, periodo, periodoAmbiguo: false,
        };
      }
      toast('Recorrência atualizada.');
    } else {
      const { data, error } = await sb.from('crm_agenda_recorrente')
        .insert({ ...row, criado_por: state.authUser.id }).select().single();
      if(error){ state.recorrenciaErr = 'Erro ao criar: ' + error.message; return; }
      RECORRENCIA.push(mapRecorrenciaRow(data));
      toast('Recorrência criada.');
    }
    state.modal = null;
  } finally {
    state.salvandoRecorrencia = false; render();
  }
}

const SETUP_IMPORT_ETAPAS = ['Lendo a planilha…', 'Casando clientes e analistas…', 'Limpando o Setup anterior…', 'Gravando os novos registros…'];
async function onImportarSetupFileChange(el){
  if(!podeEditarSetupVigente(state.authUser.role)){ toast('Só RMO, Coordenação e Gerência podem importar o Setup.', 'err'); return; }
  const file = el.files && el.files[0];
  if (!file) return;
  state.setupImportCarregando = true; state.setupImportErro = null;
  setImportStatus('setup', SETUP_IMPORT_ETAPAS[0]);
  try{
    // Reaproveita o parser já usado no "Importar Planilha" do GDR — mesma
    // leitura de cor de célula pra Integral/Meio período, mesmo tratamento
    // de múltiplas pessoas numa célula.
    const grid = await parseAgendaXlsxGrid(file);
    const clientesPlanilha = extractAgendaClients(grid);
    if (clientesPlanilha.length === 0){
      throw new Error('Não encontrei nenhum cliente na aba "Visão - Por Cliente" desse arquivo.');
    }

    setImportStatus('setup', SETUP_IMPORT_ETAPAS[1]);
    const rows = [];
    let semCliente = 0, semAnalista = 0, ambiguos = 0;
    for (const cp of clientesPlanilha){
      const clienteReal = matchClienteByNome(cp.nome);
      if (!clienteReal) semCliente++;
      for (const e of cp.entries){
        const analistaReal = matchAnalistaUsuario(e.pessoa);
        if (!analistaReal) semAnalista++;
        let periodo, periodoAmbiguo;
        if (e.categoria === 'integral'){ periodo = 'Integral'; periodoAmbiguo = false; }
        else if (e.anotacao === 'tarde'){ periodo = 'Tarde'; periodoAmbiguo = false; }
        else if (e.anotacao === 'manhã'){ periodo = 'Manhã'; periodoAmbiguo = false; }
        else { periodo = 'Manhã'; periodoAmbiguo = true; ambiguos++; }
        rows.push({
          cliente_id: clienteReal ? clienteReal.id : null, cliente_nome_planilha: cp.nome,
          analista_id: analistaReal ? analistaReal.id : null, analista_nome_planilha: e.pessoa,
          semana: e.semana, dia_semana: e.dia, periodo, periodo_ambiguo: periodoAmbiguo,
        });
      }
    }

    // Substitui o Setup inteiro — a planilha enviada é a fonte de verdade
    // quando reenviada, então tudo que existia antes é limpo primeiro.
    setImportStatus('setup', SETUP_IMPORT_ETAPAS[2]);
    const { error: delErr } = await sb.from('crm_agenda_recorrente').delete().neq('id', '00000000-0000-0000-0000-000000000000');
    if (delErr) throw new Error('Erro ao limpar o Setup anterior: ' + delErr.message);

    const CHUNK = 200;
    for (let i=0; i<rows.length; i+=CHUNK){
      setImportStatus('setup', SETUP_IMPORT_ETAPAS[3], Math.min(i+CHUNK, rows.length), rows.length);
      const { error } = await sb.from('crm_agenda_recorrente').insert(rows.slice(i, i+CHUNK));
      if (error) throw new Error('Erro ao gravar o Setup: ' + error.message);
    }

    await loadRecorrencia();
    toast(`Setup importado: ${rows.length} registro(s) de ${clientesPlanilha.length} cliente(s).` +
      (semCliente||semAnalista||ambiguos ? ` (${semCliente} cliente(s) sem match, ${semAnalista} analista(s) sem match, ${ambiguos} período(s) ambíguo(s))` : ''));
  } catch(err){
    state.setupImportErro = 'Erro ao importar o Setup: ' + (err && err.message ? err.message : err);
  } finally {
    clearImportStatus('setup');
    state.setupImportCarregando = false; render();
  }
}

// Toda agenda "de verdade" (ticket concluído, Setup enviado, lançamento
// manual) cai no Cronograma Vigente se a data for do mês atual, ou no
// Cronograma Futuro se for de um dos 3 meses seguintes — nunca mais direto
// em crm_agendas. É esse roteamento que faz a Disponibilidade enxergar tudo
// num lugar só.
function mesAnoDaData(dataStr){
  const dt = new Date(dataStr + 'T00:00:00');
  return { mes: MESES_PT[dt.getMonth()], ano: dt.getFullYear(), dt };
}
// "Mês atual" pra fins de Vigente-vs-Futuro é o mês de REFERÊNCIA do
// sistema (CONFIG), não o calendário real — eles só coincidem até alguém
// "promover" o próximo mês (ver promoverMesParaVigente).
//
// Importante: não é só "igual" ao mês de referência — qualquer data de um
// mês JÁ PROMOVIDO (igual ou anterior ao de referência) também pertence ao
// Vigente. Só datas de meses SEGUINTES ao de referência vão pro Futuro.
// Sem essa comparação "menor ou igual", uma agenda de ticket criada logo
// depois de alguém promover o mês (pra uma data de um mês que já tinha
// sido promovido antes) ia parar no Futuro e nunca mais aparecer em
// nenhuma tela — foi exatamente isso que aconteceu com o ticket do Nathan.
function ehMesAtual(dataStr){
  const { dt } = mesAnoDaData(dataStr);
  const mesIndex0Ref = MESES_PT.indexOf(CONFIG.mesReferencia);
  const chaveData = dt.getFullYear()*12 + dt.getMonth();
  const chaveReferencia = CONFIG.anoReferencia*12 + mesIndex0Ref;
  return chaveData <= chaveReferencia;
}
async function registrarAgendaPorData({ clienteId, analistaId, clienteNome, analistaNome, dataStr, periodo, horas, tipoAgenda, origem, ticketId }){
  const { mes, ano } = mesAnoDaData(dataStr);
  const u = state.authUser;
  if (ehMesAtual(dataStr)){
    const row = {
      analista_id: analistaId, analista_nome_planilha: analistaNome,
      cliente_id: clienteId, cliente_nome_planilha: clienteNome,
      data: dataStr, periodo, tipo_agenda: tipoAgenda||null, horas, ticket_id: ticketId||null,
      mes, ano, importado_por: u.id,
    };
    const { data, error } = await sb.from('crm_agenda_vigente').insert(row).select().single();
    if (error) throw error;
    AGENDA_VIGENTE.push(mapAgendaVigenteRow(data));
    return { tabela: 'vigente' };
  } else {
    const row = {
      analista_id: analistaId, analista_nome_planilha: analistaNome,
      cliente_id: clienteId, cliente_nome_planilha: clienteNome,
      data: dataStr, periodo, tipo_agenda: tipoAgenda||null, horas,
      origem: origem||'manual', ticket_id: ticketId||null,
      mes, ano, criado_por: u.id,
    };
    const { data, error } = await sb.from('crm_agenda_futura').insert(row).select().single();
    if (error) throw error;
    AGENDA_FUTURA.push(mapAgendaFuturaRow(data));
    return { tabela: 'futura' };
  }
}

async function enviarAgendaDeRecorrenciaData(recorrenciaId, dataStr){
  const r = RECORRENCIA.find(x=>x.id===recorrenciaId);
  if(!r || !r.analistaId || !r.clienteId) return;
  const cliente = clientById(r.clienteId);
  const analistaUser = userById(r.analistaId);
  const u = state.authUser;
  // período "Manhã"/"Tarde" ambíguos migrados sem hora certa caem no padrão
  // de meio período — RMO pode ajustar depois se precisar.
  const horario = TICKET_PERIODO_HORAS[r.periodo] || TICKET_PERIODO_HORAS['Integral'];

  // 1) Abre o convite do Google Agenda já preenchido — igual ao fluxo antigo
  // da Importar Planilha. Isso dá uma confirmação visível na hora (uma aba
  // real do Google Agenda abrindo), em vez de só um toast dizendo que deu
  // certo sem nenhuma prova.
  const emails = new Set();
  splitEmails(cliente && cliente.contato).forEach(e=>emails.add(e));
  if (u.email) emails.add(u.email);
  if (analistaUser && analistaUser.email) emails.add(analistaUser.email);
  const dataCompacta = dataStr.replace(/-/g,'');
  const gcalDates = `${dataCompacta}T${horario.inicio.replace(':','')}00/${dataCompacta}T${horario.fim.replace(':','')}00`;
  const titulo = `Atendimento — ${cliente ? cliente.nome : r.clienteNomePlanilha} (${analistaUser ? analistaUser.name : r.analistaNomePlanilha})`;
  const detalhes = `Agenda gerada a partir do Setup (Semana ${r.semana}, ${r.dia}).\nPeríodo: ${r.periodo}\nAnalista: ${analistaUser ? analistaUser.name : r.analistaNomePlanilha}`;
  const gcalUrl = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(titulo)
    + '&dates=' + gcalDates
    + '&details=' + encodeURIComponent(detalhes)
    + (emails.size ? '&add=' + encodeURIComponent([...emails].join(',')) : '');
  window.open(gcalUrl, '_blank');

  // 2) Registro interno — vai pro Vigente (mês atual) ou Futuro (meses
  // seguintes), dependendo de qual data foi escolhida.
  try{
    const { tabela } = await registrarAgendaPorData({
      clienteId: r.clienteId, analistaId: r.analistaId,
      clienteNome: cliente ? cliente.nome : r.clienteNomePlanilha,
      analistaNome: analistaUser ? analistaUser.name : r.analistaNomePlanilha,
      dataStr, periodo: r.periodo, horas: horario.horas,
      tipoAgenda: `Gerado a partir do Setup (Semana ${r.semana}, ${r.dia})`, origem: 'setup',
    });
    try{ await consumeClientHours(r.clienteId, horario.horas); await loadClients(); }
    catch(e){ toast('Agenda registrada, mas houve erro ao atualizar o saldo do cliente: ' + e.message, 'err'); return; }
    toast(`Convite do Google Agenda aberto e agenda registrada no Cronograma ${tabela==='vigente'?'Vigente':'Futuro'}: ${fmtDate(new Date(dataStr+'T00:00:00'))} para ${analistaUser ? analistaUser.name : ''}.`);
  } catch(error){
    toast('Convite do Google Agenda aberto, mas houve erro ao registrar a agenda no CRM: ' + error.message, 'err');
  } finally {
    render();
  }
}

const DIAS_SEMANA_PT = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
function diaSemanaDe(dataIso){
  if(!dataIso) return '';
  const dt = new Date(dataIso + 'T00:00:00');
  return DIAS_SEMANA_PT[dt.getDay()];
}

// Retorna o período de férias do analista que cobre essa data, ou null.
function feriasNoDia(analistaId, dataStr){
  if (!analistaId || !dataStr) return null;
  return FERIAS.find(f => f.analistaId===analistaId && dataStr >= f.dataInicio && dataStr <= f.dataFim) || null;
}
// Retorna o feriado cadastrado nessa data, ou null.
function feriadoNoDia(dataStr){
  if (!dataStr) return null;
  return FERIADOS.find(f => f.data===dataStr) || null;
}
// HTML pronto do aviso (vazio se não houver nada) — usado no Setup e no
// Cronograma Futuro pra sinalizar que a data cai em férias do analista ou
// em feriado.
function avisoFeriasFeriadoHtml(analistaId, dataStr){
  const ferias = feriasNoDia(analistaId, dataStr);
  const feriado = feriadoNoDia(dataStr);
  const avisos = [];

  if (feriado) avisos.push(`<span class="badge badge-warn" title="${feriado.nome}">📅 Feriado: ${fmtDate(feriado.data)}</span>`);
  return avisos.join(' ');
}

// Conflito de horário: duas agendas de meio período (Manhã + Tarde) do
// mesmo analista no mesmo dia coexistem numa boa. O que NÃO pode é ter
// "Integral" (ou "Horas" — período customizado, sem limite claro de
// meio-dia) junto com qualquer outra coisa naquele dia, nem duas agendas
// do MESMO período meio-dia (ex: duas de Manhã) no mesmo dia.
function computeConflitosFuturo(lista){
  const porChave = {};
  for (const r of lista){
    if (!r.analistaId) continue;
    const chave = r.analistaId + '|' + r.data;
    (porChave[chave] = porChave[chave] || []).push(r);
  }
  const idsConflitantes = new Set();
  for (const grupo of Object.values(porChave)){
    if (grupo.length <= 1) continue;
    const temIntegralOuHoras = grupo.some(r => r.periodo==='Integral' || r.periodo==='Horas');
    if (temIntegralOuHoras){
      grupo.forEach(r => idsConflitantes.add(r.id));
      continue;
    }
    const porPeriodo = {};
    for (const r of grupo){ (porPeriodo[r.periodo] = porPeriodo[r.periodo]||[]).push(r); }
    for (const g of Object.values(porPeriodo)){
      if (g.length > 1) g.forEach(r => idsConflitantes.add(r.id));
    }
  }
  return idsConflitantes;
}
function avisoConflitoHtml(temConflito){
  return temConflito ? `<span class="badge badge-danger" title="Esse analista tem mais de uma agenda nesse dia que não coexistem (ex: Integral junto com outra, ou dois períodos iguais).">⚠️ Conflito de horário</span>` : '';
}
