<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime CRM · Gestão de Projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#060e1c;
  --bg-1:#0a1628;
  --bg-2:#0f2038;
  --bg-3:#142a45;
  --line:rgba(0,180,216,.18);
  --line-strong:rgba(0,180,216,.4);
  --cyan:#00c2e0;
  --cyan-soft:#4fd9ee;
  --cyan-dim:#0a90ab;
  --blue:#1e5fb8;
  --text-0:#f4f8fb;
  --text-1:#aebfd1;
  --text-2:#6f84a0;
  --ok:#2ecf8f;
  --warn:#f5a623;
  --danger:#f2545b;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 10px 30px -12px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--bg-0);
  color:var(--text-0);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4,.font-display{font-family:'Poppins',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
::selection{background:var(--cyan);color:#04121e;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Blob backdrop (auth screens) ---------- */
.auth-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(1100px 700px at 82% 8%, rgba(0,180,216,.35), transparent 60%),
    radial-gradient(900px 600px at 60% 55%, rgba(30,95,184,.35), transparent 60%),
    linear-gradient(160deg,#050b16 0%, #081428 55%, #061020 100%);
  padding:32px 20px;
}
.auth-wrap::before{
  content:'';
  position:absolute; inset:0;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(255,255,255,.05) 1px, transparent 1.6px);
  background-size:26px 26px;
  opacity:.5;
  pointer-events:none;
}
.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(0px);
  opacity:.9;
  mix-blend-mode:screen;
}
.blob1{
  width:640px;height:640px; right:-180px; top:-220px;
  background:conic-gradient(from 210deg, #0a90ab, #00c2e0, #1e5fb8, #0a90ab);
  filter:blur(2px);
  animation:spin 32s linear infinite;
}
.blob2{
  width:420px;height:420px; right:80px; top:120px;
  background:radial-gradient(circle at 35% 35%, #06111f 0 34%, transparent 36%);
}
@keyframes spin{to{transform:rotate(360deg);}}

.auth-card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:960px;
  display:grid;
  grid-template-columns:1.05fr 1fr;
  background:rgba(9,19,36,.72);
  border:1px solid var(--line);
  border-radius:22px;
  overflow:hidden;
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
}
@media (max-width:820px){ .auth-card{grid-template-columns:1fr;} .auth-visual{display:none;} }

.auth-visual{
  padding:46px 40px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  background:linear-gradient(200deg, rgba(0,194,224,.14), rgba(30,95,184,.08));
  border-right:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:conic-gradient(from 140deg,#00c2e0,#1e5fb8,#00c2e0);
  display:flex;align-items:center;justify-content:center;
  font-family:'Poppins';font-weight:800;color:#04121e;font-size:15px;
  box-shadow:0 0 0 1px rgba(255,255,255,.15) inset;
}
.brand-name{font-family:'Poppins';font-weight:700;font-size:17px;letter-spacing:.2px;}
.brand-name b{color:var(--cyan-soft);font-weight:800;}

.auth-visual h1{font-size:34px;line-height:1.14;margin:34px 0 14px;font-weight:700;}
.auth-visual h1 span{
  background:linear-gradient(90deg,var(--cyan-soft),#7fe9f7);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.auth-visual p{color:var(--text-1);font-size:14.5px;line-height:1.6;max-width:380px;}
.auth-stats{display:flex;gap:22px;margin-top:auto;padding-top:26px;border-top:1px solid var(--line);}
.auth-stats div b{display:block;font-family:'Poppins';font-size:20px;color:var(--cyan-soft);}
.auth-stats div span{font-size:11.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;}

.auth-form{padding:44px 42px;display:flex;flex-direction:column;}
.auth-form h2{font-size:22px;margin:0 0 4px;}
.auth-form .sub{color:var(--text-1);font-size:13.5px;margin-bottom:26px;}
.tabs{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:11px;padding:4px;margin-bottom:22px;}
.tab-btn{flex:1;padding:9px 0;border:none;background:transparent;color:var(--text-1);font-size:13px;font-weight:600;border-radius:8px;transition:.15s;}
.tab-btn.active{background:linear-gradient(90deg,var(--cyan-dim),var(--blue));color:#fff;box-shadow:0 4px 14px -4px rgba(0,194,224,.5);}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;color:var(--text-1);margin-bottom:6px;font-weight:600;letter-spacing:.2px;}
.field input, .field select{
  width:100%;padding:11px 13px;border-radius:10px;
  background:var(--bg-2);border:1px solid var(--line);
  color:var(--text-0);font-size:13.5px;outline:none;transition:.15s;
}
.field input:focus, .field select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,194,224,.15);}
/* Checkboxes/radios não devem herdar o estilo de input de texto acima
   (senão viram caixas esticadas e desalinhadas — exatamente o bug visto). */
.field input[type="checkbox"], .field input[type="radio"]{
  width:auto; padding:0; background:none; border:none; box-shadow:none; accent-color:var(--cyan);
}
.check-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:2px 16px;
  max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:10px;
  padding:10px 14px; background:var(--bg-2);
}
.check-row{display:flex; gap:22px; flex-wrap:wrap; margin-top:4px;}
label.check-item{
  display:flex!important; align-items:center; gap:8px; padding:6px 4px; border-radius:6px;
  font-size:12.5px!important; color:var(--text-1); cursor:pointer;
  font-weight:400!important; letter-spacing:normal!important; margin:0!important;
}
label.check-item:hover{background:rgba(0,194,224,.07); color:var(--text-0);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.role-opt{border:1px solid var(--line);background:var(--bg-2);border-radius:10px;padding:11px 12px;cursor:pointer;transition:.15s;}
.role-opt:hover{border-color:var(--line-strong);}
.role-opt.sel{border-color:var(--cyan);background:rgba(0,194,224,.1);box-shadow:0 0 0 1px var(--cyan) inset;}
.role-opt .rt{font-size:12.5px;font-weight:700;display:block;}
.role-opt .rd{font-size:10.5px;color:var(--text-2);}

.btn{
  border:none;border-radius:10px;padding:12px 18px;font-weight:700;font-size:13.5px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.15s;
}
.btn-primary{background:linear-gradient(90deg,var(--cyan-dim),var(--blue));color:#fff;box-shadow:0 8px 20px -8px rgba(0,194,224,.6);}
.btn-primary:hover{filter:brightness(1.1);transform:translateY(-1px);}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text-1);}
.btn-ghost:hover{border-color:var(--line-strong);color:var(--text-0);}
.btn-danger{background:rgba(242,84,91,.15);color:#ff9498;border:1px solid rgba(242,84,91,.35);}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

.hint-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:12.5px;color:var(--text-2);}
.link-btn{background:none;border:none;color:var(--cyan-soft);font-weight:600;font-size:12.5px;padding:0;}
.err-box{background:rgba(242,84,91,.12);border:1px solid rgba(242,84,91,.35);color:#ff9498;font-size:12.5px;padding:10px 12px;border-radius:9px;margin-bottom:14px;}
.demo-box{margin-top:18px;border:1px dashed var(--line-strong);border-radius:10px;padding:12px 14px;font-size:11.5px;color:var(--text-2);}
.demo-box b{color:var(--cyan-soft);}
.demo-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.chip{border:1px solid var(--line);background:var(--bg-2);padding:5px 9px;border-radius:100px;font-size:11px;color:var(--text-1);}
.chip:hover{border-color:var(--cyan);color:var(--cyan-soft);}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:var(--bg-0);}
.sidebar{
  background:var(--bg-1);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;
}
.side-top{display:flex;align-items:center;gap:10px;padding:0 6px 20px;border-bottom:1px solid var(--line);margin-bottom:16px;}
.nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--text-2);margin:14px 8px 6px;font-weight:700;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;color:var(--text-1);
  font-size:13.5px;font-weight:600;margin-bottom:3px;border:1px solid transparent;transition:.15s;
}
.nav-item:hover{background:var(--bg-2);color:var(--text-0);}
.nav-item.active{background:linear-gradient(90deg, rgba(0,194,224,.16), rgba(30,95,184,.10));border-color:var(--line-strong);color:#fff;}
.nav-item .ico{width:18px;text-align:center;font-size:15px;}
.nav-badge{margin-left:auto;background:var(--cyan);color:#04121e;font-size:10px;font-weight:800;padding:1px 6px;border-radius:100px;}
.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;}
.user-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;}
.avatar{
  width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:'Poppins';font-weight:700;font-size:13px;color:#04121e;flex-shrink:0;
}
.user-card .un{font-size:12.5px;font-weight:700;line-height:1.2;}
.user-card .ur{font-size:10.5px;color:var(--text-2);}
.logout-btn{width:100%;margin-top:10px;}

.main{padding:26px 34px 60px;max-width:1400px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;flex-wrap:wrap;gap:14px;}
.topbar h1{font-size:24px;margin:0 0 4px;}
.topbar .sub{color:var(--text-1);font-size:13.5px;}
.role-badge{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:100px;border:1px solid var(--line-strong);color:var(--cyan-soft);
  background:rgba(0,194,224,.08); text-transform:uppercase; letter-spacing:.4px;
}

/* ---------- Cards / KPIs ---------- */
.grid{display:grid;gap:16px;}
.kpi-row{grid-template-columns:repeat(4,1fr);margin-bottom:22px;}
@media (max-width:1100px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
.card{
  background:linear-gradient(180deg, var(--bg-1), var(--bg-1) 60%, var(--bg-2));
  border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;position:relative;overflow:hidden;
}
.card::after{content:'';position:absolute;top:-40%;right:-20%;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle, rgba(0,194,224,.14), transparent 70%);pointer-events:none;}
.kpi-label{font-size:11.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:8px;}
.kpi-value{font-family:'Poppins';font-size:27px;font-weight:700;}
.kpi-value small{font-size:14px;color:var(--text-2);font-weight:600;}
.kpi-delta{font-size:11.5px;margin-top:6px;font-weight:600;}
.kpi-delta.up{color:var(--ok);}
.kpi-delta.down{color:var(--danger);}
.kpi-delta.flat{color:var(--text-2);}

.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 14px;}
.section-title h3{font-size:16px;margin:0;}
.section-title .sd{font-size:12px;color:var(--text-2);margin-top:2px;}

.panel{background:var(--bg-1);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.panel-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.panel-head h3{font-size:15px;margin:0;}
.panel-body{padding:18px 20px;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--text-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
  padding:9px 14px;border-bottom:1px solid var(--line);font-weight:700;background:rgba(255,255,255,.015);}
td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.045);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr.tr-hover:hover{background:rgba(0,194,224,.045);}
.cell-strong{font-weight:700;}
.cell-sub{font-size:11px;color:var(--text-2);}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:100px;text-transform:uppercase;letter-spacing:.3px;}
.badge-ok{background:rgba(46,207,143,.14);color:var(--ok);}
.badge-warn{background:rgba(245,166,35,.14);color:var(--warn);}
.badge-danger{background:rgba(242,84,91,.14);color:var(--danger);}
.badge-info{background:rgba(0,194,224,.14);color:var(--cyan-soft);}
.badge-muted{background:rgba(255,255,255,.06);color:var(--text-1);}

.progress{height:7px;border-radius:100px;background:var(--bg-3);overflow:hidden;position:relative;}
.progress > i{display:block;height:100%;border-radius:100px;background:linear-gradient(90deg,var(--cyan-dim),var(--cyan));}
.progress.warn > i{background:linear-gradient(90deg,#b5760f,var(--warn));}
.progress.danger > i{background:linear-gradient(90deg,#9c2f34,var(--danger));}

.loading-card{
  display:flex;align-items:center;gap:14px;margin-top:14px;
  padding:14px 16px;border-radius:12px;
  background:linear-gradient(135deg, rgba(0,194,224,.08), rgba(30,95,184,.06));
  border:1px solid var(--line-strong);
}
.loading-spin{
  width:22px;height:22px;flex-shrink:0;border-radius:50%;
  border:2.5px solid rgba(0,194,224,.25);border-top-color:var(--cyan);
  animation:loadspin .8s linear infinite;
}
@keyframes loadspin{to{transform:rotate(360deg);}}
.loading-body{flex:1;min-width:0;}
.loading-msg{font-size:12.5px;font-weight:600;color:var(--text-0);transition:opacity .25s;}
.loading-bar{height:5px;border-radius:100px;background:var(--bg-3);overflow:hidden;margin-top:8px;position:relative;}
.loading-bar > i{
  position:absolute;top:0;left:0;height:100%;width:40%;border-radius:100px;
  background:linear-gradient(90deg, transparent, var(--cyan-soft), transparent);
  animation:loadsweep 1.3s ease-in-out infinite;
}
@keyframes loadsweep{
  0%{left:-40%;}
  100%{left:100%;}
}
.loading-bar.determinate > i{
  position:static;width:var(--pct,0%);animation:none;
  background:linear-gradient(90deg, var(--cyan), var(--cyan-soft));
  transition:width .3s ease;
}
.loading-steps{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
.loading-step{font-size:11px;color:var(--text-2);display:flex;align-items:center;gap:6px;}
.loading-step.done{color:var(--text-1);}
.loading-step.active{color:var(--cyan);font-weight:600;}

.vg-filtros{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;}

.kanban-board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:14px;overflow-x:auto;align-items:start;}
.kanban-col{background:var(--bg-1);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:120px;transition:background .15s,border-color .15s;}
.kanban-col.kanban-col-over{background:rgba(0,194,224,.06);border-color:var(--cyan);}
.kanban-col-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);}
.kanban-col-body{padding:10px;display:flex;flex-direction:column;gap:8px;min-height:60px;}
.kanban-empty{text-align:center;color:var(--text-2);font-size:12px;padding:18px 0;}
.kanban-card{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:grab;transition:transform .1s,box-shadow .1s,opacity .1s;}
.kanban-card:hover{border-color:var(--cyan);box-shadow:0 2px 10px rgba(0,0,0,.25);}
.kanban-card.kanban-dragging{opacity:.4;}
.kanban-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.kanban-card-titulo{font-size:13px;font-weight:600;color:var(--text-0);line-height:1.35;}
.kanban-card-avatares{display:flex;gap:4px;margin-top:8px;align-items:center;}
@media (max-width:900px){.kanban-board{grid-template-columns:1fr;}}

.vg-filtros .field{min-width:200px;flex:1;}

.rec-cliente-row{
  display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;
  border-bottom:1px solid var(--line);transition:.1s;
}
.rec-cliente-row:hover{background:rgba(0,194,224,.05);}
.rec-caret{color:var(--text-2);font-size:11px;width:12px;}

.rec-grade-analista{width:100%;border-collapse:collapse;table-layout:fixed;}
.rec-grade-analista th{position:sticky;top:0;background:var(--bg-2);z-index:1;}
.rec-grade-analista th:first-child{width:220px;}
.rec-grade-analista td{font-size:12px;padding:6px 10px;}
.rec-grade-nome{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.rec-grade-cel{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.empty{padding:46px 20px;text-align:center;color:var(--text-2);}
.empty .ei{font-size:30px;margin-bottom:10px;}
.empty b{color:var(--text-1);display:block;margin-bottom:4px;font-size:13.5px;}

/* Buttons row */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.search-box{position:relative;}
.search-box input{padding:9px 12px 9px 32px;border-radius:9px;border:1px solid var(--line);background:var(--bg-2);color:var(--text-0);font-size:12.5px;width:220px;}
.search-box::before{content:'⌕';position:absolute;left:11px;top:8px;color:var(--text-2);font-size:14px;}
.select-mini{padding:9px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg-2);color:var(--text-1);font-size:12.5px;}

/* Timer card */
.timer-card{
  background:linear-gradient(135deg, rgba(0,194,224,.10), rgba(30,95,184,.08));
  border:1px solid var(--line-strong);border-radius:18px;padding:28px 30px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:24px;
  position:relative;overflow:hidden;
}
.timer-card::before{content:'';position:absolute;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle, rgba(0,194,224,.18), transparent 70%);top:-100px;right:-60px;}
.timer-left{position:relative;z-index:1;}
.timer-left .tl-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-2);font-weight:700;margin-bottom:8px;}
.timer-clock{font-family:'JetBrains Mono';font-size:44px;font-weight:600;letter-spacing:1px;color:#fff;}
.timer-clock.idle{color:var(--text-2);font-size:20px;font-family:'Inter';font-weight:600;}
.timer-client{font-size:13px;color:var(--cyan-soft);margin-top:6px;font-weight:600;}
.timer-right{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;min-width:260px;}

.modal-bg{position:fixed;inset:0;background:rgba(3,8,16,.68);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:var(--bg-1);border:1px solid var(--line-strong);border-radius:16px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:var(--shadow);}
.modal-wide{max-width:820px;}

/* O preview sandboxed do Claude não dá acesso direto à internet ao iframe;
   ele intercepta window.fetch e repassa a chamada ao frame pai via
   postMessage/structured-clone. O supabase-js cria um objeto Headers()
   nativo internamente, e Headers não é serializável por structured clone
   ("DataCloneError: Headers object could not be cloned"). Aqui a gente
   passa um fetch customizado que converte Headers para um objeto simples
   antes de qualquer chamada de rede, contornando o problema — funciona
   tanto dentro do sandbox quanto em um navegador normal. */
function safeFetch(url, options = {}){
  const opts = { ...options };
  if(opts.headers){
    if(typeof Headers !== 'undefined' && opts.headers instanceof Headers){
      const plain = {};
      opts.headers.forEach((value, key) => { plain[key] = value; });
      opts.headers = plain;
    } else if(typeof opts.headers.forEach === 'function' && !Array.isArray(opts.headers)){
      const plain = {};
      opts.headers.forEach((value, key) => { plain[key] = value; });
      opts.headers = plain;
    }
  }
  return fetch(url, opts);
}

  if(!box){

/* Mapeia uma linha da tabela real planilha_centralizadora para o
   formato que a UI já usa (mesmos nomes de sempre, para não precisar
   reescrever as telas). */
function matchGdrId(gdrNomePlanilha){
  const alvo = String(gdrNomePlanilha||'').trim().toLowerCase();
  if(!alvo) return null;
  // Nomes na planilha costumam ser abreviados ("Felipe Carvalho") enquanto o
  // cadastro de usuários guarda o nome completo ("Felipe Carvalho de Moura
  // Marco") — por isso usamos correspondência por prefixo, não igualdade.
  const gdrs = USERS.filter(u=>u.role==='gdr');
  let match = gdrs.find(u=>u.name.trim().toLowerCase()===alvo);
  if(!match) match = gdrs.find(u=>u.name.trim().toLowerCase().startsWith(alvo));
  if(!match) match = gdrs.find(u=>alvo.startsWith(u.name.trim().toLowerCase()));
  return match ? match.id : null;
}

async function loadUsers(){

// O Supabase/PostgREST limita cada SELECT a 1000 linhas por padrão — acima
// disso ele simplesmente corta o resto, sem avisar. Qualquer tabela que
// pode crescer além disso (agendas, cancelamentos etc.) precisa paginar
// com .range() até a página vir vazia/curta.
async function selectAllPaginado(tabela, colunas, ordenarPor){
  const PAGE = 1000;
  const ordem = ordenarPor || { coluna: 'id', ascending: true };
  let all = [];
  let from = 0;
  while (true){
    const { data, error } = await sb.from(tabela).select(colunas || '*')
      .order(ordem.coluna, { ascending: ordem.ascending !== false })
      .range(from, from + PAGE - 1);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < PAGE) break;
    from += PAGE;
  }
  return all;
}

function mapKanbanCardRow(row, responsaveisIds){
  return {
    id: row.id, titulo: row.titulo, descricao: row.descricao,
    coluna: row.coluna, prioridade: row.prioridade,
    clienteId: row.cliente_id, dataPrevista: row.data_prevista, ordem: row.ordem,
    criadoPor: row.criado_por, criadoEm: row.criado_em, atualizadoEm: row.atualizado_em,
    responsaveisIds: responsaveisIds || [],
  };
}
async function loadKanban(){
  const [cardsData, respData, comentData] = await Promise.all([
    selectAllPaginado('crm_kanban_cards', '*', { coluna: 'ordem' }),
    selectAllPaginado('crm_kanban_card_responsaveis', '*', { coluna: 'card_id' }),
    selectAllPaginado('crm_kanban_comentarios', '*', { coluna: 'criado_em' }),
  ]);
  const respPorCard = {};
  for (const r of respData) (respPorCard[r.card_id] = respPorCard[r.card_id]||[]).push(r.usuario_id);
  KANBAN_CARDS = cardsData.map(row => mapKanbanCardRow(row, respPorCard[row.id]));
  KANBAN_COMENTARIOS = comentData.map(row => ({ id: row.id, cardId: row.card_id, texto: row.texto, criadoPor: row.criado_por, criadoEm: row.criado_em }));
}
async function loadSkills(){
  const { data, error } = await sb.from('crm_skills').select('*').order('nome');
  if(error) throw error;
  SKILLS = data;
}
async function loadUserSkills(){
  const { data, error } = await sb.from('crm_usuario_skills').select('usuario_id, skill_id');
  if(error) throw error;
  const skillNomeById = {};
  SKILLS.forEach(s=>{ skillNomeById[s.id] = s.nome; });
  const map = {};
  for(const row of data){
    if(!map[row.usuario_id]) map[row.usuario_id] = new Set();
    map[row.usuario_id].add(skillNomeById[row.skill_id]);
  }
  USER_SKILLS = map;
}
async function loadAll(){
  await loadUsers();     // usuários primeiro: mapClientRow usa USERS p/ casar nome do GDR
  await Promise.all([loadClients(), loadAgendas(), loadAcordos(), loadSkills(), loadTickets(), loadRecorrencia(), loadAgendaVigente(), loadCancelamentos(), loadAgendaFutura(), loadFerias(), loadFeriados(), loadConfig(), loadPromocoesMes(), loadKanban(), loadAgendaFuturaExcluidas(), loadEbr(), loadSprints(), loadSprintItens(), loadCronogramaFases()]);
  await loadUserSkills(); // depende de SKILLS já carregado
}

function toast(msg, kind='ok'){
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}

// Status que representam contrato encerrado — não contam como carteira ativa
// (dashboard, listas padrão, dropdowns de lançamento/agenda/importação).
const STATUS_ENCERRADOS = ['Concluído com Churn', 'Concluído com Novo Contrato'];
function clienteAtivo(c){ return !STATUS_ENCERRADOS.includes(c.status); }

// "Saldo" exibido usa o valor gravado na planilha (coluna `saldo`) como fonte
// única de verdade — tanto consumeClientHours() (aprovação de horas) quanto
// decideAcordo() (aprovação de ajuste de acordo) escrevem nessa mesma coluna,
// então a tela sempre reflete o valor real do banco, incluindo overrides
// manuais aprovados via acordo de gestão.
function saldo(client){
  if(client.saldoPlanilha !== '' && client.saldoPlanilha !== null && client.saldoPlanilha !== undefined){
    return client.saldoPlanilha;
  }
  return client.horasContratadas - client.horasConsumidas;
}
function saldoPct(client){ return Math.max(0, Math.min(100, (client.horasConsumidas/client.horasContratadas)*100)); }
// Soma horas aprovadas (crm_agendas) de um cliente dentro do mês/ano REAL
// de hoje — zera sozinho todo mês, diferente do saldo total do contrato.
function horasMesAtualDoCliente(clienteId, hojeRef){
  hojeRef = hojeRef || new Date();
  return AGENDAS
    .filter(a => String(a.clienteId)===String(clienteId) && a.status==='aprovada')
    .filter(a => { const d = new Date(a.inicio); return d.getMonth()===hojeRef.getMonth() && d.getFullYear()===hojeRef.getFullYear(); })
    .reduce((soma,a) => soma + (a.horas||0), 0);
}
function userById(id){ return USERS.find(u=>u.id===id); }
function clientById(id){ return CLIENTS.find(c=>String(c.id)===String(id)); }
function pendingAgendasFor(user){
  if(!user) return [];
  if(user.role==='gdr') return AGENDAS.filter(a=>a.status==='pendente' && clientById(a.clienteId)?.gdrId===user.id);
  if(CARGOS_LIDERANCA.includes(user.role)) return AGENDAS.filter(a=>a.status==='pendente');
  return [];
}
// Liderança (Coordenação e equivalentes, Gerência) vê TODAS as solicitações
// pendentes, pra aprovar. GDR vê só as PRÓPRIAS, pra acompanhar o status —
// ele não decide, mas precisa saber que ainda está esperando.
function pendingAcordosFor(user){
  if(!user) return [];
  if(CARGOS_LIDERANCA.includes(user.role)) return ACORDOS.filter(a=>a.status==='pendente');
  if(user.role==='gdr') return ACORDOS.filter(a=>a.status==='pendente' && a.solicitadoPor===user.id);
  return [];
}
function acordoPendenteDoCliente(clienteId){
  return ACORDOS.find(a=>String(a.clienteId)===String(clienteId) && a.status==='pendente') || null;
}

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render(){
  const root = document.getElementById('root');

  // Preserva foco + posição do cursor entre renders: como a árvore inteira é
  // reconstruída via innerHTML a cada mudança de estado, sem isso qualquer
  // <input> perde o foco a cada tecla digitada (obrigando a clicar de novo
  // pra cada letra). Guardamos o estado antes de substituir o HTML e
  // restauramos no elemento equivalente (mesmo id) depois.
  const activeEl = document.activeElement;
  const focoInfo = (activeEl && activeEl.id && root.contains(activeEl) &&
      (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA' || activeEl.tagName === 'SELECT'))
    ? { id: activeEl.id, selStart: activeEl.selectionStart, selEnd: activeEl.selectionEnd }
    : null;

  if(state.view==='loading') root.innerHTML = viewLoading();
  else if(state.view==='login') root.innerHTML = viewLogin();
  else root.innerHTML = viewApp();

  if(focoInfo){
    const el = document.getElementById(focoInfo.id);
    if(el){
      el.focus();
      if(typeof focoInfo.selStart === 'number' && el.setSelectionRange){
        try{ el.setSelectionRange(focoInfo.selStart, focoInfo.selEnd); }catch(e){}
      }
    }
  }
}

async function doLogin(){
  try{
    const emailRaw = (document.getElementById('li-email').value || '').trim();
    const pass = document.getElementById('li-pass').value || '';
    const email = emailRaw.toLowerCase();

    if(!emailRaw && !pass){
      state._err = 'Informe e-mail e senha para continuar.';
      render(); return;
    }
    if(!emailRaw){
      state._err = 'Informe o seu e-mail.';
      render(); return;
    }
    if(!pass){
      state._err = 'Informe a sua senha.';
      render(); return;
    }

    // Mostra a mesma tela de "Conectando…" usada na reconexão automática —
    // login real demora alguns segundos (autenticação + carregar todos os
    // dados iniciais), e sem isso o botão simplesmente não reagia, dando a
    // impressão de estar travado.
    state.view = 'loading'; state.loadError = null; render();

    // Autenticação real via Supabase Auth — a senha nunca trafega em claro
    // para nossas próprias tabelas, e o Supabase cuida do hash/comparação.
    const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
    if(error){
      state.view = 'login';
      state._err = /invalid login credentials/i.test(error.message)
        ? `E-mail ou senha incorretos para "${emailRaw}". Verifique os dados.`
        : 'Erro ao validar login no Supabase: ' + error.message;
      render(); return;
    }

    await afterAuthSuccess(data.user);
  } catch(err){
    state.view = 'login';
    state._err = 'Ocorreu um erro inesperado ao entrar: ' + (err && err.message ? err.message : err);
    render();
  }
}
async function afterAuthSuccess(authUser){
  try{ await loadAll(); }
  catch(err){
    // Importante: usa state.loadError (não state._err) — é isso que a tela
    // de carregamento (viewLoading) sabe mostrar, com botão de tentar de
    // novo. Antes esse erro ficava numa variável que só a tela de LOGIN
    // olha, então a pessoa ficava travada no spinner pra sempre, sem
    // nenhuma explicação do que deu errado.
    state.loadError = (err && err.message) ? err.message : String(err);
    render(); return;
  }
  let perfil = USERS.find(u=>u.id===authUser.id);
  if(!perfil){
    // Primeiro login desta conta — cria a linha de perfil (nome/perfil)
    // usando os metadados definidos no cadastro.
    const nome = (authUser.user_metadata && authUser.user_metadata.nome) || authUser.email.split('@')[0];
    const cargo = (authUser.user_metadata && authUser.user_metadata.perfil) || 'analista';
    const { data, error } = await sb.from('crm_usuarios')
      .insert({ id: authUser.id, nome, email: authUser.email, perfil: cargo })
      .select('id,nome,email,perfil,ativo,created_at').single();
    if(error){
      state.view = 'login';
      state._err = 'Login OK, mas houve erro ao criar seu perfil no CRM: ' + error.message;
      render(); return;
    }
    perfil = mapUserRow(data);
    USERS.push(perfil);
  }
  if(perfil.ativo === false){
    await sb.auth.signOut();
    state.authUser = null; state.view = 'login';
    state._err = 'Sua conta foi desativada. Fale com o RMO ou a Coordenação.';
    render(); return;
  }
  state.authUser = perfil; state.view='app'; state.page = (perfil.role==='rmo' ? 'tickets' : 'dashboard'); state._err=null;
  state._loginEmail = ''; state._loginPass = '';
  toast(`Bem-vindo(a), ${perfil.name.split(' ')[0]} <span style="color:var(--text-2)">· ${ROLES[perfil.role].label}</span>`);
  render();
}
async function logout(){
  if(state.timer.running){ toast('Finalize a agenda em andamento antes de sair.', 'err'); return; }
  await sb.auth.signOut();
  state.authUser=null; state.view='login'; state.page='dashboard'; render();
}

    {k:'usuarios', label:'Usuários', icon:'☺', roles:['coordenacao',...LID,'gerencia']},
  ];
  return items.filter(i=>i.roles.includes(role));
}

function viewApp(){
  const u = state.authUser;
  const items = navItems(u.role);
  const pendingCount = pendingAgendasFor(u).length + pendingAcordosFor(u).length;
  const ticketsAbertos = TICKETS.filter(t=>t.status==='Aberto').length;
  return `
  <div class="app">
    <aside class="sidebar">
      <div class="side-top">
        <div class="brand-mark">P</div>

      <div class="nav-group">Menu</div>
      ${items.map(i=>`
        <div class="nav-item ${state.page===i.k?'active':''}" data-action="goPage" data-args='["${i.k}"]'>
          <span class="ico">${i.icon}</span> ${i.label}
          ${i.k==='aprovacoes' && pendingCount>0 ? `<span class="nav-badge">${pendingCount}</span>`:''}
          ${i.k==='tickets' && u.role==='rmo' && ticketsAbertos>0 ? `<span class="nav-badge">${ticketsAbertos}</span>`:''}
        </div>`).join('')}
      <div class="side-bottom">
        <div class="user-card">
          <div class="avatar" style="background:${colorFor(u.name)}">${initials(u.name)}</div>

          </div>
        </div>
        <button class="btn btn-ghost btn-block btn-sm logout-btn" data-action="logout" data-args='[]'>⎋ Sair</button>
      </div>
    </aside>
    <main class="main">
      ${pageContent()}
    </main>
  </div>
  ${state.modal ? renderModal() : ''}
  `;
}
function goPage(p){ state.page=p; state.selectedClientId=null; render(); }

function pageContent(){
  switch(state.page){
    case 'dashboard': return pageDashboard();
    case 'agenda': return pageAgenda();
    case 'clientes': return state.selectedClientId ? pageClienteDetalhe() : pageClientes();
    case 'lancamento': return pageLancamento();
    case 'importar': return pageImportar();
    case 'skills': return pageSkills();
    case 'disponibilidade': return pageDisponibilidade();
    case 'importador': return pageImportadorCentral();
    case 'feriados': return (state.page='usuarios', pageUsuarios());
    case 'rda': return pageRda();
    case 'ebr': return pageEbr();
    case 'daily': return pageDaily();
    case 'recorrencia': return pageRecorrencia();
    case 'vigente-view': return pageVigenteView();
    case 'futuro-view': return pageFuturoView();
    case 'aprovacoes': return pageAprovacoes();
    case 'usuarios': return pageUsuarios();
    case 'novo-ticket': return pageNovoTicket();
    case 'tickets': return pageTickets();
    default: return pageDashboard();
  }
}

      <div class="kpi-delta flat">Cadastradas</div>
    </div>
  </div>

  <div class="two-col">
    <div class="panel">
      <div class="panel-head">
        <h3>Clientes que atendo</h3>
        <span class="badge badge-info">${meusClientes.length}</span>
      </div>
      <div class="panel-body" style="padding:0;${meusClientes.length>0?'max-height:400px;overflow:auto;':''}">

        <table>

            ${meusClientes.map(c=>`<tr class="tr-hover" style="cursor:pointer" data-action="openClient" data-args='["${c.id}"]'>

function pageDashboard(){
  const u = state.authUser;
  if(u.role==='analista') return pageDashboardAnalista();
  const ativos = CLIENTS.filter(clienteAtivo);
  const myClients = u.role==='gdr' ? ativos.filter(c=>c.gdrId===u.id) : ativos;
  const totalContratadas = myClients.reduce((s,c)=>s+c.horasContratadas,0);
  const totalConsumidas = myClients.reduce((s,c)=>s+c.horasConsumidas,0);
  const totalSaldo = totalContratadas-totalConsumidas;
  const pendentesAgenda = (u.role==='analista'
      ? AGENDAS.filter(a=>a.analistaId===u.id && a.status==='pendente')
      : pendingAgendasFor(u)).map(a => ({ tipo:'agenda', clienteId:a.clienteId, label: fmtH(a.horas)+'h' }));
  // Acordo de gestão entra na mesma lista de "pendências" — pra liderança
  // são coisas a decidir, pro GDR é o que ele mesmo pediu e ainda não saiu
  // resposta (pendingAcordosFor já resolve essa diferença por cargo).
  const pendentesAcordo = pendingAcordosFor(u).map(a => ({ tipo:'acordo', clienteId:a.clienteId, label: 'Ajuste de acordo' }));
  const pendentes = [...pendentesAgenda, ...pendentesAcordo];
  const criticos = myClients.filter(c=>saldoPct(c)>=90);

  const clientesEmReversaoChurn = myClients.filter(c=>c.status==='Reversão Churn');

  // EBR do ciclo atual — mesma janela do RDA, um por cliente ativo da
  // carteira visível (GDR só a própria, liderança todos).
  const { inicio: ebrInicio, fim: ebrFim } = janelaRda(0);
  const ebrPendentes = myClients.filter(c => !EBR.find(e => String(e.clienteId)===String(c.id) && e.cicloInicio===ebrInicio));
  const ebrCriados = myClients.length - ebrPendentes.length;

  // Agendas confirmadas de HOJE, só de clientes da carteira visível.
  const hojeStr = isoDate(new Date());
  const idsClientesVisiveis = new Set(myClients.map(c=>c.id));
  const agendasHoje = AGENDA_VIGENTE
    .filter(a => a.data===hojeStr && a.clienteId && idsClientesVisiveis.has(a.clienteId) && !ehAgendaInterna(a))
    .sort((a,b) => (a.clienteNomePlanilha||'').localeCompare(b.clienteNomePlanilha||''));

  return `
  <div class="topbar">
    <div><h1>Olá, ${u.name.split(' ')[0]} 👋</h1><div class="sub">${fmtDate(new Date())} · <span class="role-badge">${ROLES[u.role].icon} ${ROLES[u.role].label}</span></div></div>
  </div>

  <div class="grid kpi-row">
    <div class="card">
      <div class="kpi-label">Clientes na carteira</div>
      <div class="kpi-value">${myClients.length}</div>
      <div class="kpi-delta flat">Total monitorado</div>
    </div>
    <div class="card">
      <div class="kpi-label">Horas contratadas</div>
      <div class="kpi-value">${fmtH(totalContratadas)}<small> h</small></div>
      <div class="kpi-delta flat">Soma da carteira</div>
    </div>
    <div class="card">
      <div class="kpi-label">Horas consumidas</div>
      <div class="kpi-value">${fmtH(totalConsumidas)}<small> h</small></div>
      <div class="kpi-delta ${totalContratadas? (totalConsumidas/totalContratadas>0.85?'down':'up'):'flat'}">${totalContratadas? Math.round(totalConsumidas/totalContratadas*100):0}% do total</div>
    </div>
    <div class="card">
      <div class="kpi-label">Saldo restante</div>
      <div class="kpi-value">${fmtH(totalSaldo)}<small> h</small></div>
      <div class="kpi-delta ${criticos.length? 'down':'up'}">${criticos.length} cliente(s) em alerta</div>
    </div>
  </div>

  <div class="two-col">
    <div class="panel">
      <div class="panel-head">
        <h3>Clientes em reversão de churn</h3>
        <span class="badge ${clientesEmReversaoChurn.length?'badge-warn':'badge-ok'}">${clientesEmReversaoChurn.length} registro(s)</span>
      </div>
      <div class="panel-body" style="padding:0;${clientesEmReversaoChurn.length>0?'max-height:640px;overflow:auto;':''}">
        ${clientesEmReversaoChurn.length===0 ? emptyState('✅','Nenhum cliente em reversão de churn no momento.') : `
        <table>
          <thead><tr><th>Cliente</th><th>GDR</th><th>Risco</th><th>Etapa</th><th>Ações</th></tr></thead>
          <tbody>
            ${clientesEmReversaoChurn.map(c=>{
              const riscoClasse = c.riscoChurn==='Alto' ? 'badge-danger' : (c.riscoChurn==='Médio' ? 'badge-warn' : 'badge-info');
              return `<tr class="tr-hover">
                <td class="cell-strong">${c.nome}</td>
                <td class="cell-sub">${c.gdrNome||'—'}</td>
                <td>${c.riscoChurn ? `<span class="badge ${riscoClasse}">${c.riscoChurn}</span>` : '<span class="cell-sub">—</span>'}</td>
                <td class="cell-sub">${c.etapaChurn||'—'}</td>
                <td class="cell-sub">${c.acoesChurn||'—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>Pendências ${u.role!=='analista'?'de aprovação':''}</h3>
        <span class="badge ${pendentes.length?'badge-warn':'badge-ok'}">${pendentes.length}</span>
      </div>
      <div class="panel-body">
        ${pendentes.length===0 ? emptyState('✅','Tudo em dia por aqui.') :
          pendentes.slice(0,5).map(a=>{
            const c = clientById(a.clienteId);
            return `<div class="mini-row">
              <span class="mk">${c?.nome}</span>
              <span class="mv mono">${a.label}</span>
            </div>`;
          }).join('') }
        ${pendentes.length>0 && u.role!=='analista' ? `<button class="btn btn-ghost btn-sm btn-block" style="margin-top:14px;" data-action="goPage" data-args='["aprovacoes"]'>Revisar aprovações →</button>` : ''}
      </div>
    </div>
  </div>

  <div class="two-col">
    <div class="panel">
      <div class="panel-head">
        <h3>EBR do ciclo</h3>
        <span class="badge ${ebrPendentes.length?'badge-warn':'badge-ok'}">${ebrPendentes.length} pendente(s)</span>
      </div>
      <div class="panel-body" style="padding:0;${ebrPendentes.length>0?'max-height:320px;overflow:auto;':''}">
        <div class="cell-sub" style="padding:10px 16px;">Ciclo ${fmtDate(ebrInicio)} a ${fmtDate(ebrFim)} · ${ebrCriados} já criado(s)</div>
        ${ebrPendentes.length===0 ? emptyState('✅','Todo mundo com EBR em dia nesse ciclo.') : `
        <table>
          <thead><tr><th>Cliente</th><th></th></tr></thead>
          <tbody>
            ${ebrPendentes.slice(0,8).map(c=>`<tr class="tr-hover">
              <td class="cell-strong">${c.nome}</td>
              <td style="text-align:right;"><button class="btn btn-ghost btn-sm" data-action="abrirModalEbrUrl" data-args='["${c.id}"]'>✎ Adicionar</button></td>
            </tr>`).join('')}
          </tbody>
        </table>`}
        ${ebrPendentes.length>0 ? `<div style="padding:12px 16px;"><button class="btn btn-ghost btn-sm btn-block" data-action="goPage" data-args='["ebr"]'>Ver tudo em EBR →</button></div>` : ''}
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <h3>Agendas de hoje</h3>
        <span class="badge ${agendasHoje.length?'badge-info':'badge-ok'}">${agendasHoje.length}</span>
      </div>
      <div class="panel-body" style="padding:0;${agendasHoje.length>0?'max-height:320px;overflow:auto;':''}">
        ${agendasHoje.length===0 ? emptyState('📆','Nenhuma agenda confirmada pra hoje.') : `
        <table>
          <thead><tr><th>Cliente</th><th>Analista</th><th>Período</th></tr></thead>
          <tbody>
            ${agendasHoje.map(a=>{
              const c = clientById(a.clienteId);
              const nomeAnalista = a.analistaId ? (userById(a.analistaId)?.name||a.analistaNomePlanilha) : a.analistaNomePlanilha;
              return `<tr class="tr-hover" style="cursor:pointer" data-action="openClient" data-args='["${a.clienteId}"]'>
                <td class="cell-strong">${c?.nome||a.clienteNomePlanilha}</td>
                <td class="cell-sub">${nomeAnalista}</td>
                <td class="cell-sub">${a.periodo}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`}
      </div>

  </div>

  <div class="section-title">
    <div><h3>Saúde do banco de horas</h3><div class="sd">Percentual consumido por cliente</div></div>
  </div>
  <div class="panel"><div class="panel-body" style="padding:0;${myClients.length>0?'max-height:640px;overflow:auto;':''}">
    <table>
      <thead><tr><th>Cliente</th><th>GDR</th><th>Contratadas</th><th>Consumidas</th><th>Saldo</th><th style="width:160px;">Consumo</th></tr></thead>
      <tbody>
        ${myClients.map(c=>{
          const pct = saldoPct(c); const cls = pct>=90?'danger':(pct>=70?'warn':'');
          const gdr = userById(c.gdrId);
          return `<tr class="tr-hover" style="cursor:pointer" data-action="openClient" data-args='["${c.id}"]'>
            <td class="cell-strong">${c.nome}<div class="cell-sub">${c.codigo}</div></td>
            <td>${gdr?.name.split(' ').slice(0,2).join(' ') || c.gdrNome || '—'}</td>
            <td class="mono">${fmtH(c.horasContratadas)}h</td>
            <td class="mono">${fmtH(c.horasConsumidas)}h</td>
            <td class="mono" style="color:${saldo(c)<0?'var(--danger)':'inherit'}">${fmtH(saldo(c))}h</td>

function statusBadge(status){
  if(status==='aprovada') return `<span class="badge badge-ok">Aprovada</span>`;
  if(status==='pendente') return `<span class="badge badge-warn">Pendente</span>`;
  if(status==='rejeitada') return `<span class="badge badge-danger">Rejeitada</span>`;
  return `<span class="badge badge-muted">${status}</span>`;
}
function emptyState(icon,text){
  return `<div class="empty"><div class="ei">${icon}</div><b>${text}</b></div>`;
}

// Desconta a sobreposição com o horário de almoço da TOTVS (12:00–13:30) do
// tempo entre 'inicio' e 'fim' — cobre também o caso raro de abranger mais
// de um dia. Usado pro cronômetro do analista: se ele inicia antes do
// almoço e finaliza depois, essa 1h30 não pode contar como trabalhada.
function msDescontandoAlmoco(inicio, fim){
  let totalMs = fim - inicio;
  if (totalMs <= 0) return 0;
  const cursor = new Date(inicio); cursor.setHours(0,0,0,0);
  const fimDia = new Date(fim); fimDia.setHours(0,0,0,0);
  while (cursor <= fimDia){
    const almocoInicio = new Date(cursor); almocoInicio.setHours(12,0,0,0);
    const almocoFim = new Date(cursor); almocoFim.setHours(13,30,0,0);
    const overlapStart = new Date(Math.max(inicio.getTime(), almocoInicio.getTime()));
    const overlapEnd = new Date(Math.min(fim.getTime(), almocoFim.getTime()));
    if (overlapEnd > overlapStart) totalMs -= (overlapEnd - overlapStart);
    cursor.setDate(cursor.getDate()+1);
  }
  return Math.max(0, totalMs);
}

function tickTimer(){

  }, 1000);
}

  const ids = new Set();
  for (const a of AGENDA_VIGENTE) if (a.clienteId) ids.add(a.clienteId);

  return ids;
}

async function criarSprint(){
  if(state.salvandoSprint) return;
  const p = state.modal.payload;
  const dataInicio = document.getElementById('spr-inicio').value;
  const dataFim = document.getElementById('spr-fim').value;
  const objetivo = document.getElementById('spr-objetivo').value.trim();
  if(!dataInicio || !dataFim){ state.sprintErr = 'Informe as duas datas.'; render(); return; }
  if(dataFim < dataInicio){ state.sprintErr = 'A data de fim não pode ser antes da data de início.'; render(); return; }
  if(SPRINTS.some(s=>s.clienteId===p.clienteId && s.status==='aberto')){ state.sprintErr = 'Já existe um sprint aberto pra esse cliente — encerre ele antes de criar outro.'; render(); return; }

  state.salvandoSprint = true; state.sprintErr = null; render();
  try{
    const { data, error } = await sb.from('crm_sprints').insert({
      cliente_id: p.clienteId, data_inicio: dataInicio, data_fim: dataFim, objetivo: objetivo || null,
      status: 'aberto', criado_por: state.authUser.id,
    }).select().single();
    if(error){ state.sprintErr = 'Erro ao criar: ' + error.message; return; }
    SPRINTS.push({ id:data.id, clienteId:data.cliente_id, dataInicio:data.data_inicio, dataFim:data.data_fim, objetivo:data.objetivo, status:data.status, criadoPor:data.criado_por, criadoEm:data.criado_em, encerradoPor:null, encerradoEm:null });
    toast('Sprint criado.');
    state.modal = null;
  } finally {
    state.salvandoSprint = false; render();
  }
}

/* ============================================================
   EXTRAIR TEXTO DE AGENDAS — monta uma mensagem pronta com as agendas do
   cliente no mês de referência (Vigente = confirmado/programado) e o
   saldo atual, pra colar direto num e-mail/WhatsApp pro cliente.
   ============================================================ */
function gerarTextoAgendasCliente(clienteId){
  const c = clientById(clienteId);
  if(!c) return '';
  // O Vigente pode ter mais de um mês ao mesmo tempo (ex: agosto ainda
  // rolando + setembro já promovido) — por isso pega TUDO a partir de
  // hoje (data real), não só o mês de referência mais recente. Senão
  // ficava faltando o resto do mês corrente ainda em andamento.
  const hojeStr = isoDate(new Date());
  const linhas = AGENDA_VIGENTE
    .filter(a => String(a.clienteId)===String(clienteId) && a.data >= hojeStr)
    .sort((a,b) => (a.data||'').localeCompare(b.data||''));

  const dataCurta = iso => { const d = paraDataLocal(iso); return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); };
  const nomeAnalista = a => a.analistaId ? (userById(a.analistaId)?.name.split(' ')[0] || a.analistaNomePlanilha) : (a.analistaNomePlanilha || '—');
  // Saldo redondo mostra sem casa decimal ("480 horas"), fracionado mostra
  // com 1 casa ("480,5 horas") — mais limpo pra colar numa mensagem.
  const saldoNum = saldo(c);
  const saldoTexto = Number.isInteger(Math.round(saldoNum*10)/10)
    ? String(Math.round(saldoNum))
    : fmtH(saldoNum);

  // Se tudo cair no mesmo mês, mantém a saudação nomeando o mês ("Para
  // setembro,..."); se as agendas cruzarem mais de um mês (caso do
  // exemplo: resto de agosto + setembro), usa uma abertura genérica, já
  // que "Para X" não faria sentido com datas de dois meses juntas.
  const mesesUnicos = [...new Set(linhas.map(a=>a.mes))];
  const abertura = mesesUnicos.length===1
    ? `Olá tudo bem? Para ${mesesUnicos[0]}, segue as seguintes agendas programadas:`
    : `Olá tudo bem? Seguem as agendas programadas:`;

  const corpo = linhas.length===0
    ? 'Nenhuma agenda programada a partir de hoje.'
    : linhas.map(a => `📅 ${dataCurta(a.data)} – ${a.periodo} - ${nomeAnalista(a)}`).join('\n');

  return `${abertura}\n\n${corpo}\n\nSaldo atual do Projeto: ${saldoTexto} horas.`;
}

/* ============================================================
   RELATÓRIO DE HORAS DO MÊS (CARTEIRA) — soma as horas aprovadas de cada
   cliente da carteira visível (GDR: só a própria; liderança: todos) no
   mês/ano real de hoje. "Nome: Xh" um por linha, ordenado por quem mais
   consumiu primeiro.
   ============================================================ */
function gerarRelatorioHorasMes(){
  const u = state.authUser;
  let base = CLIENTS.filter(clienteAtivo);
  if (u.role==='gdr') base = base.filter(c=>c.gdrId===u.id);

  const hojeRef = new Date();
  const linhas = base
    .map(c => ({ nome: c.nome, horas: horasMesAtualDoCliente(c.id, hojeRef) }))
    .filter(l => l.horas > 0)
    .sort((a,b) => b.horas - a.horas);

  const mesLabel = MESES_PT[hojeRef.getMonth()];
  const corpo = linhas.length===0
    ? 'Nenhuma hora lançada e aprovada pra nenhum cliente da carteira ainda esse mês.'
    : linhas.map(l => `${l.nome}: ${fmtH(l.horas)}h`).join('\n');
  const total = linhas.reduce((s,l)=>s+l.horas,0);

  return `Horas lançadas em ${mesLabel}/${hojeRef.getFullYear()} — carteira:\n\n${corpo}${linhas.length>0?`\n\nTotal: ${fmtH(total)}h`:''}`;
}

  state.modal = { type:'relatorioHorasMes', payload: { texto: gerarRelatorioHorasMes() } };

}
async function salvarFase(){
  if(state.salvandoFase) return;
  const p = state.modal.payload;
  const fase = document.getElementById('cron-fase').value.trim();
  const dataInicio = document.getElementById('cron-data-inicio').value || null;
  const dataFim = document.getElementById('cron-data-fim').value || null;
  const status = document.getElementById('cron-status').value;
  const responsavel = document.getElementById('cron-responsavel').value.trim();
  const observacao = document.getElementById('cron-observacao').value.trim();
  if(!fase){ state.cronogramaErr = 'Escreva o nome da fase/marco.'; render(); return; }

  state.salvandoFase = true; state.cronogramaErr = null; render();
  try{
    if(p.editandoId){
      const { error } = await sb.from('crm_cronograma_fases').update({
        fase, data_inicio: dataInicio, data_fim: dataFim, status, responsavel: responsavel||null, observacao: observacao||null,
        atualizado_em: new Date().toISOString(),
      }).eq('id', p.editandoId);
      if(error){ state.cronogramaErr = 'Erro ao salvar: ' + error.message; return; }
      const f = CRONOGRAMA_FASES.find(x=>x.id===p.editandoId);
      if(f) Object.assign(f, { fase, dataInicio, dataFim, status, responsavel, observacao });
      toast('Fase atualizada.');
    } else {
      const maiorOrdem = Math.max(0, ...CRONOGRAMA_FASES.filter(f=>String(f.clienteId)===String(p.clienteId)).map(f=>f.ordem));
      const { data, error } = await sb.from('crm_cronograma_fases').insert({
        cliente_id: p.clienteId, fase, data_inicio: dataInicio, data_fim: dataFim, status,
        responsavel: responsavel||null, observacao: observacao||null, ordem: maiorOrdem+1, criado_por: state.authUser.id,
      }).select().single();
      if(error){ state.cronogramaErr = 'Erro ao criar: ' + error.message; return; }
      CRONOGRAMA_FASES.push({ id:data.id, clienteId:data.cliente_id, fase:data.fase, dataInicio:data.data_inicio, dataFim:data.data_fim, status:data.status, responsavel:data.responsavel, observacao:data.observacao, ordem:data.ordem, criadoPor:data.criado_por, criadoEm:data.criado_em, atualizadoEm:data.atualizado_em });
      toast('Fase adicionada.');
    }
    p.formAberto = false;
  } finally {
    state.salvandoFase = false; render();
  }
}
async function excluirFase(id){
  if(!confirm('Excluir essa fase do cronograma?')) return;
  const { error } = await sb.from('crm_cronograma_fases').delete().eq('id', id);
  if(error){ toast('Erro ao excluir: ' + error.message, 'err'); return; }
  CRONOGRAMA_FASES = CRONOGRAMA_FASES.filter(x=>x.id!==id);
  toast('Fase removida.');
  render();
}

/* ============================================================
   IMPORTAR PLANILHA DE AGENDAS (GDR)
   Lê a aba "Visão - Por Cliente" de um .xlsx no formato do
   "CONTROLE GERAL DE AGENDAS ATIVAS", identifica período
   integral/meio via cor da fonte, projeta "Semana N + dia da
   semana" em datas reais (blocos fixos de 7 dias) para o mês
   atual + 3 meses seguintes, e permite criar cada agenda:
   link de convite no Google Agenda + registro em crm_agendas.

   OBS: a extração de cor de fonte não é lida pela biblioteca
   SheetJS gratuita (só a versão paga expõe isso), por isso o
   parser abaixo lê o .xlsx manualmente (é só um .zip de XML)
   via JSZip + DOMParser nativo do navegador.
   ============================================================ */
const IMPORT_WEEKDAY_INDEX = { 'Segunda':1, 'Terça':2, 'Quarta':3, 'Quinta':4, 'Sexta':5 };
const IMPORT_INTEGRAL_COLORS = new Set(['FF38761D','FF6AA84F','FF1B3A5C']);
const IMPORT_MEIO_COLORS = new Set(['FFFF9900','FFE07B00']);
const IMPORT_SHEET_NAME = 'Visão - Por Cliente';

function normalizeName(s){
  return String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')  // remove acentos
    .toLowerCase().trim().replace(/\s+/g,' ');
}

function colToNum(colStr){ let n=0; for(const ch of colStr) n = n*26 + (ch.charCodeAt(0)-64); return n; }
function splitCellRef(ref){ const m = ref.match(/^([A-Z]+)(\d+)$/); return {col: colToNum(m[1]), row: parseInt(m[2],10)}; }

async function parseAgendaXlsxGrid(file){
  const buf = await file.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const parser = new DOMParser();

  const wbXml = await zip.file('xl/workbook.xml').async('string');
  const wbDoc = parser.parseFromString(wbXml, 'application/xml');
  const sheetEls = wbDoc.getElementsByTagName('sheet');
  let targetRid = null;
  for (let i=0;i<sheetEls.length;i++){
    const el = sheetEls[i];
    if (normalizeName(el.getAttribute('name')) === normalizeName(IMPORT_SHEET_NAME)){
      targetRid = el.getAttribute('r:id');
      break;
    }
  }
  if(!targetRid) throw new Error(`Não encontrei a aba "${IMPORT_SHEET_NAME}" neste arquivo.`);

  const relsXml = await zip.file('xl/_rels/workbook.xml.rels').async('string');
  const relsDoc = parser.parseFromString(relsXml, 'application/xml');
  const relEls = relsDoc.getElementsByTagName('Relationship');
  let sheetPath = null;
  for (let i=0;i<relEls.length;i++){
    const el = relEls[i];
    if (el.getAttribute('Id') === targetRid) sheetPath = 'xl/' + el.getAttribute('Target').replace(/^\/?xl\//, '');
  }
  if(!sheetPath || !zip.file(sheetPath)) throw new Error('Não consegui localizar o conteúdo interno da aba no arquivo.');

  let sharedStrings = [];
  const ssFile = zip.file('xl/sharedStrings.xml');
  if(ssFile){
    const ssXml = await ssFile.async('string');
    const ssDoc = parser.parseFromString(ssXml, 'application/xml');
    const siEls = ssDoc.getElementsByTagName('si');
    for (let i=0;i<siEls.length;i++){
      const tEls = siEls[i].getElementsByTagName('t');
      let text=''; for(let j=0;j<tEls.length;j++) text += tEls[j].textContent;
      sharedStrings.push(text);
    }
  }

  const stylesXml = await zip.file('xl/styles.xml').async('string');
  const stylesDoc = parser.parseFromString(stylesXml, 'application/xml');
  const fontEls = stylesDoc.getElementsByTagName('fonts')[0].getElementsByTagName('font');
  const fonts = [];
  for (let i=0;i<fontEls.length;i++){
    const colorEls = fontEls[i].getElementsByTagName('color');
    fonts.push({ rgb: colorEls.length ? colorEls[0].getAttribute('rgb') : null });
  }
  const xfEls = stylesDoc.getElementsByTagName('cellXfs')[0].getElementsByTagName('xf');
  const cellXfs = [];
  for (let i=0;i<xfEls.length;i++) cellXfs.push({ fontId: parseInt(xfEls[i].getAttribute('fontId')||'0',10) });
  function colorForStyle(s){
    if(s===null||s===undefined||s==='') return null;
    const xf = cellXfs[parseInt(s,10)];
    return xf ? (fonts[xf.fontId] ? fonts[xf.fontId].rgb : null) : null;
  }

  const sheetXml = await zip.file(sheetPath).async('string');
  const sheetDoc = parser.parseFromString(sheetXml, 'application/xml');
  const rowEls = sheetDoc.getElementsByTagName('row');
  const grid = {};
  for (let i=0;i<rowEls.length;i++){
    const cEls = rowEls[i].getElementsByTagName('c');
    for (let j=0;j<cEls.length;j++){
      const cEl = cEls[j];
      const ref = cEl.getAttribute('r');
      if(!ref) continue;
      const {col,row} = splitCellRef(ref);
      const t = cEl.getAttribute('t');
      const s = cEl.getAttribute('s');
      let value = null;
      if(t==='s'){
        const vEl = cEl.getElementsByTagName('v')[0];
        if(vEl) value = sharedStrings[parseInt(vEl.textContent,10)];
      } else if(t==='inlineStr'){
        const isEl = cEl.getElementsByTagName('is')[0];
        if(isEl){ const tEls = isEl.getElementsByTagName('t'); let text=''; for(let k=0;k<tEls.length;k++) text+=tEls[k].textContent; value=text; }
      } else {
        const vEl = cEl.getElementsByTagName('v')[0];
        if(vEl) value = vEl.textContent;
      }
      if(value !== null && value !== ''){
        if(!grid[row]) grid[row] = {};
        grid[row][col] = { value, color: colorForStyle(s) };
      }
    }
  }
  return grid;
}

function classifyImportColor(color){
  if (IMPORT_INTEGRAL_COLORS.has(color)) return 'integral';
  if (IMPORT_MEIO_COLORS.has(color)) return 'meio';
  return 'desconhecido';
}

function extractAgendaClients(grid){
  const rows = Object.keys(grid).map(Number).sort((a,b)=>a-b);
  const clients = [];
  let current = null;
  for (const r of rows){
    if (r < 5) continue;
    const rowData = grid[r];
    const bCell = rowData && rowData[2];
    if (!bCell) continue;
    const bText = String(bCell.value);
    const semanaMatch = bText.trim().match(/^Semana\s+(\d)/i);
    if (semanaMatch){
      if (!current) continue;
      const semana = parseInt(semanaMatch[1],10);
      for (const col of Object.keys(IMPORT_WEEKDAY_INDEX_COLS)){
        const cell = rowData[col];
        if (!cell) continue;
        const dia = IMPORT_WEEKDAY_INDEX_COLS[col];
        const rawText = String(cell.value);
        // Algumas células separam múltiplas pessoas por quebra de linha real
        // (\n), outras usam um "/" literal como texto (ex: "Fulano / Ciclano").
        // Sem tratar os dois formatos, o segundo vira um "nome" só (a string
        // inteira grudada), e nenhuma das duas pessoas é reconhecida.
        const pessoasBrutas = rawText.split(/\n|\s*\/\s*/).map(s=>s.trim()).filter(Boolean);
        const categoria = classifyImportColor(cell.color);
        for (const pessoaRaw of pessoasBrutas){
          const anotMatch = pessoaRaw.match(/\((manh[ãa]|tarde)\)/i);
          const anotacao = anotMatch ? (anotMatch[1].toLowerCase().startsWith('manh') ? 'manhã' : 'tarde') : null;
          const nomePessoa = pessoaRaw.replace(/\((manh[ãa]|tarde)\)/i,'').trim();
          if (!nomePessoa || nomePessoa === '—') continue;
          // Às vezes a planilha original tem um número solto no lugar do
          // nome (ex: "1.0", "31.0") — não é um nome real de analista, é
          // lixo de origem. Em vez de virar um "não casado" esquisito na
          // tela, simplesmente ignora e deixa a célula em branco.
          if (/^\d+([.,]\d+)?$/.test(nomePessoa)) continue;
          current.entries.push({ semana, dia, pessoa: nomePessoa, categoria, anotacao });
        }
      }
      continue;
    }
    current = { nome: bText.trim(), entries: [] };
    clients.push(current);
  }
  return clients;
}
const IMPORT_WEEKDAY_INDEX_COLS = { 3:'Segunda', 4:'Terça', 5:'Quarta', 6:'Quinta', 7:'Sexta' };

/* "Semana N" = a N-ésima semana REAL do calendário (segunda a sexta),
   começando no dia 1 do mês (ou pulando pro próximo dia útil se o dia 1
   cair num fim de semana). Se o mês começa no meio da semana (ex: numa
   terça), a Semana 1 fica parcial — os dias anteriores àquele início
   (ex: a "Segunda" da semana 1) simplesmente não existem para esse mês. */
function segundaDaSemanaImport(date){
  const dow = date.getDay(); // 0=Dom,1=Seg,...6=Sáb
  const diff = (dow + 6) % 7; // dias desde a última segunda-feira
  const d = new Date(date);
  d.setDate(d.getDate() - diff);
  return d;
}
function inicioSemana1Import(ano, mesIndex0){
  const dia1 = new Date(ano, mesIndex0, 1);
  const dow = dia1.getDay();
  if (dow === 0 || dow === 6){ // dia 1 cai num fim de semana -> começa na próxima segunda
    const seg = segundaDaSemanaImport(dia1);
    seg.setDate(seg.getDate() + 7);
    return seg;
  }
  return dia1; // dia 1 já é dia útil -> a semana 1 começa nele mesmo (pode ser parcial)
}
function primeiraDataNoBloco(ano, mesIndex0, semana, diaSemanaNome){
  const inicio = inicioSemana1Import(ano, mesIndex0);
  const segundaSemana1 = segundaDaSemanaImport(inicio);
  const segundaAlvo = new Date(segundaSemana1);
  segundaAlvo.setDate(segundaAlvo.getDate() + (semana - 1) * 7);
  const alvoIndex = IMPORT_WEEKDAY_INDEX[diaSemanaNome] - 1; // Segunda=0 ... Sexta=4
  const dataFinal = new Date(segundaAlvo);
  dataFinal.setDate(dataFinal.getDate() + alvoIndex);
  // Segurança extra: a data final tem que cair DENTRO do mês pedido — nunca
  // no mês anterior nem no seguinte. Cobre tanto "semana 1 antes do dia 1"
  // quanto qualquer transbordo do outro lado (ex: semana 5 raríssima).
  if (dataFinal.getFullYear() !== ano || dataFinal.getMonth() !== mesIndex0) return null;
  return dataFinal;
}
function proximosMesesImport(qtd){
  // Começa no PRÓXIMO mês de referência, não no atual — o mês atual já é
  // coberto pelo Cronograma Vigente, não faz sentido reimportar ele aqui.
  const mesIndex0Ref = MESES_PT.indexOf(CONFIG.mesReferencia);
  const anoRef = CONFIG.anoReferencia;
  const out = [];
  for (let i=1;i<=qtd;i++){
    const soma = mesIndex0Ref + i;
    const ano = anoRef + Math.floor(soma/12);
    const mesIndex0 = ((soma % 12) + 12) % 12;
    out.push({ ano, mesIndex0 });
  }
  return out;
}
function periodoHorario(categoria, anotacao){
  // Integral cruza o horário de almoço da TOTVS (12:00–13:30, 1h30) — por
  // isso não são 9,5h corridas, e sim 8h de trabalho de fato.
  if (categoria === 'integral') return { label:'Integral', inicio:'08:30', fim:'18:00', horas:8 };
  if (anotacao === 'tarde') return { label:'Tarde', inicio:'13:30', fim:'18:00', horas:4.5 };
  return { label:'Manhã', inicio:'08:30', fim:'12:00', horas:3.5 }; // default p/ meio período sem anotação
}
function isoDate(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }

function matchClienteCarteira(nomePlanilha, gdrUser){
  const alvo = normalizeName(nomePlanilha);
  const carteira = CLIENTS.filter(c => c.gdrId === gdrUser.id && clienteAtivo(c));
  return carteira.find(c => normalizeName(c.nome) === alvo)
      || carteira.find(c => normalizeName(c.nome).includes(alvo) || alvo.includes(normalizeName(c.nome)));
}
function matchAnalistaUsuario(nomePlanilha){
  const alvo = normalizeName(nomePlanilha);
  const analistas = USERS.filter(u=>u.role==='analista');
  let m = analistas.find(u=>normalizeName(u.name)===alvo);
  if (m) return m;
  m = analistas.find(u=>normalizeName(u.name).startsWith(alvo) || alvo.startsWith(normalizeName(u.name)));
  if (m) return m;
  // Nomes abreviados (ex: "Andreza Rocha") pulam nomes do meio do nome
  // completo ("Andreza Suelem Duarte Rocha") — compara só 1º + último nome.
  const partsAlvo = alvo.split(' ').filter(Boolean);
  if (partsAlvo.length >= 2){
    const primeiroAlvo = partsAlvo[0], ultimoAlvo = partsAlvo[partsAlvo.length-1];
    m = analistas.find(u=>{
      const partsU = normalizeName(u.name).split(' ').filter(Boolean);
      return partsU.length>=2 && partsU[0]===primeiroAlvo && partsU[partsU.length-1]===ultimoAlvo;
    });
  }
  return m || null;
}
function splitEmails(raw){
  return String(raw||'').split(/[,;]/).map(s=>s.trim()).filter(s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s));
}

async function processarImportacao(file){
  const u = state.authUser;
  state.importCarregando = true; state.importErro = null; state.importLinhas = null; state.importCriadas = {};
  render();
  try{
    const grid = await parseAgendaXlsxGrid(file);
    const clientesPlanilha = extractAgendaClients(grid);
    const meses = proximosMesesImport(3);
    const linhas = [];
    let idSeq = 1;

    for (const cp of clientesPlanilha){
      const clienteCrm = matchClienteCarteira(cp.nome, u);
      if (!clienteCrm) continue; // só clientes da carteira deste GDR
      for (const entry of cp.entries){
        const periodo = periodoHorario(entry.categoria, entry.anotacao);
        for (const mes of meses){
          const dt = primeiraDataNoBloco(mes.ano, mes.mesIndex0, entry.semana, entry.dia);
          if (!dt) continue;
          const analistaCrm = matchAnalistaUsuario(entry.pessoa);
          linhas.push({
            id: 'imp'+(idSeq++),
            clienteId: clienteCrm.id,
            clienteNome: clienteCrm.nome,
            data: isoDate(dt),
            dataObj: dt,
            dia: entry.dia,
            semana: entry.semana,
            categoria: entry.categoria,
            periodoLabel: periodo.label,
            periodoEditavel: entry.categoria==='meio' && !entry.anotacao,
            horaInicio: periodo.inicio,
            horaFim: periodo.fim,
            horas: periodo.horas,
            pessoaPlanilha: entry.pessoa,
            analistaId: analistaCrm ? analistaCrm.id : null,
            analistaNome: analistaCrm ? analistaCrm.name : entry.pessoa + ' (não cadastrado no CRM)',
          });
        }
      }
    }
    linhas.sort((a,b)=> a.clienteNome.localeCompare(b.clienteNome) || new Date(a.data)-new Date(b.data));
    state.importLinhas = linhas;
    if (linhas.length===0) toast('Nenhum cliente da sua carteira foi encontrado nesta planilha.', 'err');
    else toast(`${linhas.length} agenda(s) identificada(s) para os próximos 4 meses.`);
  } catch(err){
    state.importErro = err && err.message ? err.message : String(err);
    toast('Erro ao processar a planilha: ' + state.importErro, 'err');
  } finally {
    state.importCarregando = false;
    render();
  }
}

async function criarAgendaLinha(linhaId){
  const l = state.importLinhas.find(x=>x.id===linhaId);
  if(!l || state.importCriadas[linhaId]) return;
  const u = state.authUser;
  const cliente = clientById(l.clienteId);

  // 1) Link do Google Agenda pré-preenchido
  const emails = new Set();
  splitEmails(cliente && cliente.email).forEach(e=>emails.add(e));
  if (u.email) emails.add(u.email);
  const analistaUser = l.analistaId ? userById(l.analistaId) : null;
  if (analistaUser && analistaUser.email) emails.add(analistaUser.email);

  const dataCompacta = l.data.replace(/-/g,'');
  const gcalDates = `${dataCompacta}T${l.horaInicio.replace(':','')}00/${dataCompacta}T${l.horaFim.replace(':','')}00`;
  const titulo = `Atendimento — ${cliente ? cliente.nome : l.clienteNome} (${l.analistaNome})`;
  const detalhes = `Agenda importada do controle de agendas ativas.\nPeríodo: ${l.periodoLabel} (${l.horaInicio}–${l.horaFim})\nAnalista: ${l.analistaNome}\nGDR: ${u.name}`;
  const gcalUrl = 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(titulo)
    + '&dates=' + gcalDates
    + '&details=' + encodeURIComponent(detalhes)
    + (emails.size ? '&add=' + encodeURIComponent([...emails].join(',')) : '');
  window.open(gcalUrl, '_blank');

  // 2) Registro interno em crm_agendas (só quando o analista está cadastrado no CRM)
  if (l.analistaId){
    const payload = {
      cliente_id: Number(l.clienteId), analista_id: l.analistaId, origem: 'manual',
      inicio: `${l.data}T${l.horaInicio}:00`, fim: `${l.data}T${l.horaFim}:00`,
      horas: l.horas, status: 'aprovada', criado_por: u.id, aprovado_por: u.id,
      descricao: `Importado da planilha de agendas ativas — ${l.periodoLabel}.`,
    };
    const { data: inserted, error } = await sb.from('crm_agendas').insert(payload).select().single();
    if (error){
      toast('Convite do Google Agenda aberto, mas houve erro ao registrar a agenda no CRM: ' + error.message, 'err');
    } else {
      AGENDAS.unshift(mapAgendaRow(inserted));
      try{ await consumeClientHours(l.clienteId, l.horas); await loadClients(); }
      catch(err){ toast('Agenda registrada, mas houve erro ao atualizar o saldo do cliente: ' + err.message, 'err'); }
      toast(`Agenda criada e registrada: ${fmtH(l.horas)}h para ${cliente ? cliente.nome : l.clienteNome}.`);
    }
  } else {
    toast('Convite do Google Agenda aberto. Como o analista não está cadastrado no CRM, a agenda não foi registrada internamente.', 'err');
  }
  state.importCriadas[linhaId] = true;
  render();
}

/* ============================================================
   DISPONIBILIDADE POR SKILL
   Cruza duas fontes para achar a próxima data livre do mês atual:
   - "Setup": aba "Visão - Por Cliente" (grade recorrente colorida) —
     mesmo parser usado em Importar Planilha.
   - "Vigente": aba "Agenda" do Cronograma Vigente — tabela achatada,
     uma linha por (analista, data, cliente/atividade), sem cor.
   ============================================================ */
const MESES_PT = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

// Código-fonte do Worker como texto (roda isolado da thread principal, via
// Blob). Extrai as linhas do mês atual das abas "Agenda" e "Cancelamentos"
// já em formato estruturado (não só um mapa de ocupação), pra permitir
// persistir no banco. Mantido como string porque um Worker não tem acesso
// direto às funções da página — precisa carregar a própria cópia do XLSX.
const VIGENTE_WORKER_SRC = `
importScripts('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');
function isoDateW(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function toDate(cell){ const dt = cell instanceof Date ? cell : new Date(cell); return isNaN(dt.getTime()) ? null : dt; }
// Duração pelo período (desconta almoço no Integral) — só quando o período
// é "Horas" (custom) é que a coluna N ("Preencher quantas horas") entra em
// jogo; nos outros 3 períodos ela sempre vem vazia/zero na planilha.
function horasPorPeriodoW(periodo, colunaN){
  if (periodo === 'Integral') return 8;
  if (periodo === 'Manhã') return 3.5;
  if (periodo === 'Tarde') return 4.5;
  if (periodo === 'Horas') return parseFloat(String(colunaN||'0').replace(',','.')) || 0;
  return 0;
}

onmessage = function(e){
  try{
    const { buf } = e.data;
    const wb = XLSX.read(buf, { type:'array', sheets:['Agenda','Cancelamentos'], cellDates:true });

    const agenda = [];
    const wsA = wb.Sheets['Agenda'];
    if(wsA){
      // Só as colunas A–N (índices 0–13) são consideradas, por pedido —
      // Status (O) e Horas alocadas (P) ficam de fora. Não filtra por mês
      // aqui — a planilha pode trazer mais de um mês junto (ex: mês atual +
      // mês seguinte já lançado), então cada linha guarda o mês/ano dela
      // mesma e quem chama decide o que fazer com cada um.
      const rows = XLSX.utils.sheet_to_json(wsA, { header:1 });
      for (let i=1; i<rows.length; i++){
        const row = rows[i];
        if(!row || !row[0] || !row[4]) continue;
        const mes = String(row[5]||'').toLowerCase().trim();
        const ano = Number(row[6]);
        if (!mes || !ano) continue;
        const dt = toDate(row[4]);
        if (!dt) continue;
        const periodo = row[12]||null;
        agenda.push({
          analista: String(row[0]||'').trim(), cliente: String(row[1]||'').trim(), gdr: String(row[3]||'').trim(),
          data: isoDateW(dt), periodo, tipoAgenda: row[7]||null,
          horas: horasPorPeriodoW(periodo, row[13]),
          mes, ano,
        });
      }
    }

    const cancelamentos = [];
    const wsC = wb.Sheets['Cancelamentos'];
    if(wsC){
      const rows = XLSX.utils.sheet_to_json(wsC, { header:1 });
      for (let i=1; i<rows.length; i++){
        const row = rows[i];
        if(!row || !row[0] || !row[4]) continue;
        const mes = String(row[5]||'').toLowerCase().trim();
        const ano = Number(row[6]);
        if (!mes || !ano) continue;
        const dt = toDate(row[4]);
        if (!dt) continue;
        const dtCanc = toDate(row[13]);
        cancelamentos.push({
          analista: String(row[0]||'').trim(), cliente: String(row[1]||'').trim(), gdr: String(row[3]||'').trim(),
          data: isoDateW(dt), dataCancelamento: dtCanc ? isoDateW(dtCanc) : null,
          tipoAgenda: row[7]||null, periodo: row[9]||null,
          horas: parseFloat(String(row[11]||'0').replace(',','.')) || 0,
          comAntecedencia: row[14]||null, causador: row[15]||null,
          statusJustificativa: row[16]||null, justificativa: row[17]||null,
          mes, ano,
        });
      }
    }

    postMessage({ agenda, cancelamentos });
  } catch(err){
    postMessage({ error: String(err && err.message ? err.message : err) });
  }
};
`;

function parseVigenteViaWorker(buf){
  return new Promise((resolve, reject) => {
    if (typeof Worker === 'undefined'){ reject(new Error('Worker indisponível neste navegador.')); return; }
    let worker;
    try{
      const blob = new Blob([VIGENTE_WORKER_SRC], { type:'application/javascript' });
      worker = new Worker(URL.createObjectURL(blob));
    } catch(err){ reject(err); return; }
    const timeout = setTimeout(()=>{ worker.terminate(); reject(new Error('Tempo esgotado processando no worker.')); }, 60000);
    worker.onmessage = (e) => {
      clearTimeout(timeout); worker.terminate();
      if (e.data && e.data.error) reject(new Error(e.data.error));
      else resolve(e.data);
    };
    worker.onerror = (e) => {
      clearTimeout(timeout); worker.terminate();
      reject(new Error(e.message || 'Erro desconhecido no worker.'));
    };
    // buf é transferido (zero-cópia), não copiado — mais rápido pra arquivos grandes.
    try{ worker.postMessage({ buf }, [buf]); }
    catch(err){ worker.postMessage({ buf }); } // navegador sem suporte a transferable nesse caso
  });
}

function horasPorPeriodo(periodo, colunaN){
  if (periodo === 'Integral') return 8;
  if (periodo === 'Manhã') return 3.5;
  if (periodo === 'Tarde') return 4.5;
  if (periodo === 'Horas') return parseFloat(String(colunaN||'0').replace(',','.')) || 0;
  return 0;
}

function parseVigenteSync(buf){
  // Só as abas "Agenda" e "Cancelamentos" são lidas — o arquivo tem outras
  // 6 abas (Disponibilidade, Baseline, Gráfico de Gantt etc.) que não
  // usamos aqui, e processá-las custava a maior parte do tempo.
  const wb = XLSX.read(buf, { type:'array', sheets:['Agenda','Cancelamentos'], cellDates:true });

  const agenda = [];
  const wsA = wb.Sheets['Agenda'];
  if(wsA){
    // Só as colunas A–N (índices 0–13) são consideradas — Status (O) e
    // Horas alocadas (P) ficam de fora; horas vêm do período (Integral/
    // Manhã/Tarde = duração fixa; "Horas" = valor customizado da coluna N).
    // Não filtra por mês — a planilha pode trazer mais de um mês junto.
    const rows = XLSX.utils.sheet_to_json(wsA, { header:1 });
    for (let i=1; i<rows.length; i++){
      const row = rows[i];
      if(!row || !row[0] || !row[4]) continue;
      const mes = String(row[5]||'').toLowerCase().trim();
      const ano = Number(row[6]);
      if (!mes || !ano) continue;
      const dataCell = row[4];
      const dt = dataCell instanceof Date ? dataCell : new Date(dataCell);
      if (isNaN(dt.getTime())) continue;
      const periodo = row[12]||null;
      agenda.push({
        analista: String(row[0]||'').trim(), cliente: String(row[1]||'').trim(), gdr: String(row[3]||'').trim(),
        data: isoDate(dt), periodo, tipoAgenda: row[7]||null,
        horas: horasPorPeriodo(periodo, row[13]),
        mes, ano,
      });
    }
  }

  const cancelamentos = [];
  const wsC = wb.Sheets['Cancelamentos'];
  if(wsC){
    const rows = XLSX.utils.sheet_to_json(wsC, { header:1 });
    for (let i=1; i<rows.length; i++){
      const row = rows[i];
      if(!row || !row[0] || !row[4]) continue;
      const mes = String(row[5]||'').toLowerCase().trim();
      const ano = Number(row[6]);
      if (!mes || !ano) continue;
      const dataCell = row[4];
      const dt = dataCell instanceof Date ? dataCell : new Date(dataCell);
      if (isNaN(dt.getTime())) continue;
      const dcCell = row[13];
      const dtc = dcCell instanceof Date ? dcCell : (dcCell ? new Date(dcCell) : null);
      cancelamentos.push({
        analista: String(row[0]||'').trim(), cliente: String(row[1]||'').trim(), gdr: String(row[3]||'').trim(),
        data: isoDate(dt), dataCancelamento: (dtc && !isNaN(dtc.getTime())) ? isoDate(dtc) : null,
        tipoAgenda: row[7]||null, periodo: row[9]||null,
        horas: parseFloat(String(row[11]||'0').replace(',','.')) || 0,
        comAntecedencia: row[14]||null, causador: row[15]||null,
        statusJustificativa: row[16]||null, justificativa: row[17]||null,
        mes, ano,
      });
    }
  }

  return { agenda, cancelamentos };
}

async function parseVigenteParaImportar(file){
  const buf = await file.arrayBuffer();

  // Roda num Web Worker sempre que possível: o parse é pesado e síncrono,
  // então rodando na thread principal a página fica visualmente travada
  // (nem CSS anima) até terminar. No worker, a UI (spinner, mensagens)
  // continua respondendo normalmente enquanto processa em segundo plano.
  try{
    return await parseVigenteViaWorker(buf);
  } catch(workerErr){
    console.warn('Worker indisponível/falhou, processando na thread principal:', workerErr);
    return parseVigenteSync(buf);
  }
}
